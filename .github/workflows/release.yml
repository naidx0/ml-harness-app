# THE INSTALLER, BUILT AND MEASURED — and signed only if there is something to
# sign with.
#
# `docs/THE_PLAN.md` V.4 makes the size a measurement rather than a claim:
# *"ROADMAP.md's '~5-10 MB' is wrong for the shipped product. That is the shell
# alone. Realistic target 30-70 MB. Build one and measure before writing a
# number - invariant 5."* This job builds one on a runner and writes the real
# number into the run summary, so the figure in the plan is one anybody can
# re-derive rather than one somebody remembered.
#
# ## Signing, said honestly
#
# Phase C's remaining blocker is a certificate: it needs an identity and money,
# and no workflow can conjure one. So this is built to be ONE SECRET AWAY -
# set `WINDOWS_CERTIFICATE_THUMBPRINT` to a thumbprint in the runner's store
# and the bundle is signed; leave it unset and the bundle is built unsigned and
# SAYS SO, in the summary and in the artifact's own name.
#
# The thumbprint is passed with `--config` rather than committed into
# `tauri.conf.json`, so the repository never carries a certificate identifier
# and an unsigned build is not one edit away from claiming otherwise.
#
# **A signed build is verified, not assumed.** `signtool verify /pa` runs after
# the bundle and the job FAILS if it does not pass. A release that says signed
# and is not is worse than one that says unsigned, because the first is a claim
# somebody will rely on.
#
# ## What this is still not
#
# It is not the clean-machine test. A runner is a fresh machine, which is most
# of it, and it is not a person - and V.4's other standing condition,
# *"antivirus does not block it"*, is not a build-time check at all. It accrues
# over consecutive signed releases and can only be observed after shipping.

name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  installer:
    name: build the installer and measure it
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The same floor the gate runs on. `scripts/stage_bundle.py` builds
          # the wheel that goes in the bundle, and the wheel the installer
          # ships should be built the way the wheel the gate proves is.
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # ITS OWN STEP, and that is not tidiness. `beforeBuildCommand` cannot run
      # `npm ci`: ci DELETES node_modules, and node_modules is where the tauri
      # CLI executing that very command lives, so it unlinks itself mid-build
      # and fails with EPERM. Measured here on 2026-08-28. Dependencies are the
      # caller's step; the build command builds.
      # The interface is the `web` workspace; its dependencies install
      # hoisted from the root lockfile (.npmrc), so ci runs at the root.
      - name: Install the interface's dependencies
        run: npm ci

      - name: Decide whether this build can be signed
        id: signing
        shell: bash
        env:
          THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if [ -n "$THUMBPRINT" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "A certificate thumbprint is configured; this build will be signed and verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "**UNSIGNED BUILD.** No \`WINDOWS_CERTIFICATE_THUMBPRINT\` secret is set, so this installer is not signed. SmartScreen will warn on it. THE_PLAN Phase C: signing needs a certificate, which needs an identity and money." >> "$GITHUB_STEP_SUMMARY"
          fi

      # FAIL BEFORE THE COMPILE, NOT AFTER IT — measured 2026-08-28 with a
      # throwaway certificate, which is the only way this was ever going to be
      # found before a real release.
      #
      # Tauri's Windows bundler locates `signtool.exe` through ONE route: the
      # 64-bit registry value `HKLM\SOFTWARE\Microsoft\Windows Kits\Installed
      # Roots\KitsRoot10`, then `bin\<version>\<arch>\signtool.exe` under it. It
      # does NOT look on PATH, and it does NOT skip the lookup when
      # `signCommand` is given instead of a thumbprint — both were driven here
      # and both failed identically. On the machine this was measured on, that
      # registry value names `C:\Program Files\Windows Kits\10\`, which exists
      # and contains no `bin\` at all, while the real SDK sits under
      # `Program Files (x86)`. The result is `failed to bundle project: SignTool
      # not found` AFTER a full release compile, with a message that names
      # neither the registry key nor the path it read.
      #
      # So this asks the same question Tauri will ask, before spending ninety
      # seconds discovering the answer, and says what to do about it.
      - name: Check signtool is discoverable the way Tauri looks for it
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $root = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots" -ErrorAction SilentlyContinue).KitsRoot10
          if (-not $root) { throw "no KitsRoot10 in the 64-bit registry: Tauri has no way to find signtool, and a signed build will fail after the compile." }
          $found = Get-ChildItem (Join-Path $root "bin") -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
          if (-not $found) {
            throw "KitsRoot10 is '$root' and there is no signtool.exe under its bin\. Tauri reads THIS value and nothing else - not PATH - so a signed build would fail with 'SignTool not found' after a full compile. Install the Windows SDK signing tools, or correct KitsRoot10 to the SDK that is actually installed."
          }
          "signtool Tauri will find: $($found[0].FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # `beforeBuildCommand` runs `scripts/stage_bundle.py`, which fetches and
      # checksum-verifies the uv sidecar and builds the wheel into
      # `bundle.resources`. Neither is committed, so this step is where they
      # come from. The CLI runs from the repository root: `web` is an npm
      # workspace, so `npm --prefix web exec` would run there anyway, and the
      # before-build paths in tauri.conf.json are written for the root.
      - name: Build the bundle (unsigned)
        if: steps.signing.outputs.signed == 'false'
        run: npx tauri build

      - name: Build the bundle (signed)
        if: steps.signing.outputs.signed == 'true'
        run: >
          npx tauri build
          --config '{"bundle":{"windows":{"certificateThumbprint":"${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}'

      # THE CLAIM IS CHECKED. A job that said "signed" because a secret was
      # present would be trusting the thing it is supposed to prove.
      - name: Verify the signature
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                  Where-Object FullName -like "*x64*" | Select-Object -First 1
          if (-not $tool) { throw "signtool.exe not found on this runner, so the signature cannot be verified" }
          $bundles = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe, *.msi
          if (-not $bundles) { throw "no installer was produced" }
          foreach ($b in $bundles) {
            & $tool.FullName verify /pa $b.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($b.Name) is not validly signed" }
          }

      # INVARIANT 5, as a step. The number goes in the summary of the run that
      # produced the file, which is the only place it cannot drift from it.
      - name: Measure what shipped
        shell: pwsh
        run: |
          $signed = "${{ steps.signing.outputs.signed }}"
          "## The installer, measured"                         | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          ""                                                   | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "| artifact | MB | signed |"                         | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "|---|---:|---|"                                     | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe, *.msi | ForEach-Object {
            "| $($_.Name) | $([math]::Round($_.Length / 1MB, 1)) | $signed |" |
              Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          "" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "THE_PLAN V.4 estimated 30-70 MB for the shipped product against ROADMAP.md's ~5-10 MB, which was the shell alone. This table is the measurement." |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          # The name carries the fact. Somebody downloading this from a run
          # should not have to read the summary to learn it is unsigned.
          name: >-
            ml-harness-installer-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'UNSIGNED' }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # THE MAC BUILD, AND THE MAC INSTALL, ON A REAL MAC. Jaden, 2026-10-03: "make
  # sure ml harness is available on mac as well". No one on this project has a
  # Mac, so a runner is the Mac: it builds the .dmg, then installs it the way a
  # person would with the one line (install.sh, pointed at this .dmg), with
  # Ollama and a small model, and checks the app's engine answered and the
  # model connected. Unsigned and not notarized: that needs an Apple Developer
  # ID, which costs money and is the owner's call. A .dmg from a browser is
  # then blocked by Gatekeeper until right-click > Open; the one line is not,
  # because curl sets no quarantine flag.
  macos:
    name: build the .dmg and install it (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the interface's dependencies
        run: npm ci

      # tauri.macos.conf.json is merged in by the CLI on a Mac: app + dmg
      # targets, the native traffic lights, python3 for the build step.
      - name: Build the bundle (unsigned)
        run: npx tauri build

      - name: Name the .dmg for its platform and write its SHA-256
        id: dmg
        run: |
          set -eu
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          built=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          name="ML-Harness-${version}-macos-${{ matrix.arch }}.dmg"
          mkdir -p out
          cp "$built" "out/$name"
          (cd out && shasum -a 256 "$name" > "$name.sha256")
          echo "path=$PWD/out/$name" >> "$GITHUB_OUTPUT"
          {
            echo "## macOS ${{ matrix.arch }}, measured"
            echo ""
            echo "| artifact | MB | signed |"
            echo "|---|---:|---|"
            echo "| $name | $(du -m "out/$name" | cut -f1) | no |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The one line, as a person runs it, against the .dmg this job built.
      # qwen3.5:0.8b keeps the pull small on a runner; the default is 4b.
      - name: Install it with the one line, with Ollama and a model
        env:
          MLH_DMG: ${{ steps.dmg.outputs.path }}
          MLH_MODEL: qwen3.5:0.8b
        run: |
          set -eu
          start=$(date +%s)
          sh install.sh 2>&1 | tee install.log
          echo "install.sh: $(( $(date +%s) - start )) s from the line to an open app with a model connected" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the engine answered and the model is the one in use
        run: |
          set -eu
          file="$HOME/.local/share/ml-harness/engine.json"
          test -f "$file"
          base=$(sed -n 's/.*"base_url": *"\([^"]*\)".*/\1/p' "$file" | head -n 1)
          token=$(sed -n 's/.*"token": *"\([^"]*\)".*/\1/p' "$file" | head -n 1)
          curl -fs "$base/health" > /dev/null
          rows=$(curl -fs -H "Authorization: Bearer $token" "$base/api/providers")
          echo "$rows"
          echo "$rows" | tr '{' '\n' | grep '"model": *"qwen3.5:0.8b"' | grep -q '"is_active": *1'
          echo "engine answered at $base and qwen3.5:0.8b is the model in use" >> "$GITHUB_STEP_SUMMARY"

      # A first task on the runner's CPU with the small model. Reported, not
      # gated: a 0.8B model on a shared CPU is a weaker bar than a person's Mac.
      - name: A first task (iris), with no project folder
        continue-on-error: true
        run: |
          py="$HOME/.local/share/ml-harness/python/bin/python"
          "$py" scripts/smoke_small_task.py --task iris --no-folder --budget 1200 --out iris.json | tee iris.txt
          echo "iris on the runner: $(cat iris.txt)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-harness-macos-${{ matrix.arch }}-UNSIGNED
          path: |
            out/*
            install.log
            iris.json
          if-no-files-found: warn
