# ML Harness - Diagnosis Engine
# The decision tree from a user's stated goal to a recommended method.
# Deterministic, auditable, cheapest-first. Every node is a pure function of Facts.
# Terminal outcomes prefixed NO_TRAIN__ / NO_ML__ / NO_DEEP__ / NO_LLM__ are the honest answers.
# Citations live in `evidence:` fields and resolve against `sources:` at the bottom.
#
# ===========================================================================
# THE INVARIANT. READ THIS BEFORE CHANGING ANY NODE.
# ===========================================================================
#
# No user is ever told to train unless all five gates have been passed on the
# path that reached the recommendation.
#
# That sentence is the entire product. Unsloth Studio and Unsloth Desktop are
# free, local, open-source and faster than anything we would write; see
# docs/COMPETITION.md. We do not compete on training. We compete on being the
# only thing in the landscape that will tell a user not to train. If a TRAIN
# verdict can be reached without the gates, we are shipping the claim without
# the guarantee, and we have nothing.
#
# The structure below enforces it mechanically, not by convention:
#
#   1. No node emits a TRAIN verdict. Nodes that conclude training is warranted
#      set `propose: <METHOD>` and route to stage_9_method_selector. A proposal
#      is a candidate, not an answer.
#   2. Exactly one node in this file mints a TRAIN verdict:
#      S9_MINT_TRAIN_VERDICT. It is the last node of stage 9.
#   3. Stage 9 opens with S9_GATE_SWEEP, which evaluates every gate in
#      `contract.required_gates` that the path has not already passed UNDER THE
#      ROW THAT APPLIES TO THE PROPOSED METHOD'S CLASS. A gate that fails routes
#      to the cheaper remedy and the proposal dies.
#   4. Passing a gate is the only event that writes a gate entry into `path`, and
#      that entry records WHICH `passes_when` row was used. S9_MINT_TRAIN_VERDICT
#      will not fire unless all five gates appear in `path` under the row the
#      proposed method's class requires. A gate passed under a different row does
#      not count; it is re-evaluated. See contract.path_semantics.latching.
#
# So the guarantee is a property of the graph, not of anyone's diligence. Two
# greps and four assertions check it; see `static_checks` and `runtime_checks`.
#
# A REACHABILITY CLAUSE, WHICH IS HALF OF THE SAME PROMISE. Every one of the nine
# TRAIN__ outcomes must be reachable by some consistent set of facts, and every
# one of those paths must pass all five gates. Both halves, always. An outcome
# that no run can reach satisfies the gate property vacuously, and a vacuous
# guarantee is a lie with a test behind it. Four of the nine were dead when this
# was written - see `shadowing_rule` and RC5_FIXTURE_COVERAGE.
#
# AND IT APPLIES TO EVERY OUTCOME, NOT ONLY THE TRAIN__ ONES. A dead NO_LLM__ or
# NO_DEEP__ outcome is the same defect wearing a prefix that nobody checks: it is
# an answer the product claims to be able to give and cannot. The reachability
# test was scoped to TRAIN__ outcomes, which is why three no-train outcomes could
# be killed in the pass that was commissioned to stop outcomes being killed.
# Scope it to every terminal outcome in this file.
#
# AND A THIRD HALF, WHICH WAS MISSING ENTIRELY. A gate is only as true as the
# facts it reads. Both clauses above are about the SHAPE of the graph, and a
# graph of perfect shape fed asserted facts gives a perfect TRAIN verdict to a
# user who has done none of the work. Not hypothetical either: a provider that
# merely CLAIMED eval_size_n, baseline_measured, baseline_score,
# prompt_iterations, retrieval_tried and model_swap_tried got TRAIN__LORA_SFT
# with all five gates green, and every structural check in this file was
# satisfied while it happened. So every value now carries an ORIGIN, and a fact
# may only satisfy a gate if its origin is one the ledger's own `source:` tag
# admits. See `fact_origins` below, and RC10_AN_ASSERTION_NEVER_MINTS - which is
# RC1 asked from the other side. RC1 checks that the gates were passed. RC10
# checks that passing them meant anything.
#
# WHAT NOT TO DO. Do not add `outcome: TRAIN__...` to a node. Do not add a sixth
# way to leave stage 9. Do not reclassify a training recommendation as TEACH__
# or NO_DEEP__ to get it past a gate - that removes the guarantee while keeping
# the claim, which is worse than having neither.
#
# Prior structure, for anyone reading a diff: TRAIN__ outcomes used to be emitted
# from six different stages while only stage 9 checked the gates.
# TRAIN__TABULAR_DEEP was reachable having passed one gate of five, because
# S0_MODALITY_FORK routes tabular straight to stage 8. That was fixed in the
# previous pass.
#
# Fixed in THIS pass, all four found by hand-tracing the graph rather than by
# reading it:
#   - Four TRAIN__ outcomes were dead. DISTILLATION, EMBEDDING_FINETUNE,
#     TABULAR_DEEP and FULL_FINETUNE each sat below an earlier terminal node in
#     their own stage whose condition their own condition implied, so no run could
#     reach them and their five-gate property was vacuously true. Stage 1, stage 3,
#     stage 7 and stage 8 are reordered and their general cases now carry the
#     negation of the specific case. See `shadowing_rule`.
#   - The gate-latching rule had a live bypass. `path` was a list of bare strings,
#     so a gate passed under one method class was indistinguishable from a gate
#     passed under another, and stage 9 skipped it. `path` now carries which row
#     each gate was passed under, and the sweep re-evaluates on divergence.
#   - methods.UNSET claimed llm_weights was "the strictest row". It is not, and
#     there is no strictest row. The claim is replaced by the mechanism that makes
#     it unnecessary.
#   - required_rank was compared to the number 256 while the table it derives from
#     held strings like "64-256". Nothing compares required_rank to a number now.
#
# Fixed in the pass AFTER that one, all found by an adversary re-reading the file
# rather than by trusting the paragraph above:
#   - THREE GATE-FAILURE ROUTES CRASHED INSTEAD OF ANSWERING. G2 and G3 under
#     classical_deep, and G2 under llm_efficiency, routed back into the stage that
#     made the proposal - and that stage had no node asking the gate's own
#     question, so the same node proposed again and the walk cycled until the
#     guard raised. Stage 5 works because its first three nodes are exactly the
#     negation of the G2 llm_weights row. Stage 7 and stage 8 now have the same:
#     S7_QUANTIZATION_UNTRIED, S7_CACHING_UNTRIED,
#     S8_TABULAR_DEEP_NEEDS_HPARAM_SEARCH, S8_TABULAR_DEEP_NEEDS_FEATURE_WORK.
#     The users this hit are precisely the ones the gates exist for.
#   - THE RESTRUCTURE ABOVE KILLED THREE NON-TRAINING OUTCOMES, which is the same
#     defect class the restructure was commissioned to remove. S8_TABULAR_STANDARD
#     was widened from "> 10000" to ">= 1000" and moved last, and between TINY,
#     WITH_TEXT and STANDARD every tabular run with a known row count was
#     swallowed: NO_LLM__SETFIT, NO_LLM__ENCODER_FINETUNE and the classification
#     reroute were all dead. The bound is back at "> 10000" and the hole the
#     widening was closing is closed by S8_TABULAR_UNMATCHED, a catch-all BELOW
#     the nodes it was shadowing. The threshold_note justifying the widening was
#     FALSE and is deleted, not softened.
#   - S8_VISION_AUDIO_GAP was dead the same way, under a terminal node whose
#     condition its own condition implied. Order swapped, negation added.
#   - 1.2% OF RANDOMIZED FACT SETS RAISED RATHER THAN ANSWERING. A fact declared
#     `source: inspect` with no default resolves to null, every condition reading
#     it goes false, and the stage runs off the end. See `uninspectable_facts`
#     for the policy and RC8_NO_STAGE_RUNS_OFF_THE_END for the check. Every stage
#     now ends in a node that cannot fail to fire.
#   - A FOURTH LOOPING ROUTE, found by that same check and reported by nobody:
#     S4_FORMAT_FIXED_CONTENT_STILL_WRONG rerouted to stage 1, and stage 1 routes
#     on the largest failure bucket, which is the bucket that sent the run to
#     stage 4. Facts are immutable within a run, so the reroute could never make
#     progress - it was an infinite loop by construction, capped by the cycle
#     guard. It is a terminal ACTION__RE_BUCKET_THE_FAILURES now.
#
# Fixed in THIS pass, and it is one defect with two faces rather than two
# defects. It was raised by the pass above as an open question and decided here.
#   - A SENTENCE-TRANSFORMER CLASSIFIER WAS BEING RECOMMENDED FOR TABLES OF
#     NUMBERS. S8_TEXT_CLASSIFICATION_FEW_LABELS, S8_TEXT_CLASSIFICATION_MANY_LABELS
#     and S8_CLASSIFICATION_NEEDS_REASONING carried no modality guard while
#     sitting in a stage only tabular and timeseries runs could enter. A tabular
#     run with 5,000 rows and 800 numeric columns was answered NO_LLM__SETFIT -
#     a method that embeds sentences, offered to data with no sentences in it.
#     The first two now carry `modality in {text, code}`. The third does not,
#     deliberately: it names no method, it is the fall-through, and it is a
#     tabular run's only route to the LLM spine.
#   - AND THE SAME FORK WAS DENYING THE SMALL-ENCODER ANSWER TO THE PEOPLE IT
#     WAS WRITTEN FOR. Guarding those two nodes to text would have made them
#     unreachable, because S0_MODALITY_FORK routes every text run to
#     stage_1_baseline and nothing on the LLM spine offers an encoder. So the
#     defect is not really in the three nodes, it is in the fork: it decides
#     "LLM spine or classical branch" on modality alone, and for text that is
#     half a decision. A closed-set text classifier with labelled data belongs
#     on the classical branch and was being sent to LoRA on a multi-billion
#     parameter model instead. S1_CLOSED_SET_CLASSIFICATION is the missing half:
#     the same fork, taken one stage later, after the LLM baseline the text run
#     genuinely has has been measured and found short.
#   - A NEW DOOR INTO A STAGE MEANS A NEW STAGE TERMINATOR. S8_TABULAR_UNMATCHED
#     is `modality == tabular`, which no longer covers everything that can reach
#     the end of stage 8, so the stage would have run off the end for a text
#     classifier with 60 labels and 500 examples. S8_TEXT_CLASSIFICATION_NEEDS_LABELS
#     is the terminator now. See uninspectable_facts.stage_terminators.
#
# Fixed in THIS pass, and it is the third face of the origin defect rather than
# a new one. The first face was a model ASSERTING a fact. The second was a real
# measurement filed against the wrong subject. This one is a real measurement
# OF THE WRONG THING, and every existing check said yes to it:
#   - A MODEL GRADING ITS OWN OUTPUT WAS STAMPED MEASURED. `run_eval` with
#     `metric=model_graded` runs a tool and the engine watches it, so the origin
#     was honestly assigned - and what it watched was a model being asked
#     "were you right?". Reproduced end to end on a scratch database with one
#     connection answering both prompts over thirty rows: `baseline_score`
#     0.967 MEASURED, `exact_match` 0.400 on the identical rows in the identical
#     run, G1_BASELINE_MEASURED PASSED, verdict NO_TRAIN__SHIP_AS_IS. The
#     product told a user to ship a system that gets four rows in ten right, on
#     the strength of that system's opinion of itself. A model's grade is now
#     `judge_score`, declared `opinion_of: model`, which no gate row may read and
#     no instrument may stamp MEASURED. See
#     fact_origins.a_models_opinion_is_not_a_reading and
#     SC6_NO_GATE_READS_AN_OPINION.
#
# as_of: 2026-08-19   # date this file was last reconciled against the design set

# TWO VERSIONS, BECAUSE TWO DIFFERENT THINGS ARE BEING VERSIONED. This file used
# to carry a single `version: 2`, read in exactly two places and both of them
# `isinstance(int)`. That is not a versioning scheme; it is a field.
#
#   ledger_format   the GRAMMAR this document is written in. The ENGINE owns it.
#                   An engine that does not know a format refuses to load it -
#                   never best-effort, because a gate table half understood is
#                   the honesty test defeated by a shrug.
#   ledger_version  which revision of THIS DOMAIN'S KNOWLEDGE this is. The AUTHOR
#                   owns it. The engine never reads it and a surface renders it,
#                   because a person reading a diagnosis should be able to see
#                   which edition of a domain's judgment produced it.
#
# Confusing the two is how format versions end up unreadable: somebody bumps
# "version" because they added an outcome, and now the engine cannot tell an
# author's edit from a grammar change.
ledger_format: 3
ledger_version: 2

# ---------------------------------------------------------------------------
contract:
  # -------------------------------------------------------------------------
  # THE NAMES THE ENGINE MUST FIND, DECLARED HERE RATHER THAN COMPILED INTO IT.
  #
  # Four of these used to be Python constants spelling THIS FILE'S choices:
  # `ENTRY_STAGE = "stage_0_admissibility"`, `STAGE_9 =
  # "stage_9_method_selector"`, `UNSET = "UNSET"`, and the literal `"TRAIN__"`
  # sitting in the middle of SC1 where it looked exactly like the sixty-odd
  # checks around it. No second ledger could satisfy them, and none of them is a
  # rule - they are all NAMES.
  #
  # The rule they were standing in for is unchanged and is stated in the engine:
  # THE LEDGER OWNS EVERY NAME, THE ENGINE OWNS EVERY RULE ABOUT NAMES. This file
  # may call its commit stage whatever it likes; it may not choose whether a
  # proposal has to reach one.
  roles:
    entry_stage: stage_0_admissibility

    # The stages where A CANDIDATE BECOMES A VERDICT. Deliberately not
    # "terminal_stages": every stage in this file is terminal - all ten end at
    # least one outcome and stage_8_classical ends twelve - so "terminal stage"
    # would name nothing. This is what SC2 has always been guarding.
    #
    # A LIST, AND IT MUST BE WRITTEN EVEN WHEN EMPTY. A ledger that commits to
    # nothing irreversible writes `commit_stages: []` in so many words, because
    # the difference between "this domain has no expensive answer" and "somebody
    # forgot" is the entire honesty test and a default would erase it.
    commit_stages: [stage_9_method_selector]

    # The node that re-asks every required gate under the PROPOSAL'S OWN class
    # before anything mints. Not an ML computation - a piece of the five-gate
    # test - so the engine binds it by this declared name rather than by node id.
    gate_sweep_node: S9_GATE_SWEEP

    # The sentinel meaning "nothing proposed yet". See `methods.UNSET`.
    no_proposal: UNSET

  # -------------------------------------------------------------------------
  # WHAT THE WORK OF EACH STAGE NEEDS, IN THE ENGINE'S CAPABILITY VOCABULARY.
  #
  # Read by `app/tools/blocks.py`, which turns the standing diagnosis into the
  # set of tools that reach the model on a turn. The names below are PACKS -
  # the first segment of a capability name in `blocks.CAPABILITIES` - and the
  # engine refuses one it does not publish, exactly as it refuses an undeclared
  # fact. This file may not name `carve_eval_set`; that is a Python function in
  # a package this document's author has never read.
  #
  # WHY THIS BLOCK EXISTS, AND IT IS A DEFECT REPORT RATHER THAN A DESIGN NOTE.
  # Without it the selection had four sources and every one of them keyed on a
  # fact: what a gate is waiting on, what an alternative would settle, what this
  # thread has already stamped. All three look BACKWARD, at work already behind
  # the answer. Nothing read the ANSWER. Measured over all 63 fixture sheets on
  # 2026-08-24, the union of packs ever selected was six of eleven, and the five
  # that never loaded - prompt, tabular, models, training, sandbox - are exactly
  # the packs whose tools stamp no fact, which is to say the packs that DO the
  # work rather than measure it. A thread whose verdict was TRAIN__LORA_SFT
  # could not be handed `start_training`. This block is the answer's own half of
  # the selection, and it is keyed by stage because a stage is where an outcome
  # is stated - `Spec.outcome_sites()` is the enumeration, and the mapping below
  # was taken from it rather than guessed.
  #
  # EVERY STAGE MUST BE NAMED, EVEN WITH AN EMPTY LIST. `docs/LEDGER_FORMAT.md`
  # §3's rule, enforced in `blocks.declared`: "this stage's work needs nothing
  # extra" and "somebody forgot" are different, and a default would erase the
  # difference. A stage added next year with no line here is a REFUSED ledger
  # rather than a silently narrow turn.
  capabilities:
    needs:
      # BLOCKED__DEFINE_SUCCESS_FIRST, ACTION__SET_A_TARGET_SCORE,
      # ACTION__NAME_THE_MODALITY, NO_ML__WRITE_CODE. Everything here is settled
      # by looking at what the person has.
      stage_0_admissibility: [data]

      # ACTION__CLASSIFY_FAILURES, ACTION__SPLIT_THE_TASK, NO_TRAIN__SHIP_AS_IS,
      # BLOCKED__FIX_LABELS_OR_TASK - a baseline and the failures under it.
      stage_1_baseline: [data, measurement]

      # NO_TRAIN__RAG, NO_TRAIN__FIX_RETRIEVAL, NO_TRAIN__CONTEXT_STUFFING,
      # ACTION__MEASURE_RETRIEVER_RECALL.
      stage_3_knowledge: [retrieval, measurement]

      # NO_TRAIN__CONSTRAINED_DECODING, ACTION__FIX_THE_DECODER,
      # ACTION__MEASURE_THE_FORMAT - the cheap thing is a prompt or a grammar,
      # and the answer is only believable against a score.
      stage_4_format: [prompt, measurement, data]

      # NO_TRAIN__BETTER_PROMPT, NO_TRAIN__FEW_SHOT, NO_TRAIN__PROMPT_OPTIMIZER,
      # ACTION__GROW_THE_EVAL_SET.
      stage_5_behaviour: [prompt, measurement, data]

      # NO_TRAIN__SWAP_MODEL, NO_TRAIN__AGENT_SCAFFOLD - a different model, and
      # the score that says whether it helped. `knowledge` rides along because
      # "swap to WHICH model" is a question about the world as of a date: the
      # shortlist tool answers it with fetched facts and a fetched_at, where
      # before it was answered from whoever's memory was nearest.
      stage_6_capability: [models, knowledge, measurement]

      # NO_TRAIN__QUANTIZE, NO_TRAIN__CACHE_AND_ROUTE, BLOCKED__LICENCE. And
      # `knowledge` again: efficiency is a cost question, and what rented
      # compute ASKS is a marketplace read with a date, not a remembered rate.
      stage_7_efficiency: [models, knowledge, measurement]

      # The classical branch: NO_DEEP__GRADIENT_BOOSTED_TREES, NO_DEEP__TABPFN,
      # NO_LLM__SETFIT, ACTION__COUNT_THE_ROWS.
      stage_8_classical: [tabular, data, measurement]

      # NO_TRAIN__OFF_THE_SHELF_MODEL - somebody already trained this.
      stage_8_offtheshelf_first: [models]

      # The expensive irreversible half. Every TRAIN__ outcome is stated here,
      # and so is NO_TRAIN__USE_EXISTING_BASE. A run needs a base model, a
      # sandbox to run in, and the training tools themselves.
      stage_9_method_selector: [training, sandbox, models]

    # OUTCOME → CAPABILITIES. The other half of selection: stage `needs:` says
    # what the work below a stage asks for in advance; `builds:` says what a
    # standing OUTCOME asks for the moment it is reached. Absent until
    # 2026-09-14, so a TRAIN__ verdict still relied on stage_9 alone and on
    # evidence carry. Keyed by outcome id; values are capability names from
    # `app/tools/blocks.CAPABILITIES` (first segment is the pack).
    builds:
      BLOCKED__BUILD_EVAL_SET:
        - data.eval_set.carve
        - data.eval_set.count
      ACTION__MEASURE_BASELINE:
        - measurement.baseline.score
      ACTION__CLASSIFY_FAILURES:
        - measurement.eval.run
        - measurement.eval.rebucket
      NO_TRAIN__RAG:
        - retrieval.index.build
        - retrieval.recall.score
      NO_TRAIN__BETTER_PROMPT:
        - prompt.attempt.score
        - measurement.eval.run
      TRAIN__LORA_SFT:
        - training.run.start
        - training.feasibility.check
        - machine.local_models.list
      TRAIN__QLORA_SFT:
        - training.run.start
        - training.feasibility.check
        - machine.local_models.list
      TRAIN__FULL_FINETUNE:
        - training.run.start
        - training.feasibility.check
        - training.placement.choose

  # A run produces exactly one Diagnosis.
  diagnosis:
    verdict: {enum: [NO_TRAIN, TRAIN, BLOCKED]}
    primary_recommendation: node_id
    path: [PathEntry]          # audit trail AND gate check; see path_semantics below
    gate_ledger: {gate_id: {status, node, clause}}   # derived from path; see below
    proposed_method: method    # the candidate that reached stage 9, or UNSET
    rejected: [{node_id, reason, evidence}]
    next_action: {text, artifact, command}
    exit_criterion: text       # how we will know it worked
    estimated_cost: {usd, hours, gpu, vram_gb}
    cost_provenance: {enum: [MEASURED, UNKNOWN]}  # UNKNOWN if any hardware fact was defaulted
    confidence: {type: float, range: [0, 1]}
    revisit_if: [condition]    # what would change the answer

  required_gates:
    - G0_EVAL_SET
    - G1_BASELINE_MEASURED
    - G2_PROMPT_EXHAUSTED
    - G3_RETRIEVAL_CONSIDERED
    - G4_CHEAPER_MODEL_CONSIDERED

  # -------------------------------------------------------------------------
  # WHAT THESE GATES ARE ABOUT, AND WHAT THEY WERE NEVER ABOUT.
  #
  # Written down because the engine was used for a question it does not answer,
  # and it answered anyway. Max ran the product against his own insurance book
  # and asked it seven things: can this machine train at all, local or rented or
  # own hardware, is it worth training, what would it cost, what is the best
  # data, how do I build the environment, which model should I use. He got
  # BLOCKED__DEFINE_SUCCESS_FIRST to all seven, because the tree was the only
  # path and it stops two nodes in.
  #
  # Exactly one of those seven is this file's question. The five gates read an
  # eval set, a baseline, prompt work, retrieval work and a model swap, and not
  # one of those is an input to "does a 7B model fit in 8 GB" - that is decided
  # by a card's memory and a config.json. A gate that refuses it is not being
  # honest, it is answering a question it was not asked.
  what_the_gates_decide:
    they_decide: >
      WHETHER TRAINING IS WORTH DOING. Every TRAIN__ outcome, and nothing else.
      This is unchanged and unweakenable: see invariant 4 of AGENTS.md and the
      header of this file. Separating the questions below must never become a
      route to a TRAIN__ outcome without all five, and the fence against that is
      structural rather than stated - the tools that answer the CAN questions
      declare `measures=()` and `writes=()`, so they can stamp no fact and
      therefore open no gate, and
      tests/test_a_can_question_is_not_a_train_recommendation.py derives the
      forbidden vocabulary from THIS FILE rather than from a list of its own.
    they_do_not_decide: >
      WHETHER A MACHINE CAN HOLD A MODEL, where a run should happen, what a
      rented hour costs, or which model fits a card. Those are answered from
      measured hardware and a model's own geometry, by app/feasibility.py and
      the tools in app/tools/feasible.py and app/tools/models.py, with no gate
      consulted and none opened. CAN is not SHOULD, and a product that will not
      say CAN until SHOULD is settled has refused a question it could answer.

  # -------------------------------------------------------------------------
  # revisit_if IS DERIVED, NOT AUTHORED FIFTY-FIVE TIMES.
  #
  # `contract.diagnosis` requires `revisit_if` on every verdict and
  # S9_MINT_TRAIN_VERDICT.requires_in_diagnosis names it. It was not on the
  # wire, and the card said so in the product - "It is not on the wire yet, so
  # this line has nothing to say and does not invent one."
  #
  # The obvious fix is a `revisit_if:` list on all fifty-five outcomes. That is
  # fifty-five hand-written lists that go stale the first time a condition
  # changes and nobody notices, which is the exact failure this file's own
  # header rejects everywhere else. So it is derived, and the three nodes that
  # DO declare one keep theirs, verbatim and first.
  revisit_if_derivation:
    declared_wins: >
      A node's own `revisit_if:` is passed through word for word, at the head of
      the list. A hand-written condition is more specific than any derivation.
      S3_CORPUS_FITS_IN_CONTEXT, S3_DOMAIN_DIALECT_GAP and S7_DISTILL carry one.
    otherwise_read_the_predicate_backwards: >
      An outcome was reached because one predicate was true of these facts, so
      it stops being the answer when one of those facts changes. Each fact the
      predicate READS becomes one line: `eval_size_n changes from 0`. Conditions,
      not dates - graphite 23.5.
    which_predicate: >
      The node's `condition:` when an ordinary node fired. THE GATE ROW's
      `requires` when a gate did - a gate is a predicate too, it just lives in
      `passes_when`, and reading only `condition:` sent an empty list on exactly
      the BLOCKED__ answers that most need a route out.
    the_value_may_be_unknown: >
      The line names the value the run held only when the value is known: a row
      in the fact trail, or the ledger's own default for a DEFAULTED origin.
      Otherwise it says `<fact> changes` and stops. A revisit condition that
      names a value the run did not hold is worse than one that names none.
    implemented_by: app/tools/next_moves.py

  # -------------------------------------------------------------------------
  # ALTERNATIVES ARE READ OUT OF THIS FILE TOO, and the sentence is never
  # reworded. Graphite 23.4 wants three controls that start the alternative
  # work; the engine sent none, so the card drew a named absence.
  alternatives_derivation:
    three_moves: >
      "Three because that is how many genuinely different next moves a blocked
      gate produces - do the thing that was skipped, exhaust the cheaper thing
      again, or re-examine the data the finding rests on. A fourth would be
      padding and a fifth would be a menu." (graphite 23.4)
    where_each_sentence_comes_from:
      do_the_thing_that_was_skipped: "the FAILED gate's `on_fail.action` or `on_fail.recipe`, verbatim"
      exhaust_the_cheaper_thing:     "the firing node's own `action:`, or its `say:` where it has no action, verbatim"
      re_examine_the_data:           "built from the registered tool's own control verb and the fact's own name"
    where_the_tool_comes_from: >
      evidence.resolves(fact), which derives it from the registry's own
      `measures=` declarations. A remedy no registered tool can start carries
      `tool: null` and `starts_now: false` rather than a button that does
      nothing - docs/VISION.md is explicit that roughly a third of the non-
      training outcomes end in a question only the person can answer, and there
      is no retrieval bench in this harness yet.
    an_alternative_is_not_a_decision: >
      It is a suggestion about what to run next. Running every one of them still
      arrives at these five gates, and the tool that carries these fields -
      run_diagnosis - still declares writes=() and measures=().
    implemented_by: app/tools/next_moves.py

  # -------------------------------------------------------------------------
  # PATH SEMANTICS. DEFINED HERE AND NOWHERE ELSE.
  #
  # This is the single definition. The loader and the invariant test are written
  # against this block. If ROADMAP, ARCHITECTURE or any other document describes
  # `path` differently, that document is stale and this one wins - including where
  # a roadmap milestone claims to specify the shape the implementation will use.
  # Two incompatible definitions of the audit trail is how you end up shipping an
  # invariant test that checks a structure the engine does not produce.
  #
  # `path` is the audit trail and it is also the gate check, so it needs rules
  # tight enough to implement and to test. It is a list of small records, not a
  # list of strings. A list of bare strings was tried and could not carry the one
  # thing the gate check needs: WHICH `passes_when` row each gate was passed under.
  # Without that, a gate passed early under one method class is indistinguishable
  # from a gate passed under another, and stage 9 skips it. See `latching`.
  path_semantics:
    type: "list[PathEntry], append-only, in evaluation order, never sorted, never deduplicated"

    PathEntry:
      id:
        type: str
        note: "a node id matching ^S[0-9]+_ or a gate id matching ^G[0-9]_"
      kind:
        enum: [node, gate]
      row:
        type: "str or null"
        note: >
          Set only when kind == gate. It is the `method_class` key of the
          `passes_when` row that evaluated true - one of: any, llm_weights,
          llm_efficiency, retriever_weights, classical_deep. Null on node entries.
      clause:
        type: "str or null"
        note: >
          The condition this entry was decided by, verbatim from this file, on BOTH
          kinds. On a gate entry it is the literal `requires` string of the row that
          matched, so the UI can say what the user actually did to pass it. On a node
          entry it is that node's own `condition:`.
        why_nodes_carry_it_now: >
          It used to be null on every node entry, and that cost the most common early
          answer its question. A run that stops above the gate tree passes no gate and
          fails none - an empty sheet reaches BLOCKED__DEFINE_SUCCESS_FIRST two nodes
          in - so every gate_ledger row is NOT_REACHED with a null clause, and a
          surface deriving its question from the frontier's clause had nothing to read
          at all. The condition was parsed at load time the whole while; the wire did
          not carry it.
        the_one_null_that_remains: >
          A gate's own node - S0_NO_EVAL_SET, S1_UNMEASURED, S5_PROMPT_NOT_EXHAUSTED,
          S3_RETRIEVAL_NOT_CONSIDERED, S6_MODEL_SWAP_UNTRIED - is declared in the
          `gates:` block rather than in a stage and has no `condition:` of its own.
          What is evaluated there is the gate row, which belongs to the gate and is
          already recorded on the gate entry that follows. Copying the row onto the
          node would be the engine inventing a condition the node does not have, so
          those entries stay null.

    entries:
      node:
        written_when: "a node's condition is evaluated, whether or not it fires"
        id: "the bare node id, e.g. S1_ALREADY_PASSES"
        note: "A node evaluated twice appears twice. Re-entry is legal; see cycle_guard."
      gate:
        written_when: "a gate's `passes_when` row evaluates TRUE, and only then"
        id: "the bare gate id, e.g. G0_EVAL_SET"
        note: >
          A failing gate writes nothing. It cannot: a failed gate terminates the run
          with its own cheaper-remedy outcome, so a failed gate and a TRAIN verdict
          can never coexist in one run. A gate MAY appear more than once - passed
          under one row during the walk, re-passed under a different row at the
          sweep - and both entries are kept, because the second one is the evidence
          that the second question was actually asked.

    telling_them_apart: >
      `kind` is authoritative; a loader reads `kind` and does not pattern-match the
      id. The namespaces also do not overlap - node ids match ^S[0-9]+_ and gate
      ids match ^G[0-9]_ - and they must not be allowed to, but that is a
      belt-and-braces check, not the mechanism.

    row_key: >
      row_key(gate_id, method_class) is the `method_class` key of the single
      `passes_when` row in gates[gate_id] that applies to that class: the row named
      for the class if there is one, otherwise the row keyed `any`. It is a pure
      function of this file and it is what makes the gate check mechanical. For
      G0, G1 and G4 it is always "any". For G2 and G3 it is the class name.

    gates_passed_under: >
      gates_passed_under(path, class) =
        { e.id for e in path if e.kind == "gate" and e.row == row_key(e.id, class) }
      This, not bare membership, is the set of gates a proposal of that class has
      actually passed.

    ordering_rule: >
      A gate entry is always appended immediately after an entry for its own node,
      with nothing between them. For every position i where path[i].kind == "gate":
      path[i-1].kind == "node" and path[i-1].id == gates[path[i].id].node. This must
      hold at EVERY occurrence, not just the first, so a checker iterates positions
      and must not use list.index(). This is what stops a gate entry being written
      by anything other than the gate.

    latching: >
      A gate is latched PER ROW, not per run. Skip a gate only when there is
      already a gate entry for it whose `row` equals
      row_key(gate_id, method_class(proposed_method)). If the applicable row has
      changed - because a proposal arrived and its class is not the class the gate
      was passed under - evaluate the gate again under the new row and append a
      second entry.

      This replaces the old rule, which said a gate is evaluated at most once per
      run and skipped whenever its id was already in `path`. That rule was
      justified by the claim that Facts are immutable for the duration of one
      diagnose() call, so re-evaluation could not change the answer. Facts are
      immutable. THE ROW IS NOT. G2 and G3 ask a different question of each method
      class, so the same immutable facts give different answers under different
      rows, and the justification was simply false. Under the old rule a walk down
      the LLM spine that passed G3 on `retrieval_tried` could then propose
      EMBEDDING_FINETUNE and never be asked the retriever_weights question,
      `retrieval_tried and reranker_tried`. That is a bypass of exactly the shape
      these gates exist to prevent. It is closed here.

      Re-evaluating a gate does NOT enter the stage that gate heads. A gate is a
      predicate and the sweep evaluates it in place. Only a gate's `on_fail` route
      enters a stage, and only stage entry counts towards cycle_guard. This
      distinction is load-bearing: it is also why a proposal whose gate sweep
      touches G3 does not pick up stage 3's `effect:` strikes.

    gate_ledger_derivation: >
      gate_ledger is a view over path, not a second source of truth. For each g in
      required_gates, evaluated against the FINAL proposed_method:
        PASSED      if g in gates_passed_under(path, method_class(proposed_method))
        FAILED      if the run terminated at gates[g].node
        NOT_REACHED otherwise
      A gate whose only entry was recorded under a row that no longer applies is
      NOT_REACHED, not PASSED. On a PASSED gate, `clause` records what the user
      actually did and `row` records which class's question was asked, so the UI
      can show both.

    cycle_guard: >
      REROUTE may return to a stage already visited. If any stage id would be
      ENTERED a third time, stop with ERROR__CYCLE. This is an engine bug, not a
      diagnosis, and it crashes rather than degrades. The one loop this shape
      invites - a gate whose on_fail routes into the stage the gate itself heads -
      is closed by the on_fail routing rule in `gates`: resume at the first
      non-gate node, never at the gate. Re-evaluating a latched gate at
      S9_GATE_SWEEP is not a stage entry and does not count here.

  # -------------------------------------------------------------------------
  # Which verdict each outcome prefix produces. The verdict enum has three values
  # and there are eight prefixes, so the mapping has to be written down.
  outcome_prefixes:
    NO_TRAIN__:  {verdict: NO_TRAIN, terminal: true,  meaning: "do this cheaper thing instead"}
    NO_ML__:     {verdict: NO_TRAIN, terminal: true,  meaning: "this is not a machine learning problem"}
    NO_DEEP__:   {verdict: NO_TRAIN, terminal: true,  meaning: "classical model, not a neural net"}
    NO_LLM__:    {verdict: NO_TRAIN, terminal: true,  meaning: "a small encoder, not a language model"}
    ACTION__:    {verdict: BLOCKED,  terminal: true,  meaning: "we cannot answer until you do this and re-enter"}
    BLOCKED__:   {verdict: BLOCKED,  terminal: true,  meaning: "something is missing or forbidden"}
    TEACH__:     {verdict: NO_TRAIN, terminal: true,  meaning: "a labelled teaching exercise; see teach_outcome_rules"}
    # THE EXPENSIVE IRREVERSIBLE OUTCOME, AND THE ROLE IS DECLARED HERE NOW.
    # `gated: all` means every gate in contract.required_gates, evaluated under
    # this proposal's own class. It is the whole of SC1, and it used to be the
    # bare string "TRAIN__" inside the engine - which is not an ML concept but a
    # ROLE, exactly as docs/VISION.md says.
    #
    # `gated:` accepts only `all` today. A subset - `gated: [G0_EVAL_SET,
    # G2_PROMPT_EXHAUSTED]` - is a real thing a ledger will want (a data ledger
    # with both SYNTHESISE__ and RELABEL__ has two different risks) and it is
    # PARSED AND REFUSED rather than ignored, because an author who wrote a
    # narrower set and silently got the full one would believe the wrong thing
    # about their own file.
    TRAIN__:     {verdict: TRAIN,    terminal: true,
                  gated: all,
                  mintable_only_at: S9_MINT_TRAIN_VERDICT,
                  meaning: "train this. Mintable only at S9_MINT_TRAIN_VERDICT."}
    REROUTE:     {verdict: null,     terminal: false, meaning: "continue at another stage"}
    ERROR__:     {verdict: null,     terminal: false, meaning: "engine bug. Raise, do not render."}

  evaluation_semantics: >
    Within a stage, nodes are evaluated top to bottom. The first node whose
    condition is true and whose outcome is terminal ends the run. Nodes carrying
    `effect:` instead of `outcome:` modify the candidate set and evaluation
    continues. `condition: always` nodes are routers and never terminate.
    Stage numbering has a gap - there is no stage 2 - because stage 1 routes by
    failure mode straight into stages 3 through 7. The gap is historical, not
    meaningful.

  teach_outcome_rules: >
    TEACH__ outcomes do train a model, so they need their own fence rather than a
    quiet exemption. A TEACH__ outcome may only be reached when goal_is_learning is
    true, must be rendered with the word "teaching" visible, and may never be
    presented as the answer to the user's stated production goal. If the user's
    goal is a working system, TEACH__ is unreachable. It is not a TRAIN__ verdict
    because it recommends nothing about the user's actual problem.

  execution_is_delegated: >
    A TRAIN verdict is a decision, not a run. Execution is handed to a pinned
    backend - Unsloth, HF peft+trl, or MLX-LM - and supervised. We do not write a
    trainer. In v1 (milestones M0 through M4) a TRAIN verdict produces a plan and a
    handoff and runs nothing at all.

# ---------------------------------------------------------------------------
# The method vocabulary. `propose:` may only name one of these. S9_MINT_TRAIN_VERDICT
# turns the proposal into the outcome id TRAIN__<METHOD>.
#
# method_class is a pure function of the method and it is what selects which
# `passes_when` row a gate uses.
#
# THERE IS NO STRICTEST ROW. This file used to say llm_weights was the strictest
# row and that UNSET could therefore borrow it safely. That was false in two ways.
# G3's retriever_weights row is strictly stronger than its llm_weights row - it
# requires retrieval_tried AND reranker_tried where llm_weights requires
# retrieval_tried alone - so llm_weights is not even the strongest row of the gate
# most likely to be reached first. And G2's four rows are not comparable at all:
# they ask about prompts, about quantisation and caching, about reranking and
# query rewriting, and about a hyperparameter search. Neither is a stricter
# version of another; they are different questions about different work.
#
# Requiring the conjunction of every row under UNSET - the other way to make the
# word "strictest" true - would force an LLM run to answer a tabular
# feature-engineering question before it could proceed. That is not a stricter
# question, it is an irrelevant one, and it would block every path in the file.
#
# So UNSET is PROVISIONAL instead of strict. The pre-proposal walk uses the
# llm_weights row because that walk is the LLM spine, every gate passed while
# proposed_method was UNSET records `row: llm_weights`, and S9_GATE_SWEEP
# re-evaluates each of them under the proposal's real row. The mechanism replaces
# the claim. See contract.path_semantics.latching.
methods:
  LORA_SFT:               {class: llm_weights}
  FULL_FINETUNE:          {class: llm_weights}
  DPO:                    {class: llm_weights, prerequisite: LORA_SFT}
  RL_GRPO:                {class: llm_weights}
  CONTINUED_PRETRAINING:  {class: llm_weights}
  FROM_SCRATCH:           {class: llm_weights}
  DISTILLATION:           {class: llm_efficiency}
  EMBEDDING_FINETUNE:     {class: retriever_weights}
  TABULAR_DEEP:           {class: classical_deep}
  UNSET:                  {class: llm_weights, provisional: true,
                           note: "No proposal yet. Uses the llm_weights row because the pre-proposal walk IS the LLM spine. NOT the strictest row - there is no strictest row; see the paragraph above. Every gate passed while UNSET is re-checked at S9_GATE_SWEEP under the proposal's real row."}

# ---------------------------------------------------------------------------
# THE FIVE GATES. Defined once, here. Stages reference them with `gate_ref:`.
#
# Each gate asks one question. `passes_when` is a table with one row per method
# class; exactly one row matches, because the classes are disjoint. If no row
# matches, that is ERROR__UNCLASSIFIED_METHOD - a new method was added to
# `methods` without adding its rows here, and the engine must crash rather than
# wave it through.
#
# WHICH ROW WAS USED IS RECORDED, because it is not recoverable afterwards. Each
# gate below states the relation between its own rows - `single_row`,
# `row_strength` or `rows_are_not_comparable` - so that anyone editing a row can
# see what they are changing the strength of. A gate passed under one row is not
# a gate passed under another; see contract.path_semantics.latching.
#
# There is deliberately no WAIVED or NOT_APPLICABLE status. An escape hatch on
# these gates is the same hole in a different shape. Where a gate looked
# LLM-specific, it has been restated at the altitude that is true for every
# branch, and every row below is real work the user has to have actually done.
#
# on_fail routing rule, and it matters: three of these gates sit at the top of
# the very stage their on_fail routes into. Evaluation resumes at the first node
# of that stage which is NOT a gate_ref. A gate never re-enters itself, so
# "gate fails -> route to the remedies" cannot loop.
gates:

  G0_EVAL_SET:
    node: S0_NO_EVAL_SET
    stage: stage_0_admissibility
    asks: "Is there a set of examples we can score, so that 'better' is a measurement and not a feeling?"
    passes_when:
      - {method_class: any, requires: "eval_size_n >= 30"}
    single_row: "one row, applies to every class. row_key(G0_EVAL_SET, c) == 'any' for every c, so once passed it is never re-evaluated."
    on_fail:
      outcome: BLOCKED__BUILD_EVAL_SET
      recipe: "30-50 real inputs sampled from actual traffic, graded by the person who cares about the answer."
      note: "n=30 only resolves differences larger than ~15 points. n>=100 to trust a 5-10 point delta. Report the resolution alongside every score."
    on_unsubstantiated:
      note: >
        You have told me there is an eval set. I have not seen it. eval_size_n is
        declared `source: inspect`, which is this product promising to count it
        rather than to take your word for the number, and the count is what makes
        every later score mean something. Point me at the file or the folder and
        I will count it myself; if the count clears thirty, this gate opens on the
        same breath.
    hard_gate: true

  G1_BASELINE_MEASURED:
    node: S1_UNMEASURED
    stage: stage_1_baseline
    asks: "Do we know what the best thing that already exists scores on that eval set?"
    passes_when:
      - {method_class: any, requires: "baseline_measured and baseline_score is not null and trivial_baseline_score is not null"}
    single_row: >
      One row, applies to every class. row_key(G1_BASELINE_MEASURED, c) == 'any'
      for every c, so once passed it is never re-evaluated. What a "baseline" means
      does vary by class - see what_counts_as_the_baseline below - but the
      predicate does not, so there is nothing for a re-check to catch.
    what_counts_as_the_baseline:
      llm_weights:       "the strongest model the user can reach, plus a trivial baseline (majority class, regex, BM25-only)"
      llm_efficiency:    "the model that currently passes on quality, timed and priced as it actually runs"
      retriever_weights: "the off-the-shelf embedding model, scored as retriever_recall_at_k on the eval set"
      classical_deep:    "a gradient-boosted tree, and TabPFN where the size allows, both fitted and scored"
    note: >
      The predicate is stronger than the old `not baseline_measured`. A boolean set
      true with no score recorded behind it is not a measured baseline, and the
      classical branch used to skip this gate entirely because it never entered
      stage 1. It does not skip it now.
    what_a_score_here_is: >
      A number A RULE PRODUCED on the eval set. `baseline_score` is declared
      `source: inspect` and this is what "inspect" means for it: something the
      harness can recompute from the rows on disk without asking anybody's
      opinion. A MODEL'S GRADE OF THE ANSWERS IS NOT THIS FACT. It is
      `judge_score`, it is declared `opinion_of: model`, and no row of this gate
      reads it - because a self-graded 96.7% and a rule-graded 40.0% over the
      same thirty rows of the same run were the same fact until this pass, and
      this gate opened on the first one. See
      fact_origins.a_models_opinion_is_not_a_reading.
    on_fail:
      outcome: ACTION__MEASURE_BASELINE
      action: "Run the eval set against the baseline named above and against a trivial baseline. Then re-enter the tree."
      if_only_a_judge_has_scored_it: >
        A model graded the answers, so what you have is that model's opinion and
        not a score. This gate is not refusing the judge - the run happened, the
        number is recorded as `judge_score` and the tree will route on it - it is
        refusing to call it a measurement. Two things turn it into one and either
        is enough. WRITE THE GRADE AS CODE: exact match, a regex, a schema check,
        a test that passes or does not. OR KEEP THE JUDGE AND CALIBRATE IT: grade
        a sample of the same rows yourself and record how often the judge agreed
        with you. The second is the answer for the tasks no rule can grade, which
        are real and are the reason model_graded exists at all; it is the same
        sentence S4_METRIC_NOT_PROGRAMMATIC already says - "an LLM judge on your
        own key with a rubric and a human-verified sample".
    on_unsubstantiated:
      note: >
        You have told me there is a measured baseline. Nothing in this run
        measured it. baseline_measured, baseline_score and trivial_baseline_score
        are all declared `source: inspect`, and a baseline that was asserted
        rather than run is exactly the number a later "we improved it by nine
        points" would be measured against. Run the eval set against the baseline
        and against a trivial baseline, in front of me, and this gate opens.
    hard_gate: true

  G2_PROMPT_EXHAUSTED:
    node: S5_PROMPT_NOT_EXHAUSTED
    stage: stage_5_behaviour
    asks: "Has the no-training version of this approach been pushed as far as it goes?"
    passes_when:
      - {method_class: llm_weights,       requires: "prompt_iterations >= 3 and fewshot_tried and (prompt_optimizer_tried or not metric_is_programmatic or eval_size_n < 50)"}
      - {method_class: llm_efficiency,    requires: "quantization_tried and caching_enabled"}
      - {method_class: retriever_weights, requires: "retrieval_tried and reranker_tried and query_rewriting_tried"}
      - {method_class: classical_deep,    requires: "hparam_search_trials >= 50"}
    rows_are_not_comparable: >
      No row here implies any other. llm_weights asks about prompts, llm_efficiency
      about quantisation and caching, retriever_weights about reranking and query
      rewriting, classical_deep about a hyperparameter search. They are four
      different questions about four different pieces of work, not four strengths
      of one question. There is therefore no strictest row to fall back on, and a
      G2 passed under one row says nothing about another. Any proposal whose class
      differs from the class G2 was passed under gets asked again.
    note: >
      Broadened from prompt_iterations alone. Three rewrites of a system prompt with
      no few-shot attempt and no prompt optimiser is not an exhausted prompt, and it
      was the hole that let a stage-4 format fine-tune through. For the classes that
      have no prompt, the same question has an exact analogue: the untrained
      configuration of that method - quantisation and caching for a cost problem,
      chunking and reranking and query rewriting for a retriever, a hyperparameter
      search for a tree.
    on_fail:
      route: stage_5_behaviour     # for llm_weights; its first three nodes are the remedies
      route_by_class:
        llm_efficiency:    stage_7_efficiency
        retriever_weights: stage_3_knowledge
        classical_deep:    stage_8_classical
    on_unsubstantiated:
      note: >
        The work this gate asks about was reported on your behalf rather than by
        you. The prompt work, the quantisation, the reranking and the
        hyperparameter search are all declared `source: ask` - they are yours to
        answer, because nobody else was there. Say it yourself and I will take it;
        I will not take a model's account of your week.
    hard_gate: true

  G3_RETRIEVAL_CONSIDERED:
    node: S3_RETRIEVAL_NOT_CONSIDERED
    stage: stage_3_knowledge
    asks: "Was the missing information brought in from outside the weights, and did that fail?"
    passes_when:
      - {method_class: llm_weights,       requires: "retrieval_tried"}
      - {method_class: llm_efficiency,    requires: "retrieval_tried"}
      - {method_class: retriever_weights, requires: "retrieval_tried and reranker_tried"}
      - {method_class: classical_deep,    requires: "feature_work_considered"}
    row_strength: >
      retriever_weights is STRICTLY STRONGER than llm_weights and llm_efficiency:
      retrieval_tried AND reranker_tried, against retrieval_tried alone.
      classical_deep asks about a different fact entirely and is comparable to
      nothing. So llm_weights is not the strictest row of this gate, which is what
      the file used to claim, and a G3 passed under llm_weights on the walk down
      the LLM spine has NOT answered the retriever question. This is the specific
      bypass path_semantics.latching closes: pass G3 under llm_weights, then
      propose EMBEDDING_FINETUNE, and under the old skip-if-present rule the
      reranker question was never asked.
    note: >
      "Retrieval" here means putting the right thing in front of the model instead of
      into it, and that is not only document RAG. Retrieved exemplars are the
      cheaper alternative to a style fine-tune. A shorter retrieved prompt is a
      cost lever. For tabular the same question is whether the missing signal is a
      missing feature or a join, which is usually the true answer and is always
      cheaper than a neural net.
    on_fail:
      route: stage_3_knowledge
      route_by_class:
        classical_deep: stage_8_classical
    on_unsubstantiated:
      note: >
        Whether retrieval was tried is yours to say, and something else said it
        for you. This is the gate that most often has the real answer behind it -
        the missing thing is usually outside the weights - so a wrong yes here
        costs a month. Confirm it in your own words and it counts.
    hard_gate: true

  G4_CHEAPER_MODEL_CONSIDERED:
    node: S6_MODEL_SWAP_UNTRIED
    stage: stage_6_capability
    asks: "Did we check whether something cheaper that already exists solves this?"
    passes_when:
      - {method_class: any, requires: "model_swap_tried"}
    single_row: >
      One row, applies to every class. row_key(G4_CHEAPER_MODEL_CONSIDERED, c) ==
      'any' for every c, so once passed it is never re-evaluated. What the swap
      means varies by class - see below - but a swap is a swap and the predicate
      does not change.
    what_the_swap_means:
      llm_weights:       "a larger model, a reasoning model, and a Hugging Face search for an existing fine-tune of exactly this task"
      llm_efficiency:    "a smaller off-the-shelf model measured on the eval set and found short"
      retriever_weights: "an off-the-shelf domain embedding model measured, and an existing reranker tried"
      classical_deep:    "GBDT and TabPFN both fitted and scored, and both below target"
    note: "Someone has usually already trained this. Search before you train."
    on_fail:
      route: stage_6_capability
    on_unsubstantiated:
      note: >
        Somebody has claimed on your behalf that a cheaper model was already
        tried. Somebody has usually already trained this; that is why the gate
        exists. Tell me yourself that you looked, and this one opens.
    hard_gate: true

# ---------------------------------------------------------------------------
# THE FACT LEDGER.
#
# source: ask = user answers; inspect = engine reads machine/repo/data; derive = computed.
# Every fact carries a source tag. The intake is not a form: it is a sheet the
# harness has mostly filled in already, shown back for correction, with the
# provenance visible on each line. A fact with no source tag cannot be displayed
# honestly, which is why the untagged ones below were the ones the product claims
# to inspect rather than ask.
facts:

  # ---- part 1: the 42 facts originally declared ---------------------------
  goal_text:               {type: str,   source: ask, scope: thread}
  modality:                {enum: [text, tabular, timeseries, image, audio, multimodal, code], source: derive, scope: thread}
  task_family:             {enum: [generation, classification, extraction, retrieval, ranking, prediction, forecasting, agent_control, unknown], source: derive, scope: thread}
  need_type:               {multi: [knowledge, behaviour, format, capability, cost, latency, privacy], source: derive, scope: thread}
  # evidence
  eval_size_n:             {type: int,   source: inspect, scope: thread, default: 0,
                            measured_by: [data.eval_set.count, data.dataset.profile]}
  baseline_measured:       {type: bool,  source: inspect, scope: thread, default: false,
                            measured_by: [measurement.baseline.score, measurement.eval.run]}
  baseline_score:          {type: float, source: inspect, scope: thread,
                            measured_by: [measurement.baseline.score, measurement.eval.run]}
  trivial_baseline_score:  {type: float, source: inspect, scope: thread,   # majority class / regex / BM25-only
                            measured_by: [measurement.baseline.score, measurement.eval.run]}
  target_score:            {type: float, source: ask, scope: thread}
  # SOURCE STAYS `ask`, AND UNDER PERMISSION `full` THE HARNESS DEFAULTS IT BY RULE.
  # `ask` is the right declaration: the person is the only witness to their own
  # bar, and under every other permission mode nothing may put a number here but
  # them. Under `full` they have said in advance that the harness decides, and a
  # turn spent asking is a turn spent disobeying them (thread 78, 2026-09-18).
  # `app/full_defaults.py` then writes max(trivial_baseline_score + the two-run
  # resolution of this eval set, baseline_score + 0.10), capped at 0.95, with
  # origin DEFAULTED and the arithmetic in its `how`. It needs both baselines
  # MEASURED first, so the number always has a reading under it; a STATED row
  # from the person outranks it, which is what makes it a default and not an
  # answer. No gate row reads this fact, so nothing it settles opens a gate.
  failure_histogram:       {type: "map[failure_mode,int]", source: derive, scope: thread, default: {},  # LLM-judge over >=20 failures
                            # TWO INSTRUMENTS, AND THE SECOND IS THE PERSON'S.
                            # `run_eval` buckets by fixed rules and never by a
                            # model, so re-running it reproduces the identical
                            # histogram - which is why
                            # ACTION__RE_BUCKET_THE_FAILURES had no route out
                            # until `rebucket_failures` existed. It re-tallies
                            # over rows the person re-read, and the COUNT is
                            # what it measures.
                            measured_by: [measurement.eval.run, measurement.eval.rebucket]}
  # default {} and not null. S1_GAP_UNDIAGNOSED reads
  # `sum(failure_histogram.values())`, and .values() on a null is not a false
  # answer, it is a crash - the engine raised rather than telling the user to go
  # bucket their failures. An empty histogram is the honest reading of "nobody
  # has bucketed anything yet", and it is exactly the case S1_GAP_UNDIAGNOSED
  # exists to catch. See UNINSPECTABLE_FACTS below.
  failures_seen:           {type: int, source: derive, scope: thread, default: 0,
                            # THE DENOMINATOR THE HISTOGRAM WAS ALWAYS MISSING.
                            # `failure_histogram` counts the failures somebody
                            # BUCKETED. Nothing carried how many there WERE, so
                            # S1_GAP_UNDIAGNOSED could only ask an absolute
                            # question - "are there twenty of them" - and twenty
                            # of twenty and twenty of two hundred answered it
                            # identically.
                            #
                            # Measured 2026-09-09 on eval run 51: 13
                            # wrong_format, 5 wrong_facts, 2 wrong_reasoning,
                            # sum 20, against 47 failing rows. It cleared the
                            # floor at 43% coverage and S1_ROUTE_BY_FAILURE_MODE
                            # then routed on the argmax of a sample that was not
                            # only a minority but a PREFIX - the first 20 failing
                            # rows in row order, because `read_eval_results`
                            # shows twenty by default and a person buckets what
                            # they were shown.
                            #
                            # Both stampers already said this number OUT LOUD:
                            # "20 of 47 failing rows". It lived in the `how`
                            # sentence, which is prose - a reader could see it
                            # and a condition could not compute on it. This is
                            # that same number, as a fact.
                            measured_by: [measurement.eval.run, measurement.eval.rebucket]}
  # what has already been tried
  prompt_iterations:          {type: int,  source: ask, scope: thread,     default: 0}
  fewshot_tried:              {type: bool, source: ask, scope: thread,     default: false}
  constrained_decoding_tried: {type: bool, source: ask, scope: thread,     default: false}
  retrieval_tried:            {type: bool, source: ask, scope: thread,     default: false}
  retriever_recall_at_k:      {type: float, source: inspect, scope: thread,
                               measured_by: [retrieval.recall.score]}
  prompt_optimizer_tried:     {type: bool, source: ask, scope: thread,     default: false}
  model_swap_tried:           {type: bool, source: ask, scope: thread,     default: false}
  agent_scaffold_tried:       {type: bool, source: ask, scope: thread,     default: false}
  # data
  labeled_examples_n:      {type: int,   source: inspect, scope: thread,
                            measured_by: [data.dataset.assess]}
  preference_pairs_n:      {type: int,   source: inspect, scope: thread, default: 0,
                            measured_by: [data.preferences.count]}
  unlabeled_domain_tokens: {type: int,   source: inspect, scope: thread, default: 0}
  corpus_tokens:           {type: int,   source: inspect, scope: thread, default: 0}
  knowledge_volatility:    {enum: [static, slow, weekly, daily, realtime], source: ask, scope: thread}
  data_quality:            {type: float, source: inspect, scope: thread}   # from app/dataquality.py, 0..1
  label_source:            {enum: [human, synthetic, weak, none], source: ask, scope: thread}
  classes_n:               {type: int,   source: inspect, scope: thread,
                            measured_by: [data.dataset.assess]}

  # `also_written` - THE PROSE NAMES A MODEL USES FOR THIS FACT.
  #
  # The provenance wall builds its subject vocabulary off these declarations, by
  # splitting each `source: inspect` key on its underscores. That gives it the
  # LEDGER'S name for a fact and not ENGLISH'S: it knows `disk_free_gb` as "disk
  # free", and the model writes "Free Disk Space: 500 GB" - the same fact, the
  # words in the other order - and the wall read straight past it. Measured
  # against the harvested banks, the split alone stopped 2 of 112 sibling
  # fabrications. The names here are the other half of that vocabulary, and they
  # live beside the declaration because the ledger declares the fact, so the
  # ledger declares what the fact is called.
  #
  # EVERY NAME HERE IS ONE A MODEL WAS CAUGHT WRITING. Not one was thought up.
  # `tests/aliases_the_model_writes.py` carries the verbatim harvested line
  # behind each one, and the candidates no harvested line contained are in its
  # `DROPPED_UNATTESTED` rather than here. A fact whose harvest turned up no
  # alias gets no `also_written` line at all - `offtheshelf_measured` is that
  # case and stays uncovered on purpose.
  #
  # AND EVERY NAME HERE EARNED ITS PLACE BY MEASUREMENT. 101 attested aliases
  # were scored one at a time through the real sentry; the seven below produce
  # exactly the same result on every bank as all 101 together, and the other 94
  # changed no count anywhere. See
  # `tests/test_a_fabrication_in_ordinary_english_is_still_a_fabrication.py`.
  #
  # SO MOST FACTS HAVE NO `also_written` LINE, AND NOT FOR WANT OF A HARVEST.
  # Five facts carry one. Fifteen more have attested candidates that were swept
  # and bought nothing - `gpu`, `quantization` and `precision` among them, the
  # three the harvest called the whole false-catch surface, which turned out to
  # cost nothing and buy nothing. They are left undeclared rather than added
  # for tidiness: an alias that changes no count is unmeasured risk.
  #
  # A `type: bool` fact takes no alias: it holds no number, so a number written
  # beside it is not a reading of it, and the wall skips bools whatever they are
  # called.
  tabular_rows:            {type: int,   source: inspect, scope: thread,
                            # NO `also_written`. "row count" was declared here and
                            # withdrawn: `count` and `counts` are ATTRIBUTION VERBS, so
                            # the alias SUPPLIED ITS OWN ATTRIBUTION - it made
                            # `_asserts_of_this_project` true by itself and defeated the
                            # second-person requirement that keeps the wall off other
                            # people's numbers. Measured: "Their row count was 8,000 in
                            # the original paper." and "The MNIST row count is 60,000."
                            # were both stopped. An underscore-split key can never do
                            # this, because a ledger key never contains a verb; it is a
                            # hazard this route introduced. And it bought one turn.
                            # A prose name containing an ATTRIBUTES word is not usable
                            # here whatever the harvest attests.
                            #
                            # MEASURED SINCE 2026-08-28. `profile_dataset` reads the
                            # file and counts; a row count is the same KIND of number
                            # as `eval_size_n`, which that tool has always stamped.
                            # The ASK node below stays - `schema_compliance` and
                            # `retriever_recall_at_k` are both listed in
                            # `uninspectable_facts.ask_nodes` AND measured, because
                            # "somebody may tell us" and "we can also go and look" are
                            # not exclusive. What changes is that the harness now
                            # OFFERS to count rather than only asking.
                            measured_by: [data.dataset.profile]}
  tabular_features:        {type: int,   source: inspect, scope: thread,
                            # "columns" WAS withdrawn for a session and RESTORED,
                            # and the reason is worth more than the word. It was
                            # withdrawn over "Pandas reports 5 columns for that file
                            # format by default." being stopped - but that false catch
                            # is NOT the alias's. `_asserts_of_this_project` returns
                            # True on ANY attribution verb, so `reports` alone makes a
                            # sentence about Pandas read as a claim about this project.
                            # The same probe stops "The paper reports 24 GB of video
                            # memory for that card." and "The vendor counted 340
                            # labeled examples in the public set." - one a different
                            # alias, one a DERIVED subject that is no alias at all.
                            # Withdrawing "columns" cost a real catch ("Your export has
                            # 4,120 rows and 6 columns." on a thread where the person
                            # named no figures) and fixed nothing general. The defect is
                            # third-party attribution and it lives in the predicate.
                            # NOT measured, deliberately, while `tabular_rows` is.
                            # A column count is not a feature count: the target column
                            # is in `columns` and is not a feature, and which column is
                            # the target is the person's declaration and nothing on disk
                            # says it. Stamping len(columns) here would be off by one
                            # whenever a label exists, which is always, and it would be
                            # off by one in the direction that flatters the data.
                            also_written: ["columns", "feature dimensions"]}
  # constraints
  privacy:                 {enum: [public_ok, no_third_party_api, on_prem_only, regulated], source: ask, scope: thread}
  needs_citations:         {type: bool,  source: ask, scope: thread}
  latency_budget_ms:       {type: int,   source: ask, scope: thread}
  calls_per_day:           {type: int,   source: ask, scope: thread}
  deployment:              {enum: [cloud_api, local_gpu, local_cpu, edge, browser], source: ask, scope: thread}
  quality_loss_tolerance:  {enum: [none, small, moderate], source: ask, scope: thread}
  teacher_license_permits_distillation: {type: bool, source: ask, scope: thread}

  # hardware. source: inspect, via app/hwdetect.py, with source: ask as the named
  # fallback when detection fails. A defaulted hardware fact is a different claim
  # from a measured one: it sets cost_provenance to UNKNOWN and the feasibility
  # verdict to UNKNOWN, and no number derived from it may be shown as measured.
  accelerator:             {enum: [nvidia, apple_silicon, amd, cpu_only], source: inspect, scope: machine, fallback: ask,
                            measured_by: [machine.hardware.inspect]}
  vram_gb:                 {type: float, source: inspect, scope: machine, fallback: ask,
                            measured_by: [machine.hardware.inspect],
                            also_written: ["video memory"]}
  # A CLOSURE, AND ONLY EVER A CLOSURE.
  #
  # Measured 2026-09-10: the intake walk for a 1.5B and a 7B model on the same
  # task was step-for-step identical - four decisions, one outcome - because
  # nothing it could read knew which model was attached.
  # `can_this_machine_train` knew the whole time (YES needing 3.80 GiB with 4.20
  # spare for the 1.5B; NO needing 7.94 with 0.06 for the 7B, fitting at
  # sequence 1472) and declared `measures=()`, so nothing it computed could
  # reach a node.
  #
  # THE RULE THIS FACT IS WRITTEN UNDER. It is stamped ONLY on a NO. There is no
  # `can_train_here`, and there must not be: "this machine CAN train X" read as
  # "you SHOULD" is the confusion `app/tools/feasible.py` exists to prevent, and
  # AGENTS.md invariant 4 forbids. A closure removes an option and says by how
  # much; it recommends nothing and opens no gate - no gate row reads it.
  #
  # AND IT IS NOT STAMPED BY THE CAN TOOLS. `can_this_machine_train` still
  # declares `measures=()` and still answers on an empty ledger with no thread,
  # which is the defect that module was written to close - a tool that stamps a
  # thread-scoped fact is required to have a thread, and requiring one here
  # would put a precondition back on a question that must answer standing alone.
  cannot_train_here:       {type: bool,  source: inspect, scope: thread,
                            measured_by: [training.feasibility.record]}
  training_headroom_gb:    {type: float, source: inspect, scope: thread,
                            # The margin beside the refusal. NO-by-0.06 is a
                            # sequence length away from yes; NO-by-3.4 is a
                            # different card. One word, two different facts.
                            measured_by: [training.feasibility.record]}
  longest_fitting_seq:     {type: int,   source: inspect, scope: thread,
                            measured_by: [training.feasibility.record]}
  ram_gb:                  {type: float, source: inspect, scope: machine, fallback: ask,
                            must_be: "installed system RAM. Not free disk. Reading free disk into this field is a known past defect and it produces impossible numbers downstream.",
                            # "system memory" is INSTALLED memory, which is what
                            # `must_be` above requires. The harvest also attested
                            # "free memory" for this fact and it is NOT declared
                            # here: free memory is not installed memory, and
                            # putting it on this key is the defect `must_be`
                            # already names.
                            measured_by: [machine.hardware.inspect],
                            also_written: ["system memory"]}
  disk_free_gb:            {type: float, source: inspect, scope: machine, fallback: ask,
                            measured_by: [machine.hardware.inspect],
                            also_written: ["free disk space", "free space"]}
  can_rent_cloud:          {type: bool,  source: ask, scope: thread}
  budget_usd:              {type: float, source: ask, scope: thread}
  time_budget_days:        {type: float, source: ask, scope: thread}

  # ---- part 2: 26 facts used in node conditions but never declared --------
  # Found by the reconciliation pass. These names appear in `condition:` fields
  # throughout this file; without declarations the conditions cannot be evaluated
  # and the file is not mechanically checkable. They are inputs, not derivations,
  # so they belong in the ledger.
  # THE LEDGER IS NOW 68 FACTS, NOT 42. Any document quoting 42 is stale.
  reranker_tried:               {type: bool,  source: ask, scope: thread,     default: false}
  labeled_query_positive_pairs: {type: int,   source: inspect, scope: thread, default: 0}
  query_rewriting_tried:        {type: bool,  source: ask, scope: thread,     default: false}
  schema_compliance:            {type: float, source: inspect, scope: thread,   # fraction of outputs matching the schema
                                 measured_by: [measurement.format.score]}
  schema_expressible:           {type: bool,  source: derive, scope: thread}    # can a JSON schema or grammar express the target shape
  metric_is_programmatic:       {type: bool,  source: derive, scope: thread}    # can the score be computed without a human
  user_can_rank_but_not_write:  {type: bool,  source: ask, scope: thread,     default: false}
  reward_is_programmatic:       {type: bool,  source: ask, scope: thread,     default: false}
  task_is_multistep:            {type: bool,  source: derive, scope: thread}
  quantization_tried:           {type: bool,  source: ask, scope: thread,     default: false}
  caching_enabled:              {type: bool,  source: ask, scope: thread,     default: false}
  current_precision:            {enum: [fp32, fp16, bf16, int8, int4], source: inspect, scope: thread}
  has_free_text_columns:        {type: bool,  source: inspect, scope: thread, default: false}
  has_high_cardinality_sequence: {type: bool, source: inspect, scope: thread, default: false}
  needs_multimodal_fusion:      {type: bool,  source: ask, scope: thread,     default: false}
  labels_are_closed_set:        {type: bool,  source: derive, scope: thread}
  requires_multistep_reasoning: {type: bool,  source: derive, scope: thread}
  hparam_search_trials:         {type: int,   source: ask, scope: thread,     default: 0}
  feature_work_considered:      {type: bool,  source: ask, scope: thread,     default: false}
  offtheshelf_measured:         {type: bool,  source: inspect, scope: thread, default: false}
  no_suitable_open_weight_base_exists: {type: bool, source: derive, scope: thread}   # from the model search, not from a user claim
  tokens_available:             {type: int,   source: inspect, scope: thread, default: 0}
  target_params:                {type: int,   source: ask, scope: thread}
  enterprise_cluster_available: {type: bool,  source: ask, scope: thread,     default: false}
  user_requested_from_scratch:  {type: bool,  source: ask, scope: thread,     default: false}
  goal_is_learning:             {type: bool,  source: derive, scope: thread}   # from goal_text; gates every TEACH__ outcome

  # ---- part 3: facts that are somebody's OPINION rather than a reading -----
  # One so far, and the declaration that makes it different from the sixty-eight
  # above is `opinion_of:`. A fact carrying it may never be stamped MEASURED and
  # no gate `passes_when` row may read it. The whole argument, and the run that
  # made it necessary, is in fact_origins.a_models_opinion_is_not_a_reading.
  #
  # `source: derive` is honest and it is also belt and braces. It is honest
  # because the number IS computed by the harness over the rows of one run - the
  # judge's verdicts are the inputs, not the output. It is belt and braces
  # because `derive` admits MEASURED and nothing else, and an `opinion_of:` fact
  # can never BE measured, so the admissible set for this fact is empty in
  # practice: a gate row that read it by mistake tomorrow could not be opened by
  # any origin at all.
  judge_score: {type: float, source: derive, scope: thread, opinion_of: model}
  # What a model said the score was. NOT baseline_score, which is what a rule
  # said. Recorded, displayed and routed on; never the reason a gate opened.

# ---------------------------------------------------------------------------
# FACT ORIGINS. WHERE A VALUE ACTUALLY CAME FROM, AND WHICH ORIGINS OPEN A GATE.
#
# `source:` on every line above says where a fact is SUPPOSED to come from. It is
# a property of the ledger and it is the same in every run. `origin` is where one
# particular VALUE in one particular run actually came from, and it is a property
# of the value. Until this block existed the file had the first and not the
# second, and so the five gates were only as true as whoever filled the dict:
#
#   A provider that merely ASSERTED eval_size_n, baseline_measured, baseline_score,
#   prompt_iterations, retrieval_tried and model_swap_tried got TRAIN__LORA_SFT
#   with all five gates green. eval_size_n and baseline_measured are declared
#   `source: inspect` - they must be MEASURED - and nothing anywhere enforced that
#   they came from a tool rather than from the model's mouth. supplied_facts()
#   tracked presence, not origin. cost_provenance applied measured/defaulted to
#   the four hardware facts and to nothing else. The only defence was the
#   instruction set, i.e. prose.
#
# The structural walls held and still hold: no tool can DECIDE a gate, and a
# lying provider that demanded a training verdict got
# BLOCKED__DEFINE_SUCCESS_FIRST. The invariant as literally written at the top of
# this file was satisfied. THE PROMISE WAS NOT. The entire product is the
# sentence "do not train anything", and a sycophantic model is exactly the
# adversary that sentence exists to survive. This is not hypothetical: with the
# whole instruction set in its context, a small local model wrote "Yes, but..."
# about training with zero gates satisfied and invented a VRAM figure to go with
# it. A small local model does not obey seventeen laws because somebody wrote
# them down. Prose is not a wall. This block is the wall.
fact_origins:

  # -------------------------------------------------------------------------
  # FOUR ORIGINS, AND THE SPLIT BETWEEN THE MIDDLE TWO IS THE DESIGN DECISION.
  #
  # Three were proposed - MEASURED, ASSERTED, DEFAULTED - and three is one too
  # few, because "a human or a model said so" collapses two things this product
  # must tell apart.
  #
  # A person saying "I already tried prompting three times" is the user answering
  # a question the ledger declares `source: ask`. The ledger says that fact is
  # THEIRS to supply; there is no tool that could check it; refusing to believe
  # them would make G2 unpassable for every honest user, and a product with no
  # reachable training path is not more honest, it is just broken. Believing them
  # is not a hole. It is the design.
  #
  # A MODEL saying "the user already tried prompting three times" is a different
  # event with the same shape. Nobody tried anything. The model produced the
  # token sequence most likely to please, which is the exact failure this whole
  # file exists to survive and the one we have already watched happen. A model is
  # not a witness to the user's own history and must never be recorded as one.
  #
  # So the vocabulary distinguishes them, and the admissibility table below can
  # then say the thing that is actually true: an `ask` fact may be opened by the
  # user's own answer and may not be opened by a model's guess at it.
  vocabulary:
    MEASURED: >
      A tool ran and the engine watched it produce this value. The eval set was
      counted, the baseline was scored, the GPU was read off the machine. This is
      the only origin that can open a gate whose fact the ledger declares
      `source: inspect`, because "inspect" is a promise that a tool looked.
    STATED: >
      The user said so, in their own person, answering a question the harness
      asked them. It may be wrong. Nothing checked it. But the ledger declares
      these facts `source: ask` precisely because there is nobody else to ask,
      and a product that will not take the user's own answer about their own
      history has no honest way to proceed. A STATED value is accountable to
      somebody; that is what separates it from the next line.
    ASSERTED: >
      A model said so. Or nobody said where it came from, which is the same state
      of knowledge. It may be true. Nothing checked it and nobody is accountable
      for it. An ASSERTED value may be carried, displayed and routed on - it may
      never be the thing that opens a gate.
    DEFAULTED: >
      Nobody supplied it, so the ledger's own declared default applies - and
      where the ledger declares no default, the default is null. This is the
      engine speaking, not a person and not a model, and every default in this
      file is the pessimistic reading of "nobody has done this yet". No default
      in this ledger can open a gate; that is a property worth keeping and
      RC9_NO_DEFAULT_OPENS_A_GATE is what keeps it.

  origin_of_an_unattributed_value: ASSERTED
  why_unattributed_is_asserted: >
    A bare value carries no claim about where it came from, and the engine does
    not guess upward. Invariant 3 of AGENTS.md says a number with no provenance
    does not get displayed; the same reading applied to gates is that a value
    with no origin does not open one. This is what makes the wall hold at the
    channel that matters. `run_diagnosis` takes a JSON object straight from the
    user's model; every value in it is bare; every bare value is therefore an
    assertion by the thing that typed it. No boundary code has to remember
    anything. Failing closed is the default and attributing is the deliberate act.
  the_origin_is_never_supplied_by_the_thing_being_checked: >
    A model cannot mark its own assertion MEASURED, because the tool boundary
    offers it no field to do that in - it sends `facts`, and facts are values.
    MEASURED is written by the code that ran the tool, next to the tool call, and
    by nothing else. If a future tool schema ever grows an `origins` argument a
    model can fill, this whole block becomes decoration on that day. Do not add
    one.

  # -------------------------------------------------------------------------
  # WHICH ORIGINS MAY SATISFY A GATE, KEYED BY THE LEDGER'S OWN `source:` TAG.
  #
  # Keyed by `source:` and not by fact name, so a fact added tomorrow is covered
  # the moment its source is written down, and there is no second list to keep in
  # step with the first.
  admissible_for_gates:
    inspect: [MEASURED]
    ask:     [MEASURED, STATED]
    derive:  [MEASURED]
  why_inspect_is_measured_only: >
    `source: inspect` is this file promising that the harness READS the fact
    rather than asking for it. eval_size_n and baseline_measured are the two the
    adversary named and they are the two the gates lean hardest on. If an
    assertion satisfies them, G0 and G1 are decoration and the other three gates
    are only ever reached down a path that has already lied.
  why_ask_admits_stated: >
    See the paragraph above the vocabulary. No tool can check whether somebody
    rewrote their prompt three times. The user is the only witness and the ledger
    already says so by tagging the fact `ask`.
  why_derive_is_measured_only: >
    A derived fact is by definition the output of a computation over data the
    harness can read - failure_histogram from an LLM-judge over real failures,
    no_suitable_open_weight_base_exists from a model search, and the ledger says
    so in as many words on that line: "from the model search, not from a user
    claim". If nobody computed it, nobody has it, and the user cannot state it
    because it is not a fact about them. A derive fact produced by a tool the
    engine ran is MEASURED and passes; the same fact recited by a model is not.

  # -------------------------------------------------------------------------
  # A MODEL'S OPINION OF ITS OWN WORK IS NOT A READING, AND THE THREE ROWS ABOVE
  # COULD NOT TELL. THIS IS THE THIRD FACE OF THE SAME DEFECT.
  #
  # `admissible_for_gates` asks WHO SUPPLIED a value. The evaluation bench gave
  # that question the honest answer and was still wrong. `run_eval` with
  # `metric=model_graded` really does run a tool, the engine really does watch
  # it, and every word of MEASURED's own definition is satisfied - what the
  # engine watched was a model being asked "were you right?".
  #
  # REPRODUCED END TO END BEFORE IT WAS FIXED, on a scratch database, thirty
  # rows, one connection answering both prompts:
  #
  #     baseline_score        0.967   MEASURED
  #     exact_match           0.400   the same rows, the same run, for free
  #     G1_BASELINE_MEASURED  PASSED
  #     verdict               NO_TRAIN__SHIP_AS_IS
  #
  # The product told a user to ship a system that gets four rows in ten right,
  # because the system said it was fine. That is a wrong number wearing MEASURED
  # in the flattering direction, which is the single thing this block exists to
  # make impossible. The same lever pushed the other way - a harsh judge, a
  # deflated score - opens G1 on a model's opinion and routes toward training.
  #
  # WHY THE ORIGIN VOCABULARY ALONE CANNOT FIX IT. MEASURED is "a tool ran and
  # the engine watched it produce this value", and the origin was not lying. The
  # missing question is the one `fact_scopes` below asks for a different reason:
  # a measurement OF WHAT. A judge score is a real measurement of THE JUDGE'S
  # OPINION and no measurement at all of whether the answer was right. Two facts,
  # one name.
  #
  # SO THE FIX IS AT THE NAME AND AT THE ORIGIN, BOTH, AND NEITHER ALONE:
  #
  #   * THE NAME. A model's grade is `judge_score` and never `baseline_score`.
  #     No gate row reads it - SC6_NO_GATE_READS_AN_OPINION - so the conflation
  #     stops before admissibility is ever consulted. Fixing only the origin
  #     would leave `baseline_score` meaning two different quantities depending
  #     on a flag, which is how this arrived.
  #   * THE ORIGIN. A fact declared `opinion_of:` may never carry MEASURED,
  #     through any door: `evidence.record` refuses it however it is reached, and
  #     `evidence.may_be_declared_measurable` refuses it at registration so no
  #     tool can even name it in `measures=`. It reaches the ledger through
  #     `Instrument.opinion` and arrives ASSERTED, which is what the vocabulary
  #     above already says a model's word is worth. Fixing only the name would
  #     leave a second fact that a gate written next year could open on.
  #   * AND THE LAUNDERING BETWEEN THE TWO. A bench that recorded the judge's
  #     0.967 as `judge_score` and then stamped the same 0.967 as
  #     `baseline_score` would have done the whole thing anyway, so
  #     `Instrument.measured` refuses a value this call has already recorded as
  #     an opinion. That is wall 2's rule turned inward: a tool may not stamp
  #     what its CALLER handed it, and it may not stamp what A MODEL handed it
  #     either.
  #
  # A DIFFERENT MODEL AS JUDGE IS THE SAME FACT, and it is worth saying why
  # rather than leaving it to be inferred, because the distinction is real and
  # building a rule on it is tempting. A judge that did not write the answers
  # does not carry the specific bias a self-grader does - a model asked whether
  # it was right will tend to say yes - and the harness says which case it is,
  # in words, next to the number, where a person reads it. It does not get a
  # different ADMISSIBILITY, for two reasons. The weaker one: it is still an
  # opinion with nobody accountable for it, and ASSERTED is the vocabulary's
  # word for exactly that. The one that decides it: THE HARNESS CANNOT CHECK IT.
  # "A different model" is `judge_model != model`, a comparison of two strings
  # the user chose, and the same weights behind a second connection with a second
  # name would pass it. A wall built on a string the user controls is not a wall,
  # and a two-tier rule that can be stepped over by renaming a connection is
  # worse than one tier, because it teaches the reader that the tier meant
  # something.
  #
  # AND THE OPPOSITE FAILURE, CHECKED RATHER THAN ASSUMED AWAY. Some tasks
  # genuinely cannot be graded by a rule - that is why `model_graded` exists and
  # why `metric_is_programmatic` is a fact this file routes on - and a bench that
  # REFUSED a judge would be less useful than one that labels it. This does not
  # refuse. The judge runs, its number is recorded, shown and routed on, and only
  # the gate is closed to it; `scope` above already says why routing on an
  # assertion is allowed and a verdict on one is not. What G1 wants instead is
  # written in G1's own `on_fail.if_only_a_judge_has_scored_it`, and it is the
  # thing this file already believed at S4_METRIC_NOT_PROGRAMMATIC: write the
  # grade as code, or calibrate the judge against a human-graded sample of the
  # same rows. NO FACT IS DECLARED HERE FOR THAT CALIBRATION, deliberately -
  # nothing in this harness runs that loop yet, and
  # `evidence.may_be_declared_measurable` explains why a door is not opened in
  # advance for a tool nobody has written.
  a_models_opinion_is_not_a_reading:
    declaration: opinion_of
    means: >
      This fact is a judgement made by the named party, not a reading taken by
      the harness. `model` is the only value the ledger uses today.
    rule: >
      A fact declared `opinion_of:` may never carry the MEASURED origin, and no
      gate `passes_when` row may read it. Both halves, always: the first stops
      the value being laundered, the second stops the question being asked.
    the_property_in_one_line: >
      A gate may not open on a model's opinion of its own work.
    enforced_by:
      - SC6_NO_GATE_READS_AN_OPINION
      - "evidence.record: refuses a MEASURED row for an opinion fact at the table, whichever door reached it"
      - "evidence.may_be_declared_measurable: refuses `measures=` at registration, so no tool can try"
      - "Instrument.measured: refuses the fact, and refuses a value the same call already recorded as an opinion"
      - "Instrument.opinion: the only door in, and it stamps ASSERTED regardless of who the actor is"
    a_different_judge_is_the_same_fact: >
      See the paragraph above. The distinction is carried in what the harness
      REPORTS - `self_graded.is_the_model_that_answered`, and the `how` line
      recorded beside the number - and never in what opens a gate, because the
      harness cannot check it. It is a comparison of two names the user chose.
    it_does_not_refuse_the_judge: >
      A model-graded eval still runs, still records, still displays and still
      routes. What changed is that it can no longer be the reason a gate opened.

  # THE SECOND DECLARATION IN THIS ROW, AND IT ASKS ABOUT THE READER RATHER THAN
  # THE VALUE. `opinion_of:` says a fact is somebody's judgement. `measured_by:`
  # says which KIND of instrument may take the reading - and it exists because
  # every check in this product before it asked where a number CAME FROM, and a
  # tool of the wrong kind passes all of them honestly. A tabular fit computing
  # a genuine accuracy on a genuine table, declaring `measures=("baseline_score",)`,
  # opens G1 - the gate about a text baseline scored against a trivial one -
  # with a number about a CSV. Nothing was laundered and nothing was invented.
  a_fact_names_the_instrument_that_can_read_it:
    declaration: measured_by
    means: >
      The capabilities whose tools may stamp this fact MEASURED, named from the
      closed vocabulary app/tools/blocks.py publishes - the same names
      contract.capabilities.needs uses one block up. Capabilities rather than
      tool names, because a ledger is domain knowledge and a tool rename would
      silently unbind every fact in this file.
    rule: >
      A tool whose `provides=` intersects nothing in a fact's `measured_by:`
      may not declare `measures=` on it and may not stamp it. Absent means this
      ledger has not spoken about the fact, which is permissive - reading
      silence as "nothing may measure this" would refuse every stamp in the
      product. What keeps that from being a hole is a ratchet rather than a
      default, in tests/test_a_fact_names_its_instrument.py: every fact some
      registered tool measures must declare this, so an instrument shipped
      without one reddens the run that adds it.
    the_property_in_one_line: >
      Being the wrong instrument is a refusal rather than a matter of care.
    enforced_by:
      - "registry._validate: refuses `measures=` at registration, swept over every shipped ledger"
      - "Instrument.measured: refuses the stamp per call, against the ledger the thread is running"
      - "blocks.check_fact_instruments: refuses a capability name this engine does not publish"
    why_it_is_checked_twice: >
      The same reason `measures=` is. Registration happens at import, with no
      thread and therefore no domain, so it reads the union of every ledger
      this product ships; a call has a thread, so it asks the one ledger that
      thread is actually running.

  # -------------------------------------------------------------------------
  # THE RULE. Evaluated per `passes_when` row, at the moment the row is checked.
  #
  #   1. Evaluate the row against the real values, exactly as before. If it does
  #      not pass, nothing changes: the gate fails and `on_fail` routes. The user
  #      who admits to one prompt iteration is told to go and iterate - never
  #      told to substantiate their claim of one.
  #   2. Otherwise take the facts the row's condition READS - from the parsed
  #      condition, never from a list - and keep those the caller supplied whose
  #      origin is not admissible for that fact's declared `source:`. Call them
  #      the challenged facts. If there are none, the gate passes exactly as
  #      before.
  #   3. Otherwise evaluate the row a second time with every challenged fact
  #      reset to its unsupplied reading. If it STILL passes, the challenged
  #      facts were not load-bearing - they sat in a disjunct something
  #      admissible had already satisfied - and the gate passes.
  #   4. Otherwise the gate does not pass, and the run ends at
  #      unsubstantiated_outcome naming the gate, the facts, and what would
  #      substantiate each one.
  #
  # Step 1 before step 3 is what makes step 3 safe. Masking a value can only ever
  # WEAKEN a condition - `eval_size_n < 50` becomes true when 100 is masked back
  # to the default 0 - so a masked evaluation on its own could pass a row the real
  # values fail. It is an AND of the two, so it cannot: the masked pass can only
  # confirm a pass the real values already gave.
  rule: >
    A gate passes only if its row passes on the real values AND passes again with
    every inadmissibly-originated fact it reads masked back to its unsupplied
    reading. Otherwise the gate does not pass.
  scope: >
    ORIGINS ARE CHECKED AT GATES AND NOWHERE ELSE, and that is a decision rather
    than an oversight. The invariant is about what may OPEN A GATE. An asserted
    number is still a number and nodes may still route on it, because a route is
    not a verdict and because refusing to route on unattributed facts would turn
    every un-attributed intake into ERROR__NO_NODE_MATCHED - a stack trace, which
    RC8 exists to abolish. What an assertion may never do is be the reason a
    TRAIN__ outcome was minted, and every TRAIN__ outcome is downstream of five
    gates.

  unsubstantiated_outcome: ACTION__SUBSTANTIATE_CLAIMED_FACTS
  why_a_distinct_outcome_and_not_a_silent_failure: >
    Silently failing the gate was the other option and it tells the user
    something false. "Build an eval set" is the wrong sentence to say to somebody
    who has just told you they have one; it reads as the product not listening,
    which is the one thing this product cannot afford. The honest sentence is
    "you told me there is an eval set - show it to me, and here is how", and that
    is a different answer, so it gets a different outcome id. It is an ACTION__,
    so its verdict is BLOCKED and it means what every other ACTION__ means: we
    cannot answer until you do this and re-enter. The voice of this product is
    honest next steps rather than refusal, and this is the next step.
  what_the_outcome_carries: >
    The gate that refused, and one row per challenged fact - the fact name, its
    declared `source:`, the origin the value actually had, and the substantiation
    line for that source. All of it is read out of this file. The renderer never
    composes a sentence about a fact the engine did not name.

  substantiation:
    inspect: >
      A tool has to run and the engine has to watch it. Point the harness at the
      file, the folder, the repository or the machine and let it count for
      itself. An eval set you can name is an eval set we can measure.
    ask: >
      You have to say this one yourself. It was answered on your behalf, and a
      model answering for you is not you answering - it is a guess at what you
      would like to have been true. Confirm it and it counts.
    derive: >
      This has to be computed from data the harness can read, not recited. Give
      the harness the inputs it derives from and let it derive.

  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # WHAT THIS BLOCK DOES NOT COVER. Named here rather than found later, because
  # the value of this file is that its gaps are written down in it.
  known_gaps:
    the_two_helpers_are_not_origin_checked: >
      `user_confirms(statement)` and `user_can_produce(n, thing)` are not ledger
      facts, carry no `source:`, and arrive as bare booleans beside the fact
      dict. They are also, by their own names, THE USER SPEAKING - and nothing
      checks that the answer came from a user rather than from a model answering
      on their behalf, which is the whole defect this block exists to close,
      surviving in the two places that say "user" in their identifiers.
      They cannot open a gate: no `passes_when` row calls either of them, and
      the origin rule is scoped to gate rows. What they can do is let a proposal
      past S9_DATA_INSUFFICIENT's DISTILLATION floor. So the five-gate invariant
      holds and this is not a hole in it. It is the next thing to close, and the
      shape is obvious: give the helpers the same origin channel the facts have,
      admitting MEASURED and STATED and nothing else.
    the_stage_9_data_floors_read_unchecked_numbers: >
      S9_DATA_INSUFFICIENT and S9_SIZE_TO_METHOD read labeled_examples_n,
      preference_pairs_n, corpus_tokens and calls_per_day, and an ASSERTED value
      satisfies them. Again this opens no gate - all five still have to pass on
      admissible origins before the mint - but "you have eight hundred
      demonstrations" is a claim of the same kind as "you have an eval set", and
      it decides WHICH method gets recommended and whether the floor is cleared.
      It is deliberately out of scope for this pass because it is a different
      question from the invariant, and it is the second thing to close.
      Extending the rule to every node is NOT the answer: `scope` above says why,
      and the answer for a fact set with no attribution has to stay an answer
      rather than a stack trace. The right shape is a per-node opt-in on the
      handful of nodes that are floors rather than routes.
  # THIS IS NOT THE SAME VOCABULARY AS THE PROVENANCE TAG ON A DISPLAYED NUMBER,
  # and it must not be quietly merged with it. Written down here because the
  # collision is a rename away and the rename would be a plausible tidy-up.
  #
  # `docs/DESIGN_SYSTEM.md` §3.7 defines three tags for a NUMBER THE PRODUCT
  # PUTS ON SCREEN: `Measured` (read from the machine, the file or the API),
  # `Inferred` (derived from something measured) and `Defaulted` (nobody looked).
  # `HardwareProfile.Field.provenance` in docs/ARCHITECTURE.md carries the same
  # three. That axis answers "how much do we know about this number".
  #
  # This block's four answer a different question: WHO SUPPLIED THIS FACT, and
  # therefore may it open a gate. They are not a superset and not a subset.
  #
  #   MEASURED   is the same event in both, and is the only word they share.
  #   STATED     has no display tag. A number the user typed is not `Inferred`
  #              - nothing derived it - and it is not `Defaulted` - somebody did
  #              look. The display layer needs a fourth tag for it or it will
  #              show a typed-in figure as measured, which is the 8.0-GB defect
  #              in a new costume.
  #   ASSERTED   has no display tag either, and it is the more dangerous gap: a
  #              number the model produced would currently render as `Measured`.
  #   DEFAULTED  matches `Defaulted`.
  #   INFERRED   has no origin here, deliberately. A fact the engine computed
  #              from other facts is not something anybody SUPPLIED, so it never
  #              arrives through the fact dict at all - it is `derived:` above.
  #
  # SO THERE IS WORK OWED IN THE INTERFACE, and it is named rather than left for
  # somebody to trip over: the provenance tag rail needs to be able to say
  # STATED and ASSERTED, or every fact a person typed and every fact a model
  # invented will render identically to one a tool measured. Whoever owns
  # docs/brand/graphite.html and DESIGN_SYSTEM §3.7 decides what those two look
  # like; the engine already carries the answer on every fact, in
  # Diagnosis.fact_origins.
  relationship_to_the_displayed_number_provenance: >
    Two axes, one shared word. The display tags Measured / Inferred / Defaulted
    say how much is known about a number the product computed. These four say who
    supplied a fact, and therefore whether it may open a gate. Do not merge them;
    STATED and ASSERTED have no display tag yet and both currently render as
    though they were measured.
  # HOW A VALUE GETS AN ORIGIN, so nobody has to guess at the calling convention.
  # A fact is a value, or a value carrying an origin. The engine accepts both and
  # reads the bare form as ASSERTED. See `Fact` in app/diagnosis.py.
  calling_convention: >
    facts = {"eval_size_n": Fact(120, MEASURED),
             "prompt_iterations": Fact(5, STATED),
             "modality": "text"}
    The third is bare and is therefore an assertion by whoever built the dict.
    Fact(None, anything) is a value nobody has and resolves to DEFAULTED like any
    other absent fact. DEFAULTED may not be supplied by a caller - the engine is
    the only thing entitled to say a value came from the ledger's own default -
    and a caller that tries gets a FactError.

# ---------------------------------------------------------------------------
# FACT SCOPE. WHAT A MEASUREMENT IS A MEASUREMENT *OF*, AND THEREFORE WHERE IT
# BELONGS.
#
# `source:` says where a fact is supposed to come from. `origin` says where one
# particular value actually came from. Both are about PROVENANCE, and the two of
# them together were not enough, because a value can be genuinely measured,
# genuinely stamped by the code that ran the instrument, and still be attached to
# nothing that says what it is a measurement OF.
#
# THIS IS NOT HYPOTHETICAL AND IT WAS LIVE IN THE OWNER'S OWN DATABASE. The
# evidence table has a nullable `thread_id`, and `evidence.rows_for` reads a NULL
# there as "this is true of the machine, so every conversation may see it". That
# read is right. The write side did not exist: `record()` accepted
# `thread_id=None` for ANY fact, `POST /api/tools/{name}` made `thread_id`
# optional, and so `measure_eval_set` run without one counted a real file
# honestly and filed the answer where every conversation on this machine could
# see it. Reproduced on a scratch database: thread 4242, which had never been
# shown a file, read `Fact(value=120, origin='MEASURED')` and G0_EVAL_SET opened
# on it. The owner's database held exactly three NULL-thread rows and all three
# were `eval_size_n` - the machine-scope mechanism was in use only by the one
# fact that must never use it. See
# `app/migrations/v006_machine_scope_is_declared_not_assumed.py`.
#
# `rows_for`'s own docstring had already named this failure, with the same fact
# and the same number: "the eval set has 120 rows is a fact about one project and
# leaking it sideways would open a gate in a conversation where nobody counted
# anything." Somebody saw it, wrote it down, guarded the READ path, and left the
# WRITE path open. A rule enforced on one side of a table is a rule that is not
# enforced.
#
# So scope is DECLARED, per fact, next to the type and the source, and this
# ledger is the only place that says which is which.
fact_scopes:

  # -------------------------------------------------------------------------
  # TWO SCOPES, AND THE QUESTION THAT SEPARATES THEM IS "WOULD ASKING AGAIN IN A
  # NEW CONVERSATION GET THE SAME ANSWER, FOR REASONS THAT HAVE NOTHING TO DO
  # WITH THE CONVERSATION?"
  #
  # A third - PROJECT - was argued for and refused. It is the honest middle: a
  # project has many threads, and an eval set really does belong to the project
  # rather than to one conversation about it. It is refused HERE, TODAY, because
  # `fact_evidence` has no project column, so declaring a scope the store cannot
  # express would be a promise in a file rather than a rule in a table - which is
  # the exact shape of the defect this block exists to close. The narrower
  # reading loses nothing but repetition: a second thread on the same project
  # re-runs the count, and counting a file again is cheap and honest. When the row
  # grows a `project_id`, this is where the third word goes, and every fact tagged
  # `thread` gets re-read one at a time rather than promoted in a batch.
  vocabulary:
    machine: >
      A fact about this computer. The accelerator in this box, the VRAM on it,
      the RAM installed, the disk free. It is the same fact in every conversation
      because it is the same box, no project changes it, and measuring it once
      and showing it everywhere is not a leak - it is the whole reason the
      harness reads the machine at all. A machine-scoped row may be written with
      no thread, and `evidence.rows_for` then shows it to every thread.
    thread: >
      A fact about one project, in one conversation. The eval set, the baseline,
      the goal, the budget, what has already been tried. `eval_size_n` is the
      sharpest example in the product: "the eval set has 120 rows" is true of one
      file somebody pointed at in one conversation, and carrying it sideways
      opens G0 in a conversation where nobody counted anything. A thread-scoped
      row MUST carry the thread it belongs to, and `evidence.record` refuses one
      that does not.

  scope_of_an_undeclared_fact: thread
  why_undeclared_is_thread: >
    The same reading as `origin_of_an_unattributed_value`, for the same reason:
    the safe answer is the one you get by forgetting. A fact whose scope nobody
    wrote down, or a name this ledger has never heard of, is refused a
    thread-less write rather than waved through one. Widening is the deliberate
    act - somebody types `scope: machine` on a line, in this file, where a
    reviewer reads it - and forgetting can only ever narrow.

  rule: >
    `evidence.record` refuses to append a row for a thread-scoped fact when no
    thread was given. Not on the read path, which was already right; on the WRITE
    path, where the hole was. A machine-scoped fact written with no thread is
    accepted and is visible everywhere, which is what machine scope means.
  the_refusal_names_the_door: >
    A refusal that names nothing is a wall with no door, and the caller who hits
    this one is exactly the caller who does not know the argument exists. So the
    message says the argument (`thread_id`), both doors it arrives through (the
    body of POST /api/tools/{name}, and `REGISTRY.call(thread_id=...)`, which the
    conductor fills from the turn it is running), what this particular fact would
    have done had it been let through, and which facts are machine scope - so a
    caller who genuinely has no conversation can see the shape of the exception
    rather than guess at it.

  # -------------------------------------------------------------------------
  # THE HTTP DOOR. `thread_id` stays optional in the body, and the ROUTE decides
  # what optional means, per tool, rather than leaving it to the ledger alone.
  #
  # Optional is right for `inspect_hardware`: every fact it declares is machine
  # scope, a person reading their own hardware page has no conversation open, and
  # demanding one would be ceremony. Optional is wrong for anything that can
  # write a thread-scoped fact, and there the route answers 400 - an incomplete
  # request, which is a different event from a tool defect, and a tool defect is
  # what the ledger's MeasurementError becomes at that boundary (500). Two
  # refusals, two status codes, and the earlier one is the one that can say what
  # to send instead.
  the_http_door:
    thread_id_may_be_omitted_when: >
      Every fact the tool could write is machine scope. Derived from the tool's
      own `measures=` and the scope declared on each fact above - never from a
      list of tool names here, which would go stale on the day a tool is added.
    thread_id_is_required_when: >
      The tool declares `writes: facts`, which means it can reach
      `Instrument.supplied` with any name in the ledger and is therefore bounded
      by nothing; or any fact in its `measures=` is thread scope.
    and_the_ledger_still_refuses: >
      The route check is the early, specific, well-numbered half. It is not the
      wall. `record()` refuses the row whichever door the call came through -
      including from Python, where there is no route at all - and that refusal is
      what `tests/test_a_thread_scoped_fact_needs_a_thread.py` reverts in order
      to watch its own detector go red.

  # -------------------------------------------------------------------------
  # WHAT THIS DOES NOT COVER, named here rather than found later.
  known_gaps:
    a_machine_fact_can_still_be_asserted_machine_wide: >
      The four machine facts carry `fallback: ask`, so a value for one of them
      may arrive STATED or ASSERTED rather than measured. Written with no thread,
      such a row is visible everywhere - correct for a person saying "this box
      has 24 GB of VRAM", and a model's guess spread machine-wide in the other
      case. It opens no gate: all four are `source: inspect`, and
      `admissible_for_gates` gives inspect `[MEASURED]` and nothing else. So the
      five-gate invariant holds and this is a display debt rather than a gate
      hole - the same debt `relationship_to_the_displayed_number_provenance`
      already names.
    scope_is_not_checked_again_at_the_gate: >
      Scope is enforced where a row is WRITTEN and nowhere else, because the read
      path already answers the reading question: `rows_for` decides what a thread
      can see, and a row a thread cannot see cannot open anything for it. There is
      deliberately no second scope check at gate time - a second answer to the
      same question is the drift machine this file argues against everywhere else.

# ---------------------------------------------------------------------------
# WHAT HAPPENS WHEN A FACT CANNOT BE INSPECTED. A POLICY, NOT A HOPE.
#
# A fact declared `source: inspect` or `source: derive` with no default resolves
# to null when the harness cannot read it. Null is fine in an ordering
# comparison - an unmeasured score is not greater than a target, and the engine
# reads it that way deliberately - but null is NOT fine when a whole branch
# turns on the fact, because every node in that branch then evaluates false and
# the stage runs off the end with ERROR__NO_NODE_MATCHED. That is a stack trace
# where the product's entire pitch is an honest answer, and 1.2% of randomized
# fact sets got one.
#
# So every fact a condition depends on has exactly one of these three, chosen
# per fact and written down:
#
#   DEFAULT      Only where the default is the honest reading of "nobody has
#                done this yet" - every `tried` boolean, every counter of work
#                done, and failure_histogram: {}. A default is never used to
#                invent a measurement.
#   NONE-SAFE    Where a null genuinely means the node does not apply, and some
#                later node in the same stage still fires. Checked by the
#                catch-all rule below, not assumed.
#   ASK          A terminal ACTION__ node that names the fact and says how to
#                supply it. This is the right answer for the facts a whole
#                branch turns on, and there are six of them:
#                  modality              S0_MODALITY_UNKNOWN
#                  target_score          S0_NO_TARGET_SCORE
#                  knowledge_volatility  S3_KNOWLEDGE_VOLATILITY_UNKNOWN
#                  retriever_recall_at_k S3_RECALL_UNMEASURED
#                  schema_compliance     S4_FORMAT_UNMEASURED
#                  tabular_rows          S8_TABULAR_ROWS_UNKNOWN
#                Saying "I could not read X, here is how to tell me" is a real
#                answer. Raising is not.
#
#                EACH OF THE SIX CARRIES AN `asks:` LINE, AND IT IS NOT THE SAME
#                LINE AS `say:`. `say:` is what the node says when it FIRES -
#                "How fast your facts go stale decides this branch on its own" -
#                which is what-this-fork-decides, not a question put to a person.
#                A surface building a question card off `say:` puts the engine's
#                reasoning where the question should be, and app/asking.py said
#                so in as many words rather than composing one, because a module
#                writing the question would be the module inventing the engine's
#                reasoning. So the question is written HERE, next to the
#                condition it would answer, in the same register as the gates'
#                own `asks:` - one plain sentence, ending in a question mark,
#                that a person could be read down a phone. `action:` still says
#                what to DO about it and `say:` still says why it matters; the
#                three are different jobs and the card wants all three.
#
# THE CATCH-ALL RULE, which is what makes the policy checkable rather than a
# list of good intentions: EVERY STAGE ENDS IN A NODE THAT CANNOT FAIL TO FIRE
# for any run that can reach it, or in an `always` router. The last node of a
# stage carries a condition that is true for every run the nodes above it did
# not terminate - written as a real predicate, never as `condition: always`,
# because an `always` non-router is indistinguishable from a node whose
# condition someone deleted. See RC8_NO_STAGE_RUNS_OFF_THE_END.
uninspectable_facts:
  rule: "every fact named in a condition has a default, a null-safe reading, or an ASK node"
  ask_nodes:
    modality:              S0_MODALITY_UNKNOWN
    target_score:          S0_NO_TARGET_SCORE
    knowledge_volatility:  S3_KNOWLEDGE_VOLATILITY_UNKNOWN
    retriever_recall_at_k: S3_RECALL_UNMEASURED
    schema_compliance:     S4_FORMAT_UNMEASURED
    tabular_rows:          S8_TABULAR_ROWS_UNKNOWN
  stage_terminators:
    stage_0_admissibility: S0_MODALITY_FORK        # always-router, and the only one
    stage_1_baseline:      S1_ROUTE_BY_FAILURE_MODE  # always-router
    stage_3_knowledge:     S3_KNOWLEDGE_GAP_IS_NOT_RETRIEVAL
    stage_4_format:        S4_CONSTRAINT_NOT_HOLDING
    stage_5_behaviour:     S5_NOT_ENOUGH_DEMONSTRATIONS
    stage_6_capability:    S6_ABSENT_AND_NO_DATA
    stage_7_efficiency:    S7_PRESSURE_BELOW_THE_LINE
    stage_8_classical:     S8_TEXT_CLASSIFICATION_NEEDS_LABELS
    # Was S8_TABULAR_UNMATCHED, which covers every TABULAR run and nothing else.
    # This stage has two doors now - S0_MODALITY_FORK and
    # S1_CLOSED_SET_CLASSIFICATION - and the second one lets text and code runs
    # in, which `modality == tabular` does not describe. A new door into a stage
    # means re-reading that stage's terminator; this line is what that re-read
    # produced.
    stage_8_offtheshelf_first: S8_VISION_AUDIO_OFFTHESHELF
    stage_9_method_selector:   S9_MINT_TRAIN_VERDICT
  one_known_gap: >
    stage_1_baseline ends in the `always` router S1_ROUTE_BY_FAILURE_MODE, which
    raises if failure_histogram carries only keys the router has no route for.
    `failure_mode` is not a declared enum, so this file cannot close that from
    here - it is a fact-validation job, and it is named rather than papered over.
    ACTION__CLASSIFY_FAILURES names the eight buckets the router routes for, and
    they are the same eight.

# Engine state, computed during a run. Not facts, not user-visible inputs, and
# not part of the ledger count.
derived:
  proposed_method:          "the method a stage put forward; UNSET until one does"
  method_class:             "methods[proposed_method].class"
  struck_methods:           "set, appended to by any node carrying `effect: strike ...`"
  labels_are_open_ended:    "not labels_are_closed_set"
  size_row: >
    The single row of the S9_SIZE_TO_METHOD table whose `examples` band contains
    labeled_examples_n. Null until S9_SIZE_TO_METHOD runs.
  required_rank: >
    int or null. It is size_row.rank_max - a real integer, read from a real
    integer field on the table. Null on the top row, where the table stops
    offering LoRA at all and there is no rank to read.
    NOTHING IN THIS FILE COMPARES required_rank TO A NUMBER. S9_FULL_FT_JUSTIFIED
    reads size_row.full_ft_offered instead. The old condition compared
    required_rank to 256 while every rank cell in the table was a string like
    "64-256", so the comparison could never be true and TRAIN__FULL_FINETUNE was
    unreachable. Adding rank_min/rank_max makes required_rank a number; removing
    the comparison makes it impossible for the same defect to come back through a
    different field.
  # THE ENUM IS DECLARED, NOT SCRAPED. The engine used to read this entry BY THE
  # KEY NAME "route" and pull capitalised words out of the prose below with a
  # regular expression, which is how a ledger with no `derived.route` got a bare
  # KeyError from a loader whose whole job is to refuse with a message. It was
  # also far too generous - any shouted word in the paragraph became a value a
  # condition could use. A derived value declares its members the same way a fact
  # does, and one that declares none contributes none.
  route:
    enum: [FULL_FT, LORA, QLORA, RENT_GPU, SHRINK_BASE]
    means: >
      The S9_HARDWARE_ROUTER verdict. Null when the router does not run - it runs
      only for llm_weights and llm_efficiency proposals, because its table is an
      LLM VRAM table.
  hardware_permits: >
    bool or null, from S9_HARDWARE_ROUTER given vram_gb / accelerator / ram_gb.
    Null when the router does not run. Only S9_FULL_FT_JUSTIFIED reads it, and
    that node is guarded to llm_weights proposals, so the null case is never
    compared.
  from_scratch_cost_estimate: "from the S9_FROM_SCRATCH numbers, given target_params and tokens_available"

# Two conditions call intake helpers rather than reading a fact. They are prompts
# put to the user during intake and their answers are recorded verbatim in the
# audit trail, because a yes here ends the diagnosis.
helpers:
  user_confirms(statement): "shows the statement, records an explicit yes or no"
  user_can_produce(n, thing): "asks whether the user can produce n of the thing now"

# ---------------------------------------------------------------------------
# STAGE 0 - ADMISSIBILITY. Is this an ML problem, and is it measurable?
stage_0_admissibility:
  - node: S0_RULES_SUFFICE
    condition: "task_family in {extraction, classification} and user_confirms('a person could write the whole rule on one page') and classes_n <= 5"
    outcome: NO_ML__WRITE_CODE
    say: "This is a lookup, regex or SQL problem. A rule you can read beats a model you cannot."
    exit_criterion: "The rule handles >=95% of a 50-row sample; the residual goes to a model, not the whole task."

  # THE CARD'S NO COMES BEFORE THE QUESTIONS THAT ASSUME A YES.
  #
  # `S9_THE_CARD_CANNOT` sits at stage 9, after the gates. For a model the card
  # can hold that is right: define success, build an eval set, measure a
  # baseline, and only then ask what to train. For a model the card has just
  # REFUSED it is impossible - the baseline those gates demand would have to be
  # measured on the very model that will not load. "Refuse honestly when the
  # hardware cannot" must not require doing the impossible first, so a recorded
  # closure is consulted here, before any of it.
  #
  # IT FIRES ONLY ON A MEASURED CLOSURE, and that is the whole of its safety.
  # `state_facts` will record `cannot_train_here` at a caller's origin - it says
  # "cannot, at this origin" and keeps the row, because a sheet that drops what
  # somebody said cannot explain itself. So the value can be on the sheet
  # without a tool ever having run, and a bare `cannot_train_here` condition
  # would let a thread assert its own refusal and skip every gate. Harmless in
  # outcome, since a closure only closes - and still a walk deciding on
  # somebody's say-so, which is what RC10_AN_ASSERTION_NEVER_MINTS forbids.
  # `measured()` reads the ORIGIN, so only `record_that_this_card_refuses`
  # reaches this node.
  #
  # A YES CHANGES NOTHING HERE. Nothing is stamped on a YES, so a thread about a
  # model that fits has no closure, does not match, and walks into
  # S0_NO_DEFINITION_OF_SUCCESS exactly as it did before.
  - node: S0_THE_CARD_ALREADY_SAID_NO
    condition: "measured(cannot_train_here) and cannot_train_here"
    outcome: NO_TRAIN__WONT_FIT_THIS_MACHINE
    say: "The card has already refused this model, so the questions below it would be asked about a run that cannot start. The margin and the longest example that WOULD fit are on the sheet."

  - node: S0_NO_DEFINITION_OF_SUCCESS
    condition: "target_score is null and not user_can_produce(20, 'graded examples')"
    outcome: BLOCKED__DEFINE_SUCCESS_FIRST
    say: "Nothing downstream is decidable until 'good' is defined. Write 20 inputs and the output you wanted."

  - gate_ref: G0_EVAL_SET      # node S0_NO_EVAL_SET. On every path, whatever the modality.

  # ASK NODE for target_score. Below G0 deliberately: no eval set is the harder
  # ask and it must be answered first.
  #
  # S0_NO_DEFINITION_OF_SUCCESS above lets a user through with target_score null
  # as long as they can produce 20 graded examples. Producing graded examples is
  # the hard half, but it does not put a NUMBER on the file, and every "does it
  # pass" comparison in this document reads `>= target_score`. With target_score
  # null all of them are false, forever: S1_ALREADY_PASSES cannot fire,
  # S1_QUALITY_PASSES_BUT_CONSTRAINED cannot fire, S7_QUALITY_ALSO_FAILING
  # cannot fire, and S7_PRESSURE_BELOW_THE_LINE - the last node of stage 7 -
  # cannot fire either, so stage 7 ran off the end and raised. One null fact,
  # four dead nodes and a stack trace, all from a helper answer that was meant
  # to be a kindness. It is closed once, here, rather than in every stage.
  - node: S0_NO_TARGET_SCORE
    condition: "target_score is null"
    outcome: ACTION__SET_A_TARGET_SCORE
    asks: "What score on the eval set would be good enough to ship, so that 'it passed' is a number and not a judgement call?"
    action: "Put a number on 'good enough' - the score on the eval set at which you would ship. Grade your 20 examples and take the score you would have accepted."
    say: >
      "You can grade examples, which is the hard part. Now name the number. Every
      answer below this line is a comparison against it, and without it nothing
      can pass or fail - including the answer 'you are already done'."

  # ORDERING IS LOAD-BEARING: S0_PRIVACY_CONSTRAINT must stay ABOVE
  # S0_MODALITY_FORK. The fork is `condition: always` and routes out of the stage,
  # so anything below it in this stage is dead. The privacy constraint used to sit
  # below it and therefore never ran at all - the strike it exists to apply was
  # never applied on any path. An `always` router is always the last node in its
  # stage; that is a rule, not an accident of this one case.
  - node: S0_PRIVACY_CONSTRAINT
    condition: "privacy in {on_prem_only, regulated}"
    effect: >
      set constraint FORBID_THIRD_PARTY_API; strike every outcome whose RUNNING
      SYSTEM would still call a hosted third-party model.
    outcome: null   # constraint, not terminal
    what_this_does_not_strike: >
      A one-off teacher run that generates a training set is data collection, not
      the deployed system, so DISTILLATION survives this strike - distilling a
      hosted teacher into a local student is the standard answer to exactly this
      constraint, and striking it would delete the privacy branch of stage 7. The
      check that does apply to the teacher run is legal, not architectural, and it
      is S7_DISTILL_BLOCKED_BY_LICENCE.

  # ASK NODE for modality, and it must stay immediately above the fork. The fork
  # is a router with one route per enum member and no route for null, so a run
  # whose modality could not be derived reached it and the engine raised. It is
  # the single most common uninspectable-fact crash in the file, because
  # modality decides which of eight branches the user is even on.
  - node: S0_MODALITY_UNKNOWN
    condition: "modality is null"
    outcome: ACTION__NAME_THE_MODALITY
    asks: "What kind of data is this - text, tables, a time series, images, audio, code, or a mix of them?"
    action: "Say which of text, tabular, timeseries, image, audio, multimodal or code describes your data, or add the dataset so the harness can read it."
    say: >
      "I could not work out what kind of data this is, and it is the first fork
      in the tree - the tabular answer and the text answer share almost nothing.
      Tell me and everything below follows."

  # A FORK IS A DECLARED TABLE PLUS A STRATEGY THE ENGINE OWNS. This used to be
  # a bare `routes:` mapping here plus a Python function registered against the
  # string "S0_MODALITY_FORK", so a second ledger's fork could not exist under
  # any other name. `select:` is a closed vocabulary - `value` or `argmax` - and
  # `no_match:` is required, because a fork that can be reached with a value it
  # has no route for and has not said what to do is a stack trace in front of a
  # user.
  #
  # `no_match: {error: ...}` says THIS CANNOT LEGITIMATELY HAPPEN. `modality` is
  # a closed enum whose seven members are the seven routed below, so a value
  # arriving here that is not one of them is an engine or fact-validation bug,
  # and it raises exactly as it always has. Writing that down is what makes it a
  # claim a reviewer can check rather than a behaviour nobody chose.
  - node: S0_MODALITY_FORK
    condition: always
    fork:
      branch_on: modality
      select: value
      routes:
        tabular:    stage_8_classical
        timeseries: stage_8_classical
        image:      stage_8_offtheshelf_first
        audio:      stage_8_offtheshelf_first
        text:       stage_1_baseline
        code:       stage_1_baseline
        multimodal: stage_1_baseline
      no_match:
        error: "S0_MODALITY_FORK has no route for modality {value!r}"
    note: >
      Modality is decided before anything else. For tabular, the LLM branch is almost
      always wrong. This fork skips stages 1 through 7, and therefore skips four of
      the five gates - which is exactly why nothing past this fork may mint a TRAIN
      verdict without going through S9_GATE_SWEEP first.

# ---------------------------------------------------------------------------
# STAGE 1 - BASELINE GATE. Measure before you build.
stage_1_baseline:
  - gate_ref: G1_BASELINE_MEASURED    # node S1_UNMEASURED

  # ORDERING IS LOAD-BEARING: S1_QUALITY_PASSES_BUT_CONSTRAINED must stay ABOVE
  # S1_ALREADY_PASSES. Both guards are deliberate - the ordering makes it right,
  # and the explicit negation on S1_ALREADY_PASSES keeps it right if someone
  # reorders the stage without reading this comment.
  - node: S1_QUALITY_PASSES_BUT_CONSTRAINED
    condition: "baseline_score >= target_score and (need_type contains cost or need_type contains latency or need_type contains privacy)"
    outcome: REROUTE
    route: stage_7_efficiency
    say: >
      "Quality is already there - the model meets your bar. What you actually have
      is a cost, speed or where-it-is-allowed-to-run problem, and those have their
      own answers, most of which are not training."
    note: >
      This node exists because stage 7 had no way in. S1_ALREADY_PASSES tested
      quality alone and sat first, so every user whose model worked but cost too
      much, answered too slowly, or could not leave the building was told "ship it
      as is" and the run ended. Stage 7's own header is "Quality is fine; cost,
      latency or privacy is not" - it was written for precisely the users stage 1
      was swallowing. The whole stage was unreachable, and TRAIN__DISTILLATION with
      it. That is arguably the most common enterprise case in this file and the
      product could not see it.

  - node: S1_ALREADY_PASSES
    condition: "baseline_score >= target_score and not (need_type contains cost or need_type contains latency or need_type contains privacy)"
    outcome: NO_TRAIN__SHIP_AS_IS
    say: "The off-the-shelf model already meets your bar and nothing about cost, speed or privacy is in the way. Ship it and keep the eval as a regression test."
    confidence: 0.95
    note: >
      Highest-value node in the engine. A large share of intakes should terminate
      here - but only the ones where shipping it really is the whole answer. The
      quality-passes-but-still-constrained case is handled one line above; it used
      to be handled here, wrongly.

  # THE WINDOW IS TWO-SIDED BECAUSE THE SENTENCE SAYS "WITHIN", AND FOR A YEAR
  # IT WAS NOT. The condition read `trivial_baseline_score >= baseline_score -
  # 0.05`, which is one-sided: it is true for a trivial baseline three points
  # above the LLM, and it is equally true for one SIXTY-THREE points above. The
  # `say:` underneath it claimed "within 5 points" in both cases.
  #
  # This was not a wording defect. It was a WALL, found by driving a real
  # journey: a closed-set text classifier over 229 commits, an eval set carved
  # and counted, a baseline measured at 0.00 against a majority-class trivial of
  # 0.63 - the model answered in the wrong format every single time, which the
  # product had ALREADY measured into failure_histogram as {wrong_format: 30} in
  # the same thread. The answer it got was "the task or the labels are wrong,
  # not the model", about labels that had been read out of git, and the only
  # next step it offered was measure_baseline, the tool that had just run. A
  # loop, on a run where every number was measured and correct.
  #
  # AND IT SHADOWED THE NODE WRITTEN FOR EXACTLY THIS USER. This line sits
  # directly above S1_CLOSED_SET_CLASSIFICATION, which is the door to the
  # small-encoder answers - and an LLM scoring below a majority-class guess at a
  # fixed-taxonomy classification task is the single clearest signal that a
  # language model is the wrong instrument. So the one-sided window shut that
  # door on the precise population it was opened for.
  #
  # WHAT AN LLM BELOW THE TRIVIAL BASELINE ACTUALLY MEANS, and why the answer is
  # to fall through rather than to add a second terminal here. "Worse than
  # guessing" is not a statement about the labels; it is a statement that
  # something is wrong with how the model is being asked or scored, and this
  # file already contains the machinery that diagnoses that: the closed-set door
  # one line below, and failing that S1_GAP_UNDIAGNOSED - go and bucket twenty
  # failures - and then the failure-mode fork, which routes wrong_format to
  # NO_TRAIN__CONSTRAINED_DECODING. Terminating here would only move the shadow.
  #
  # MEASURED, on the ML ledger's own fixture with the two scores changed and
  # nothing else: with the one-sided window, trivial 0.63 against LLM 0.00 ->
  # BLOCKED__FIX_LABELS_OR_TASK. With this one, the same sheet declared as the
  # closed-set classifier it is -> REROUTE to stage_8_classical.
  #
  # THE FLOOR COLLISION, measured 2026-09-16 on ml-principles-dataset under Full:
  # trivial 0.05 against LLM 0.00 is "within 5 points" and fired this node with
  # "the labels are wrong" on a free-form set with forty distinct expected answers
  # - where a majority-class score near chance is expected, not evidence of noise.
  # The within-window arm now also requires the majority baseline itself to clear
  # 0.15, so both-near-zero falls through to classify failures rather than
  # terminating. The dirty-data arm is unchanged.
  - node: S1_LABELS_ARE_NOISE
    condition: "(trivial_baseline_score >= baseline_score - 0.05 and trivial_baseline_score <= baseline_score + 0.05 and trivial_baseline_score >= 0.15) or data_quality < 0.6"
    outcome: BLOCKED__FIX_LABELS_OR_TASK
    say: "A majority-class or keyword baseline that beats chance stays within 5 points of the LLM either way, or the data is dirty. The task or the labels are wrong, not the model."

  # THE SECOND DOOR INTO STAGE 8, AND THE HALF OF THE MODALITY FORK THAT WAS
  # MISSING. ORDERING IS LOAD-BEARING IN BOTH DIRECTIONS; see below.
  #
  # S0_MODALITY_FORK decides "LLM spine or classical branch" on modality alone.
  # That is right for tabular, timeseries, image and audio, and it is only
  # HALF right for text. A closed-set text classifier - forty support-ticket
  # categories, a fixed taxonomy, thousands of labelled rows - is a text run, so
  # the fork sends it down the LLM spine, and the spine has no small-encoder
  # answer anywhere on it. Every such user ended at TRAIN__LORA_SFT on a
  # multi-billion-parameter language model, or at BLOCKED__COLLECT_OR_SYNTHESIZE_DATA,
  # when a 100M-parameter encoder fine-tuned in minutes on one consumer GPU - or a
  # SetFit head on a CPU - is the honest answer and is two orders of magnitude
  # cheaper to run forever. That is expensive advice from the one product whose
  # entire claim is that its advice is honest.
  #
  # The three small-encoder nodes for exactly this user were sitting in
  # stage_8_classical with no modality guard, where only tabular runs could reach
  # them - so the product gave SetFit, a sentence-transformer method, to people
  # with eight hundred columns of numbers, and gave nothing to the people it was
  # written for. One fork, two wrong answers. The guards are on those nodes now;
  # this is the door that keeps them reachable by the users they are for.
  #
  # WHY THE DOOR IS HERE AND NOT IN THE FORK. A tabular run has no meaningful
  # LLM baseline, so stage 0 can route it out before stage 1 without losing
  # anything. A text run does: you really can prompt a frontier model to sort
  # tickets, and it might already pass. So this run keeps the whole of stage 1 up
  # to this line - G1 makes it measure that baseline against a trivial one,
  # S1_ALREADY_PASSES ships it if the prompt already meets the bar,
  # S1_QUALITY_PASSES_BUT_CONSTRAINED sends it to the cost branch if that is the
  # real problem, and S1_LABELS_ARE_NOISE catches the classifier whose labels are
  # the defect - and only then forks. Everything reaching this line has a
  # measured baseline that is genuinely short of target.
  #
  # WHY IT IS ABOVE S1_GAP_UNDIAGNOSED, and this is the structural argument
  # rather than a preference: the eight failure buckets below - wrong_facts,
  # wrong_format, wrong_style, wrong_reasoning, too_slow, too_expensive, refuses,
  # inconsistent - are GENERATION failure modes, and S1_ROUTE_BY_FAILURE_MODE
  # routes the whole rest of the diagnosis on which of them wins. A closed-set
  # classifier has one failure mode: the wrong label. Sending that user to bucket
  # twenty failures with an LLM judge asks a question its answer cannot carry
  # information about, and then routes on the answer. Stage 8 is where the
  # problems the LLM spine cannot diagnose are answered; that is what "CLASSICAL
  # AND NON-LLM" means.
  #
  # THE DATA FLOOR IS PART OF THE DOOR, and it is SetFit's own number - about 8
  # labelled examples per class, from the `numbers:` field of
  # S8_TEXT_CLASSIFICATION_FEW_LABELS and its `setfit` citation. Below it there
  # is no small-encoder answer to give, and the honest advice for a user with
  # twelve examples across five classes is few-shot prompting, which is what the
  # spine below already says. So a run under the floor stays on the spine rather
  # than being sent to a branch that would recommend fitting a model on two
  # examples per class. `classes_n` or `labeled_examples_n` unread makes the
  # product null, the comparison false, and the door shut - staying on the spine
  # is the safe direction for an unknown.
  #
  # `not requires_multistep_reasoning` IS NOT DECORATION. Without it this node
  # sends a run to stage 8, S8_CLASSIFICATION_NEEDS_REASONING there reroutes it
  # straight back to stage 1, and stage 1 sends it to stage 8 again - facts are
  # immutable within a run, so it is an infinite loop by construction, capped by
  # the cycle guard. That is the exact shape of the fourth looping route this
  # file already had to fix at S4_FORMAT_FIXED_CONTENT_STILL_WRONG. With the
  # clause, no run that comes through this door can satisfy that node's
  # condition, and the loop cannot be built.
  - node: S1_CLOSED_SET_CLASSIFICATION
    condition: "modality in {text, code} and task_family == classification and labels_are_closed_set and not requires_multistep_reasoning and labeled_examples_n >= 8 * classes_n"
    outcome: REROUTE
    route: stage_8_classical
    say: >
      "Your labels are a fixed list and you have examples of them. That is not a
      language-model problem - it is a classifier, and the classifier that wins
      it is a hundred times smaller than the model you are prompting and costs
      nothing to run."
    evidence: [setfit]

  - node: S1_GAP_UNDIAGNOSED
    condition: "sum(failure_histogram.values()) < 20"
    outcome: ACTION__CLASSIFY_FAILURES
    # A NODE WITH NO `say` MAKES THE CARD APOLOGISE FOR THE ENGINE. The card
    # renders `say`, and with none it printed "The engine returned no note for
    # this outcome. say was empty on the wire, and nothing here writes one" -
    # directly above the perfectly good `action` below. Max, 2026-09-21, read
    # that on a run that had just passed two gates.
    say: "The baseline is measured and it is failing, but nobody has said HOW it fails. Every route below this point forks on that: wrong facts is a different problem from wrong format, and training fixes one of them. Twenty bucketed failures is the smallest number that can carry the fork."
    action: "Bucket at least 20 eval failures into {wrong_facts, wrong_format, wrong_style, wrong_reasoning, too_slow, too_expensive, refuses, inconsistent} with an LLM judge on the user's own key."

  # THE FLOOR ABOVE IS ABSOLUTE AND THIS ONE IS PROPORTIONAL, and run 51 is the
  # case that needs both. Twenty failures bucketed out of twenty is a taxonomy;
  # twenty out of forty-seven is a sample, and the two are indistinguishable to
  # `sum(failure_histogram.values()) < 20`. Run 51 cleared that floor at exactly
  # 20 and routed on the argmax of the FIRST twenty failing rows - a prefix,
  # because `read_eval_results` shows twenty by default and a person buckets what
  # they were shown, so the ledger's minimum and the reader's default are the
  # same number and a run with 47 failures produces 43% coverage by doing the
  # obvious thing.
  #
  # 0.8 is the registered threshold. It is not tuned here: it is the coverage a
  # taxonomy bound is required to have before anything is computed from it, and
  # this node is where the engine stops trusting a bucket count that does not
  # meet it.
  #
  # THE KNOWN LIMIT, stated rather than discovered later. `failures_seen`
  # defaults to 0, and a thread whose histogram was stamped before this fact
  # existed carries no denominator - so `failures_seen > 0` is false, this node
  # does not fire, and the walk routes as it did before. That is deliberate:
  # refusing every historical thread would be a behaviour change dressed as a
  # correction. A run stamped by either instrument from now on carries the
  # denominator and is judged on it.
  - node: S1_CLASSIFICATION_IS_TOO_THIN
    condition: "failures_seen > 0 and sum(failure_histogram.values()) / failures_seen < 0.8"
    outcome: ACTION__CLASSIFY_FAILURES
    say: "Some of the failures are bucketed and most are not, so the bucket that looks dominant is dominant among the rows somebody happened to read. A histogram over a sample nobody chose is not a finding."
    action: "Bucket the rest of the failures before routing on them. The histogram covers only some of the failing rows, and the bucket that looks dominant is dominant among the rows somebody happened to read - `read_eval_results` returns twenty failures unless asked for more, so raise its `failures` argument and bucket the remainder."

  - node: S1_MIXED_FAILURES
    condition: "max(failure_histogram) / sum(failure_histogram) < 0.5"
    outcome: ACTION__SPLIT_THE_TASK
    say: "No single failure mode dominates. Decompose into sub-tasks and diagnose each; one fine-tune cannot fix four different problems."

  # `select: argmax` - the route whose bucket holds the most failures. Ties
  # resolve in the order the routes are written below, so reordering them is a
  # decision and it is visible in a diff.
  #
  # THE `no_match:` HERE IS THE KNOWN GAP THIS FILE ALREADY NAMED, now stated
  # where it happens instead of only in `uninspectable_facts.one_known_gap`.
  # `failure_mode` is not a declared enum, so a histogram can arrive carrying
  # only buckets this fork has no route for. That is a fact-validation job, it is
  # still open, and until it is closed the honest behaviour is to raise rather
  # than to pick a route the user's failures do not support.
  - node: S1_ROUTE_BY_FAILURE_MODE
    condition: always
    fork:
      branch_on: failure_histogram
      select: argmax
      routes:
        wrong_facts:     stage_3_knowledge
        wrong_format:    stage_4_format
        wrong_style:     stage_5_behaviour
        inconsistent:    stage_5_behaviour
        refuses:         stage_5_behaviour
        wrong_reasoning: stage_6_capability
        too_slow:        stage_7_efficiency
        too_expensive:   stage_7_efficiency
      no_match:
        error: "S1_ROUTE_BY_FAILURE_MODE reached with no failure mode it routes for: {keys}"

# ---------------------------------------------------------------------------
# STAGE 3 - KNOWLEDGE GAP. The model does not know things.
stage_3_knowledge:
  - gate_ref: G3_RETRIEVAL_CONSIDERED    # node S3_RETRIEVAL_NOT_CONSIDERED, first in the stage

  - node: S3_REJECT_FINETUNE_FOR_FACTS
    condition: "need_type contains knowledge"
    outcome: null
    effect: "strike LORA_SFT and FULL_FINETUNE from the candidate methods for this failure mode; record in rejected[]"
    reason: "LLMs acquire genuinely new factual knowledge from fine-tuning slowly, and as those examples are finally learned they linearly increase the model's tendency to hallucinate."
    evidence: [gekhman2024]

  # ORDERING IS LOAD-BEARING: above every NO_TRAIN__RAG node in this stage, and
  # all four of them are in this stage.
  #
  # A tabular run CAN reach stage 3 - S8_CLASSIFICATION_NEEDS_REASONING reroutes
  # to stage 1 and stage 1 routes wrong_facts here - and by then
  # S8_TABULAR_REJECT_NEURAL has already STRUCK the outcome NO_TRAIN__RAG. A
  # struck outcome emitted anyway is an engine error, so the four RAG nodes below
  # were a crash waiting for the first tabular user with a knowledge failure
  # mode. This node answers that user instead, and the answer is not a
  # compromise: G3's own note says for tabular the missing-information question
  # is whether the missing signal is a missing feature or a join, which is
  # usually the true answer and is always cheaper than a neural net.
  - node: S3_TABULAR_KNOWLEDGE_GAP
    condition: "modality == tabular"
    outcome: NO_DEEP__FIND_THE_MISSING_FEATURE
    action: "List what the model would have to know that is not in a column. Then go and add it as a feature or a join, and re-fit the tree."
    say: "Retrieval is how you put facts in front of a language model. The tabular equivalent is a column you have not built yet, and it is cheaper than anything else in this file."
    evidence: [grinsztajn2022]

  # ASK NODE for knowledge_volatility. The whole stage turns on it: static goes
  # to continued pretraining or RAG, weekly-and-faster goes to RAG outright, and
  # null went nowhere - the stage ran off the end and raised.
  - node: S3_KNOWLEDGE_VOLATILITY_UNKNOWN
    condition: "knowledge_volatility is null"
    outcome: ACTION__STATE_KNOWLEDGE_VOLATILITY
    asks: "How often do the facts this model needs actually change - never, slowly, weekly, daily, or by the minute?"
    action: "Say how often the facts the model needs actually change: static, slow, weekly, daily or realtime."
    say: >
      "How fast your facts go stale decides this branch on its own. Anything
      weekly or faster cannot live in weights at all; anything static might be
      worth pretraining on. I cannot guess it from your data."

  - node: S3_VOLATILE_KNOWLEDGE
    condition: "knowledge_volatility in {weekly, daily, realtime}"
    outcome: NO_TRAIN__RAG
    say: "Facts that change faster than you can retrain must live in a document store, not in weights."

  - node: S3_NEEDS_PROVENANCE
    condition: "needs_citations or privacy == regulated"
    outcome: NO_TRAIN__RAG
    say: "Citations and auditability require retrieval. Weights cannot show their source."

  - node: S3_CORPUS_FITS_IN_CONTEXT
    condition: "corpus_tokens <= 50000 and calls_per_day <= 200"
    outcome: NO_TRAIN__CONTEXT_STUFFING
    say: "Small enough corpus, low enough volume. Paste it into the prompt with caching and build nothing."
    revisit_if: ["corpus_tokens > 50000", "calls_per_day > 200", "accuracy drops on facts buried mid-context"]
    evidence: [longctx2026]
    note: "Was the G3 gate node. It is a remedy, not a gate: passing it meant only that the corpus was large."

  - node: S3_BUILD_RAG
    condition: "not retrieval_tried"
    outcome: NO_TRAIN__RAG
    say: "Retrieval is roughly three orders of magnitude cheaper per query than stuffing a long window, and long windows lose accuracy on content buried mid-context."
    evidence: [longctx2026]
    exit_criterion: "retriever_recall_at_k >= 0.8 on the eval set AND end-to-end score >= target_score"

  # ASK NODE for retriever_recall_at_k, and it must stay below S3_BUILD_RAG -
  # there is no recall to measure until a retriever exists. Both nodes below
  # read `retriever_recall_at_k < 0.8`, which is false on a null, so an
  # unmeasured retriever silently looked like a working one and the stage fell
  # through to the continued-pretraining pair or off the end entirely.
  - node: S3_RECALL_UNMEASURED
    condition: "retrieval_tried and retriever_recall_at_k is null"
    outcome: ACTION__MEASURE_RETRIEVER_RECALL
    asks: "When your retriever fetches its top few passages, how often is the right one actually among them?"
    action: "Score the retriever alone on the eval set: for each question, is the right passage in the top k. Record it as retriever_recall_at_k, then re-enter."
    say: >
      "You have built retrieval and I cannot tell whether it works. That one
      number decides whether the answer here is 'fix the retriever', 'train the
      retriever' or 'the generator is the problem', and they are three different
      pieces of work."
    exit_criterion: "retriever_recall_at_k recorded; 0.8 is the bar S3_BUILD_RAG already sets"

  # ORDERING IS LOAD-BEARING for the next two nodes, and they are the whole
  # difference between "retrieval is weak, go fix retrieval" and "retrieval is
  # weak, you already fixed everything free, and you have the labelled pairs to
  # train the retriever". The second is the specific case and must be tested
  # first. It used to sit second, and since its condition implied the first
  # node's condition exactly, it was dead: TRAIN__EMBEDDING_FINETUNE could not be
  # reached by any run at all.
  - node: S3_TRAIN_THE_RETRIEVER_NOT_THE_LLM
    condition: "retrieval_tried and retriever_recall_at_k < 0.8 and reranker_tried and query_rewriting_tried and labeled_query_positive_pairs >= 1000"
    propose: EMBEDDING_FINETUNE
    route: stage_9_method_selector
    method:
      base: "bge / e5 / gte, small or base size"
      data: "1k-10k (query, positive, hard-negative) triplets"
      loss: MultipleNegativesRankingLoss
      vram_gb: 8
    say: "Train the 100M-parameter retriever, not the 8B-parameter generator. Hours, not days."
    why_query_rewriting_is_in_the_condition: >
      The free fixes below - reranking and query rewriting - are the ones
      S3_RETRIEVAL_IS_THE_BOTTLENECK sends people to do. A proposal to train the
      retriever is only honest once they are done, and G2's retriever_weights row
      asks for exactly this list, so requiring it here means the node's own
      condition and the gate it must pass are asking the same question rather than
      two different ones. It does NOT mean the gate is redundant: G2 and G3 are
      still evaluated at the sweep under the retriever_weights rows, and if a
      future edit loosens this condition the gates still catch it. That
      independence is the point of Finding 3's fix.

  - node: S3_RETRIEVAL_IS_THE_BOTTLENECK
    condition: "retrieval_tried and retriever_recall_at_k < 0.8 and not (reranker_tried and query_rewriting_tried and labeled_query_positive_pairs >= 1000)"
    outcome: NO_TRAIN__FIX_RETRIEVAL
    action: "Chunking strategy, hybrid BM25 + dense, a cross-encoder reranker, query rewriting. Fix the retriever before touching the generator."
    say: "The generator is not your problem. Something cheaper than any training run is."

  - node: S3_DOMAIN_DIALECT_GAP
    condition: "knowledge_volatility == static and unlabeled_domain_tokens >= 100000000 and retrieval_tried and baseline_score < target_score"
    propose: CONTINUED_PRETRAINING
    route: stage_9_method_selector
    reason: "Retrieval cannot help when the model does not speak the domain's vocabulary at all - a low-resource language, an internal DSL, a specialist corpus."
    thresholds:
      minimum_tokens: 100000000
      comfortable_tokens: 1000000000
      method: "full fine-tune, not LoRA - at continued-pretraining scale (20B tokens) LoRA substantially underperforms full fine-tuning"
    evidence: [biderman2024, cpt_cyber2025, cpt_small2025]
    revisit_if: ["unlabeled_domain_tokens < 100M -> fall back to RAG plus LoRA SFT"]

  - node: S3_NOT_ENOUGH_DOMAIN_TEXT
    condition: "knowledge_volatility == static and unlabeled_domain_tokens < 100000000"
    outcome: NO_TRAIN__RAG
    say: "Under roughly 100M domain tokens, continued pretraining buys less than a good retriever and costs far more."

  # THE LAST NODE OF STAGE 3, and it cannot fail to fire for anything that gets
  # here. Every run reaching this line has retrieval_tried true - S3_BUILD_RAG
  # above is `not retrieval_tried` and is terminal - so `retrieval_tried` is the
  # honest predicate for "everything above already ruled itself out", written as
  # a real condition rather than `always`.
  #
  # Who lands here: retrieval is built, recall is measured and at or above 0.8,
  # the facts are not volatile, citations are not required, the corpus does not
  # fit in a window, and there is no 100M-token domain corpus to pretrain on.
  # The retriever is doing its job and the model is still getting facts wrong,
  # so the failure was bucketed as wrong_facts and it is not a knowledge
  # problem. Before this node the stage ran off the end and raised.
  - node: S3_KNOWLEDGE_GAP_IS_NOT_RETRIEVAL
    condition: "retrieval_tried"
    outcome: ACTION__RE_BUCKET_THE_FAILURES
    action: "Re-read 20 of the failures with the retrieved passages in front of you. If the right passage was retrieved and the answer was still wrong, the bucket is wrong_reasoning or wrong_style, not wrong_facts. Re-enter with the corrected histogram."
    say: >
      "Retrieval is built and it is finding the right passages. Whatever is going
      wrong is happening after the facts arrive, so no amount of work on the
      knowledge branch will move it. The failures are in the wrong bucket."

# ---------------------------------------------------------------------------
# STAGE 4 - FORMAT. The content is right, the shape is wrong.
stage_4_format:
  - node: S4_CONSTRAINED_DECODING
    condition: "not constrained_decoding_tried"
    outcome: NO_TRAIN__CONSTRAINED_DECODING
    action: "JSON schema / structured outputs / GBNF grammar. Format compliance becomes 100% by construction."
    say: "Never fine-tune for a format a grammar can enforce."

  # ASK NODE for schema_compliance and schema_expressible. Every remaining node
  # in this stage reads one of them, and a null in either made all of them
  # false, so the stage ran off the end and raised at exactly the users who had
  # already done the work.
  - node: S4_FORMAT_UNMEASURED
    condition: "constrained_decoding_tried and (schema_compliance is null or schema_expressible is null)"
    outcome: ACTION__MEASURE_THE_FORMAT
    asks: "With the grammar on, what fraction of outputs come back in the right shape - and could a schema describe that shape at all?"
    action: "Two numbers. Run the eval set with the grammar on and record the fraction of outputs that parse against the schema. Then say whether a JSON schema or a grammar can express the target shape at all, or whether it is a bespoke layout."
    say: >
      "The decoder is on and I cannot tell what it achieved. Whether the shape is
      solved and whether a grammar could ever express it are different questions
      with different answers, and I need both before I can say anything useful."

  # A FOURTH LOOPING ROUTE, of the same family as the three the gates had, and it
  # predates them. This node used to carry `outcome: REROUTE, route:
  # stage_1_baseline` - "the shape is solved, re-diagnose" - and that reroute
  # could never make progress. Facts are immutable for the duration of one
  # diagnose() call, S1_ROUTE_BY_FAILURE_MODE routes on the largest bucket of
  # failure_histogram, and stage 4 is only ever entered because wrong_format IS
  # the largest bucket. So stage 1 sent the run straight back to stage 4, which
  # sent it straight back to stage 1, until the cycle guard raised on the third
  # entry. Reproduced at commit HEAD before this pass; it is not new.
  #
  # The reroute was right about the diagnosis and wrong about who can act on it.
  # The histogram is stale - those failures are no longer format failures,
  # because the format is fixed - and only the user can re-bucket them. So this
  # says so and stops, which is the same answer S3_KNOWLEDGE_GAP_IS_NOT_RETRIEVAL
  # gives to the identical shape one stage over.
  - node: S4_FORMAT_FIXED_CONTENT_STILL_WRONG
    condition: "constrained_decoding_tried and schema_compliance >= 0.99 and baseline_score < target_score"
    outcome: ACTION__RE_BUCKET_THE_FAILURES
    action: "Re-read 20 of the remaining failures. The output parses against the schema now, so none of them is a format failure - sort them into wrong_facts, wrong_style or wrong_reasoning and re-enter with the corrected histogram."
    say: >
      "The shape is solved: 99% of outputs match the schema. Whatever is still
      wrong is content, and it is filed under the wrong heading - which is why
      re-running the diagnosis unchanged would send you straight back here."

  # NO "THE FORMAT IS SOLVED AND QUALITY PASSES" NODE HERE, AND THE REASON IS
  # WORTH WRITING DOWN, because one was added during this pass and removed again
  # when it turned out to be dead on arrival - the exact defect this pass exists
  # to fix, committed while fixing it.
  #
  # Stage 4 is only ever ENTERED with baseline_score < target_score. Its single
  # door is S1_ROUTE_BY_FAILURE_MODE on wrong_format, and reaching that router
  # means S1_ALREADY_PASSES and S1_QUALITY_PASSES_BUT_CONSTRAINED both declined,
  # which means quality is short. So S4_FORMAT_FIXED_CONTENT_STILL_WRONG above
  # covers the WHOLE `schema_compliance >= 0.99` half of this stage, and a node
  # for the other half of that clause would have no fact set at all.
  # If a second door into this stage is ever added, that stops being true and
  # this stage needs the node after all. Check this comment before adding one.

  - node: S4_IDIOSYNCRATIC_FORMAT
    condition: "constrained_decoding_tried and schema_expressible == false and labeled_examples_n >= 50"
    propose: LORA_SFT
    route: stage_9_method_selector
    profile: format_lock
    thresholds: {min_examples: 50, comfortable: 200, rank: "8-16", epochs: "2-4"}
    evidence: [openai_sft]
    say: "A bespoke layout a grammar cannot express is the cheapest legitimate fine-tune there is."
    note: >
      This node used to emit TRAIN__LORA_SFT directly from stage 4, which skipped
      G2 and G4 entirely - a fine-tune recommended without few-shot ever being tried
      and without anyone checking whether a model that already emits this shape
      exists. It now proposes and the sweep asks both questions.

  # ORDERING IS LOAD-BEARING: directly below S4_IDIOSYNCRATIC_FORMAT and it is
  # the negation of that node's example count, written as `not (>= 50)` rather
  # than `< 50` so a null count lands here instead of nowhere. Same user, same
  # bespoke layout, one thing missing.
  - node: S4_FORMAT_LOCK_NEEDS_EXAMPLES
    condition: "constrained_decoding_tried and schema_expressible == false and not (labeled_examples_n >= 50)"
    outcome: BLOCKED__COLLECT_OR_SYNTHESIZE_DATA
    say: "A grammar cannot express your layout, so a small format-lock LoRA is the honest answer - and it needs 50 examples of the layout before it is worth starting."
    numbers: "The practical floor for demonstrations is 10 examples; the recommended starting point is 50 well-crafted ones."
    evidence: [openai_sft]

  # THE LAST NODE OF STAGE 4, and it cannot fail to fire. S4_FORMAT_UNMEASURED
  # above means schema_expressible is not null here, and the two nodes above
  # this one take the whole `== false` half, so everything left is
  # schema_expressible true - and, from S4_FORMAT_IS_SOLVED, compliance under
  # 0.99. A grammar CAN express the shape and the outputs still do not match it,
  # which is not a training problem at all: the constraint is not actually being
  # applied. Before this node that user fell off the end and got a stack trace.
  - node: S4_CONSTRAINT_NOT_HOLDING
    condition: "constrained_decoding_tried and schema_expressible"
    outcome: ACTION__FIX_THE_DECODER
    action: "Check the constraint is on the call you are actually measuring, that the schema is the one you think it is, and that nothing downstream is re-serialising the output. Then re-measure schema_compliance."
    say: >
      "A schema can express this shape, structured outputs are switched on, and
      compliance is still under 99%. That is a wiring fault, not a model fault,
      and fine-tuning would be paying a GPU to work around a config file."

# ---------------------------------------------------------------------------
# STAGE 5 - BEHAVIOUR, STYLE, TONE.
stage_5_behaviour:
  - gate_ref: G2_PROMPT_EXHAUSTED     # node S5_PROMPT_NOT_EXHAUSTED

  - node: S5_BETTER_PROMPT
    condition: "prompt_iterations < 3"
    outcome: NO_TRAIN__BETTER_PROMPT
    action: "Rewrite the system prompt against the failure buckets. Name the rule that was broken, explicitly."

  - node: S5_FEWSHOT_UNTRIED
    condition: "not fewshot_tried"
    outcome: NO_TRAIN__FEW_SHOT
    action: "Put 5-20 exemplars in the prompt, chosen from the eval failures, not from the successes."
    note: "If 5-20 exemplars in the prompt move nothing, 500 in a fine-tune usually will not either. This is the cheapest available predictor of whether SFT will work."

  - node: S5_PROMPT_OPTIMIZER_UNTRIED
    condition: "not prompt_optimizer_tried and eval_size_n >= 50 and metric_is_programmatic"
    outcome: NO_TRAIN__PROMPT_OPTIMIZER
    action: "Run GEPA or MIPROv2 (DSPy) over the eval set."
    reason: "Reflective prompt evolution outperformed GRPO reinforcement learning by up to 20% while using up to 35x fewer rollouts, and beat MIPROv2 on every benchmark tested."
    evidence: [gepa2025]
    say: "The strongest do-not-train argument available in 2025-26. It must be tried before any SFT branch."

  # THE OTHER TWO THIRDS OF THE G2 llm_weights ROW'S THIRD CLAUSE.
  #
  # That clause is `(prompt_optimizer_tried or not metric_is_programmatic or
  # eval_size_n < 50)`, so the gate excuses a missing prompt optimiser in two
  # cases: the metric cannot be computed without a human, or the eval set is too
  # small for the optimiser to resolve anything. S5_PROMPT_OPTIMIZER_UNTRIED
  # above covers only the case where neither excuse applies. Both excused users
  # then fell past S5_DEMONSTRATIONS_AVAILABLE - which requires
  # prompt_optimizer_tried - and off the end of the stage.
  #
  # An excuse is not an answer. Each of these two says what to go and fix so the
  # cheapest remaining no-train lever becomes available at all.
  - node: S5_EVAL_TOO_SMALL_FOR_THE_OPTIMIZER
    condition: "not prompt_optimizer_tried and eval_size_n < 50"
    outcome: ACTION__GROW_THE_EVAL_SET
    action: "Take the eval set to at least 50 examples, sampled from real traffic and graded by the person who cares about the answer."
    numbers: "n=30 only resolves differences larger than ~15 points. n>=100 to trust a 5-10 point delta."
    say: >
      "A prompt optimiser searches by scoring candidates against your eval set,
      and your eval set is too small to tell two candidates apart. Growing it is
      hours of work and it unlocks the strongest do-not-train lever there is."

  - node: S5_METRIC_NOT_PROGRAMMATIC
    condition: "not prompt_optimizer_tried and not metric_is_programmatic"
    outcome: ACTION__MAKE_THE_METRIC_PROGRAMMATIC
    action: "Write the score as code, or as an LLM judge on your own key with a rubric and a human-verified sample. Either one turns 'better' into something a search can optimise."
    say: >
      "Nothing can search for a better prompt while only a person can say whether
      an output is good. Make the score computable and GEPA or MIPROv2 becomes
      available; leave it uncomputable and a fine-tune has nothing to aim at
      either."
    evidence: [gepa2025]

  - node: S5_DEMONSTRATIONS_AVAILABLE
    condition: "prompt_optimizer_tried and baseline_score < target_score and labeled_examples_n >= 100"
    propose: LORA_SFT
    route: stage_9_method_selector
    profile: behaviour
    thresholds:
      classification_per_class: "100-300"
      structured_extraction: "200-500"
      content_generation: "500-2000"
      complex_domain: "1000-5000"
    evidence: [openai_sft, particula2026]

  - node: S5_PREFERENCES_NOT_DEMONSTRATIONS
    condition: "preference_pairs_n >= 1000 and user_can_rank_but_not_write"
    propose: DPO
    route: stage_9_method_selector
    prerequisite: LORA_SFT
    say: "When the user can say which of two outputs is better but cannot write the ideal one, collect pairs and run preference optimization after an SFT pass."

  - node: S5_VERIFIABLE_REWARD
    condition: "reward_is_programmatic and task_is_multistep and prompt_optimizer_tried"
    propose: RL_GRPO
    route: stage_9_method_selector
    note: "LoRA matches full fine-tuning for RL even at rank 1, because policy gradient absorbs roughly one bit of information per episode. Do not provision full-fine-tune hardware for an RL run."
    evidence: [tml_lora]

  # NO "QUALITY ALREADY PASSES" NODE HERE EITHER, for the same reason as stage 4,
  # and one was added and removed here too. Both doors into stage 5 arrive with
  # baseline_score < target_score: S1_ROUTE_BY_FAILURE_MODE only runs once
  # S1_ALREADY_PASSES and S1_QUALITY_PASSES_BUT_CONSTRAINED have both declined,
  # and G2's on_fail sends only llm_weights proposals here - every one of which
  # was made in a stage that itself required quality to be short. The
  # llm_efficiency proposal, which is the one that DOES arrive with quality
  # passing, is routed to stage 7 by route_by_class, not here.
  # If G2's route_by_class ever sends another class to this stage, re-check this.

  # THE LAST NODE OF STAGE 5, and it cannot fail to fire. Everything above it
  # has either terminated or requires a count this negation covers:
  # S5_DEMONSTRATIONS_AVAILABLE needs 100 demonstrations, and `not (>= 100)`
  # catches both a smaller number and a count nobody could read. Written as the
  # negation rather than `< 100` for exactly that second case.
  - node: S5_NOT_ENOUGH_DEMONSTRATIONS
    condition: "not (labeled_examples_n >= 100)"
    outcome: BLOCKED__COLLECT_OR_SYNTHESIZE_DATA
    say: >
      "The prompt work is genuinely exhausted and the score is still short, so a
      behaviour fine-tune is the honest next rung - and it needs written
      demonstrations you do not have yet. This is a data problem now, not a
      method problem."
    thresholds:
      classification_per_class: "100-300"
      structured_extraction: "200-500"
      content_generation: "500-2000"
      complex_domain: "1000-5000"
    recipe: "Synthesize from the real input distribution with a teacher model, then have a human verify a 10% sample before training on any of it."
    evidence: [openai_sft, particula2026]

# ---------------------------------------------------------------------------
# STAGE 6 - CAPABILITY. The model cannot do the task at all.
stage_6_capability:
  - gate_ref: G4_CHEAPER_MODEL_CONSIDERED    # node S6_MODEL_SWAP_UNTRIED

  - node: S6_SWAP_THE_MODEL
    condition: "not model_swap_tried"
    outcome: NO_TRAIN__SWAP_MODEL
    action: "Try a larger model, a reasoning model, and a Hugging Face search for an existing fine-tune of exactly this task - NER, ASR, OCR, reranking, sentiment."
    say: "Someone has usually already trained this. Search before you train."

  - node: S6_DECOMPOSABLE
    condition: "task_is_multistep and not agent_scaffold_tried"
    outcome: NO_TRAIN__AGENT_SCAFFOLD
    action: "Tools, a plan-execute-check loop, self-verification. Capability often comes from scaffolding, not from weights."

  # ORDERING IS LOAD-BEARING: directly below S6_DECOMPOSABLE, which is the
  # specific case, and this is the general one carrying the negation. Both
  # nodes below require agent_scaffold_tried, so a user who had not tried a
  # scaffold AND whose task was single-step - or whose task_is_multistep nobody
  # could derive - matched nothing and the stage ran off the end.
  - node: S6_SCAFFOLD_UNTRIED
    condition: "not agent_scaffold_tried"
    outcome: NO_TRAIN__AGENT_SCAFFOLD
    action: "Give it a tool for the part it gets wrong, and make it check its own answer before returning. Both are cheaper than any training run and neither needs a GPU."
    say: >
      "There may be nothing here to decompose, but scaffolding is not only
      decomposition - a retrieval tool, a calculator, a validator, a second pass
      over its own output. It is the last free rung on the ladder and it has not
      been tried."

  - node: S6_GENUINELY_ABSENT
    condition: "model_swap_tried and agent_scaffold_tried and labeled_examples_n >= 1000"
    outcome: REROUTE
    propose: UNSET          # stage 9 picks the method from the size table
    route: stage_9_method_selector

  # THE LAST NODE OF STAGE 6, and it cannot fail to fire: the negation of
  # S6_GENUINELY_ABSENT's example count, written `not (>= 1000)` rather than
  # `< 1000` so a count nobody could read lands here instead of nowhere. That
  # one-word difference was a stage that ran off the end and raised.
  - node: S6_ABSENT_AND_NO_DATA
    condition: "not (labeled_examples_n >= 1000)"
    outcome: BLOCKED__COLLECT_OR_SYNTHESIZE_DATA
    say: "A capability the model does not have and a scaffold could not supply is the one case that genuinely needs weights - and teaching a new capability needs about a thousand examples, not fifty."

# ---------------------------------------------------------------------------
# STAGE 7 - EFFICIENCY. Quality is fine; cost, latency or privacy is not.
#
# HOW YOU GET HERE, because until this pass you could not. Two ways:
#   - S1_QUALITY_PASSES_BUT_CONSTRAINED, the main door: quality already meets the
#     bar and need_type carries cost, latency or privacy.
#   - S1_ROUTE_BY_FAILURE_MODE on too_slow or too_expensive, which reaches here
#     with quality still BELOW target - handled by the first node below.
# Every node after S7_QUALITY_ALSO_FAILING may assume baseline_score >=
# target_score. That is what the stage header means and now it is enforced rather
# than assumed.
stage_7_efficiency:
  # ORDERING IS LOAD-BEARING: first, because quantising or distilling a model that
  # does not yet meet the bar makes a failing system faster at failing.
  - node: S7_QUALITY_ALSO_FAILING
    condition: "baseline_score < target_score"
    outcome: ACTION__FIX_QUALITY_FIRST
    action: "Re-enter the tree with cost and latency set aside and the quality gap as the stated goal. Come back here when the model passes."
    say: >
      "Speed is the failure you named, but the model does not meet your quality bar
      either. Every answer in this stage either trades quality for speed or copies a
      model that already passes - and you do not have one to copy yet. Fix quality
      first."

  - node: S7_QUANTIZE
    condition: "deployment in {local_gpu, local_cpu, edge} and current_precision in {fp16, bf16}"
    outcome: NO_TRAIN__QUANTIZE
    say: "The weights are still fp16 or bf16 and this runs on your own hardware, so the cheapest win is precision, not training. Quantising is hours, is reversible, and touches nothing about what the model knows - measure it against the same eval set before you spend a day on a fine-tune."
    recommendation:
      default: Q4_K_M
      if_no_quality_tolerance_and_task_is_math_or_code: "Q5_K_M or Q6_K"
      cpu_or_edge: Q4_K_M
    numbers: "Q4_K_M costs roughly 1-2% perplexity degradation for about 4x memory saving and 3.5-3.8x speedup versus FP16. Math and code benchmarks are the sensitive ones."
    evidence: [quant2026]

  - node: S7_CACHE_AND_ROUTE
    condition: "calls_per_day > 1000 and not caching_enabled"
    outcome: NO_TRAIN__CACHE_AND_ROUTE
    action: "Prompt caching, a semantic cache, and a small-model-first router that escalates only on low confidence."

  # ===========================================================================
  # THE TWO NODES THAT ANSWER G2's llm_efficiency ROW. Modelled on stage 5.
  #
  # G2's llm_efficiency row is `quantization_tried and caching_enabled`, and the
  # only proposal of that class is DISTILLATION, made by S7_DISTILL directly
  # below. So when the sweep failed that row it routed back here - and nothing
  # in this stage asked the question the row asks. S7_QUANTIZE only fires for a
  # local deployment already running at fp16 or bf16; S7_CACHE_AND_ROUTE only
  # fires above a thousand calls a day. A cost-pressured user on a hosted API
  # who had caching on and had never tried quantisation matched neither,
  # S7_DISTILL proposed again, the same gate failed again, and the walk cycled
  # until the guard raised. The user the gate exists for - someone about to
  # train a student model without having tried the free 4x memory saving - got a
  # Python exception.
  #
  # These two are the negation of that row, one clause each, the way
  # S5_BETTER_PROMPT, S5_FEWSHOT_UNTRIED and S5_PROMPT_OPTIMIZER_UNTRIED are the
  # negation of the llm_weights row. Their disjunction is exactly
  # `not (quantization_tried and caching_enabled)`, so a failing run always
  # lands on one of them.
  #
  # ORDERING IS LOAD-BEARING, both above and below.
  # ABOVE S7_DISTILL: a remedy below the node that proposes is a remedy no run
  # ever reaches, because the proposer fires first and routes out. This is the
  # whole shape of the fix.
  # BELOW S7_QUANTIZE AND S7_CACHE_AND_ROUTE: those two carry the concrete
  # recipes for the cases they describe and must keep them.
  # THE GUARD IS S7_DISTILL's OWN CONDITION, minus the negated clause. Without
  # it these would answer "go and quantise" to every stage-7 user whose pressure
  # is below the distillation line - whose real answer is S7_PRESSURE_BELOW_THE_LINE,
  # ship as is - and to every user with a restrictive teacher licence, whose real
  # answer is S7_DISTILL_BLOCKED_BY_LICENCE. Repeating the guard is the same
  # device S7_DISTILL_BLOCKED_BY_LICENCE already uses, for the same reason.
  #
  # These outcomes do not weaken TRAIN__DISTILLATION's reachability. A minting
  # distillation run must pass G2 under llm_efficiency, so it has
  # quantization_tried and caching_enabled both true, and both conditions below
  # are false for it.
  - node: S7_QUANTIZATION_UNTRIED
    condition: "baseline_score >= target_score and (calls_per_day >= 10000 or latency_budget_ms < 500 or privacy in {on_prem_only, regulated}) and teacher_license_permits_distillation and not quantization_tried"
    outcome: NO_TRAIN__QUANTIZE
    action: "Quantise the model that already passes and re-measure it on the eval set. If it still passes, you are done - and if it does not, you now know what the quality budget actually is before you spend a GPU on a student."
    numbers: "Q4_K_M costs roughly 1-2% perplexity degradation for about 4x memory saving and 3.5-3.8x speedup versus FP16. Math and code benchmarks are the sensitive ones."
    evidence: [quant2026]
    say: >
      "You are about to train a smaller model to cut cost or latency. There is a
      free version of that and it takes an afternoon: quantise the one you have.
      Roughly 4x the memory back and 3.5x the speed, for 1-2% perplexity. Do that
      first and re-measure - distillation is only honest once it has failed."
    answers_gate_row: "G2_PROMPT_EXHAUSTED / llm_efficiency, the `quantization_tried` half"

  - node: S7_CACHING_UNTRIED
    condition: "baseline_score >= target_score and (calls_per_day >= 10000 or latency_budget_ms < 500 or privacy in {on_prem_only, regulated}) and teacher_license_permits_distillation and not caching_enabled"
    outcome: NO_TRAIN__CACHE_AND_ROUTE
    action: "Prompt caching, a semantic cache, and a small-model-first router that escalates only on low confidence. Then re-measure cost per call and latency at the tail."
    say: >
      "Caching is off. Every repeated prefix and every repeated question is being
      paid for twice, and a router sends the easy majority to a smaller model for
      nothing. Training a student to save money you are currently throwing away
      is the expensive way round."
    answers_gate_row: "G2_PROMPT_EXHAUSTED / llm_efficiency, the `caching_enabled` half"
    note: >
      S7_CACHE_AND_ROUTE above carries the same remedy for the high-volume case.
      This one exists for the rest of the row: a low-volume service with a hard
      latency budget, or an on-prem one, where caching is just as free and the
      thousand-calls-a-day threshold never fires.

  - node: S7_DISTILL
    condition: "baseline_score >= target_score and (calls_per_day >= 10000 or latency_budget_ms < 500 or privacy in {on_prem_only, regulated}) and teacher_license_permits_distillation"
    propose: DISTILLATION
    route: stage_9_method_selector
    method:
      teacher: "the model that already passes the eval"
      data: "10k-100k teacher outputs over the REAL input distribution, sampled from logs; hold out a human-verified slice"
      student: "1B-8B open weight, trained with LoRA SFT"
      note: "Synthetic teacher data can lift a student to match or exceed the teacher's zero-shot accuracy on the target task."
    evidence: [distill2024]
    exit_criterion: "student within quality_loss_tolerance of the teacher on the eval set, at the required latency"
    reachability: >
      This node was unreachable until this pass. Its first clause,
      baseline_score >= target_score, is exactly S1_ALREADY_PASSES's old condition,
      and S1_ALREADY_PASSES was terminal and sat above the only router into this
      stage. So no run ever arrived here with quality passing, and this node's
      condition could never be true. The five-gate property held on it vacuously,
      which is the worst way for a property to hold. Fixed at
      S1_QUALITY_PASSES_BUT_CONSTRAINED.

  # ORDERING IS LOAD-BEARING: this sits BELOW S7_DISTILL and repeats S7_DISTILL's
  # pressure clause. Above it, or without the clause, it would answer
  # BLOCKED__LICENCE to every stage-7 user with a restrictive teacher licence -
  # including ones whose volume and latency mean they were never going to distil
  # anything and whose real answer is the one two nodes down.
  - node: S7_DISTILL_BLOCKED_BY_LICENCE
    condition: "(calls_per_day >= 10000 or latency_budget_ms < 500 or privacy in {on_prem_only, regulated}) and not teacher_license_permits_distillation"
    outcome: BLOCKED__LICENCE
    say: "Distilling is the remaining answer to your cost or latency problem, and it means generating training data from the teacher. Check the teacher model's terms first. This is a legal gate, not a technical one."

  # ORDERING IS LOAD-BEARING: last. This is the stage's catch-all and without it
  # a run whose quality passes but whose pressure is below every threshold above
  # falls off the end of the stage with no outcome at all.
  - node: S7_PRESSURE_BELOW_THE_LINE
    condition: "baseline_score >= target_score"
    outcome: NO_TRAIN__SHIP_AS_IS
    say: >
      "Quality passes, and the cost and latency pressure is not yet at the point
      where training a smaller student pays for itself. Ship what you have."
    revisit_if: ["calls_per_day crosses 10000", "latency_budget_ms drops below 500", "privacy becomes on_prem_only or regulated"]

# ---------------------------------------------------------------------------
# STAGE 8 - CLASSICAL AND NON-LLM. TWO DOORS, NOT ONE.
#
#   S0_MODALITY_FORK             tabular and timeseries, before anything else.
#   S1_CLOSED_SET_CLASSIFICATION text and code whose labels are a fixed list and
#                                whose baseline has been measured and is short.
#
# The second door is new and the reasoning for it is written at the node. The
# short version: the fork decides "LLM spine or classical branch" on modality
# alone, and for text that is only half right - a closed-set text classifier
# belongs on this branch too, but unlike a tabular run it has a real LLM
# baseline, so it has to be measured before the fork rather than instead of it.
#
# EVERY NODE HERE THAT NAMES A METHOD CARRIES A MODALITY GUARD. That is a rule
# now, not an accident of there having been one door: a node that names LightGBM
# or SetFit or Whisper is an answer for one kind of data, and an unguarded one is
# reachable by users it was not written for the moment a second door opens. The
# two nodes with no modality guard recommend no method and are safe for a
# different reason each, written at the node: S8_CLASSIFICATION_NEEDS_REASONING
# reroutes, and its sentence is true on either branch, so guarding it would kill
# the only route a tabular run has to the LLM spine;
# S8_TEXT_CLASSIFICATION_NEEDS_LABELS is the stage terminator and no tabular or
# timeseries run can reach it, because S8_TABULAR_UNMATCHED and S8_TIMESERIES
# above are terminal for all of them.
stage_8_classical:
  - node: S8_TABULAR_REJECT_NEURAL
    condition: "modality == tabular"
    effect: "strike LORA_SFT, FULL_FINETUNE and NO_TRAIN__RAG outcomes; record in rejected[]"
    reason: "Tree-based models still outperform deep learning on tabular data; neural nets produce over-smooth solutions that miss the irregular patterns tabular data contains, and GBDTs train and infer faster with no GPU and are easier to tune and to interpret."
    evidence: [grinsztajn2022]

  # ASK NODE for tabular_rows, and it must stay above every node below that
  # reads it - which is all of them. tabular_rows is `source: inspect` with no
  # default, so a dataset the harness could not open resolved to null, every
  # `tabular_rows` comparison went false, and the entire tabular block matched
  # nothing. That single fact was the dominant cause of the crash rate: one
  # unreadable file and a product whose whole pitch is an honest answer answered
  # with a stack trace.
  - node: S8_TABULAR_ROWS_UNKNOWN
    condition: "modality == tabular and tabular_rows is null"
    outcome: ACTION__COUNT_THE_ROWS
    asks: "How many rows does your table have?"
    action: "Point the harness at the table, or just tell it the row count."
    say: >
      "I could not read how many rows your table has - the fact tabular_rows,
      the row count of the training table itself, which is not the eval set's
      eval_size_n - and that one number decides this whole branch: under 1,000
      the honest answer is statistics and
      more data, 1,000 to 10,000 is a tabular foundation model, above that a
      gradient-boosted tree, and only past 1,000,000 does a neural net become
      arguable at all. Tell me the number and I will answer."

  - node: S8_TABULAR_TINY
    condition: "modality == tabular and tabular_rows < 1000"
    outcome: NO_ML__STATISTICS_OR_MORE_DATA
    say: "Under 1,000 rows, fit a regularized linear or logistic model, report a confidence interval, and be honest that generalization claims are not supportable. Or collect more data."

  # ===========================================================================
  # THE TWO NODES THAT ANSWER G2's AND G3's classical_deep ROWS. Modelled on
  # stage 5, and they sit directly above the node whose proposal they answer for
  # exactly the reason stage 5's do: a remedy below the proposer is a remedy no
  # run reaches, because the proposer fires first and routes out of the stage.
  #
  # G2/classical_deep is `hparam_search_trials >= 50`; G3/classical_deep is
  # `feature_work_considered`. TABULAR_DEEP is the only proposal of that class
  # and S8_TABULAR_DEEP_JUSTIFIED below is the only node that makes it. When
  # either row failed at the sweep it routed back into this stage, nothing here
  # asked either question, S8_TABULAR_DEEP_JUSTIFIED proposed again, the same
  # gate failed again and the walk cycled until the guard raised. The user that
  # hit: someone with two million rows who never ran a hyperparameter search,
  # about to be told to train a neural net. They got a Python exception instead
  # of the cheapest answer in the stage.
  #
  # THE GUARD IS S8_TABULAR_DEEP_JUSTIFIED's OWN CONDITION, plus the negated
  # gate clause. That guard is not optional and it is the difference between
  # these nodes and a disaster: unguarded, "you have not run a hyperparameter
  # search" would fire for every tabular user in the file and bury
  # NO_DEEP__TABPFN and NO_DEEP__GRADIENT_BOOSTED_TREES, whose own method block
  # already prescribes the 50-trial search as part of the answer. These two
  # speak only to the run that is about to propose a neural net.
  #
  # The 50 is G2's own number and the 50-trial search is already prescribed by
  # S8_TABULAR_STANDARD.method.tuning. Nothing new is asserted here.
  #
  # THESE DO NOT WEAKEN TRAIN__TABULAR_DEEP. A minting run must pass G2 and G3
  # under classical_deep, so it has hparam_search_trials >= 50 and
  # feature_work_considered true, and both conditions below are false for it.
  # What changes is that the user who would have failed those gates is told so
  # here, one stage earlier, instead of after a round trip to the sweep.
  - node: S8_TABULAR_DEEP_NEEDS_HPARAM_SEARCH
    condition: "modality == tabular and tabular_rows > 1000000 and (has_high_cardinality_sequence or needs_multimodal_fusion) and hparam_search_trials < 50"
    outcome: NO_DEEP__TUNE_THE_TREES_FIRST
    method: {libs: [LightGBM, XGBoost, CatBoost], tuning: "50-trial random or optuna search", hardware: "CPU is sufficient"}
    action: "Run a 50-trial random or optuna search over a gradient-boosted tree on this data and score it on the eval set. Then come back with the number."
    say: >
      "You have the row count and the sequence feature that make a neural net
      arguable, and nobody has tuned the cheap model yet. An untuned tree is not
      a baseline a neural net can beat - it is a tree nobody tuned. Fifty trials
      on a CPU, then we compare."
    exit_criterion: "50 trials completed and the best GBDT scored on the eval set; a neural net is only on the table if that score is still short of target_score"
    evidence: [grinsztajn2022]
    answers_gate_row: "G2_PROMPT_EXHAUSTED / classical_deep"

  - node: S8_TABULAR_DEEP_NEEDS_FEATURE_WORK
    condition: "modality == tabular and tabular_rows > 1000000 and (has_high_cardinality_sequence or needs_multimodal_fusion) and hparam_search_trials >= 50 and not feature_work_considered"
    outcome: NO_DEEP__FIND_THE_MISSING_FEATURE
    action: "Write down what the model would need to know that is not in a column today - a join to another table, an aggregate over the sequence, a ratio, a lag. Build the two or three most obvious ones and re-fit the tuned tree."
    say: >
      "The tree is tuned and still short, and nobody has looked for the missing
      column yet. On tabular data that is nearly always where the signal is, and
      a join costs an afternoon against a neural net's week. If the feature work
      genuinely has nothing left to give, say so and the deep branch reopens."
    exit_criterion: "the candidate features are built and the tuned tree re-scored on the eval set"
    evidence: [grinsztajn2022]
    answers_gate_row: "G3_RETRIEVAL_CONSIDERED / classical_deep"

  # ORDERING IS LOAD-BEARING FOR THE WHOLE TABULAR BLOCK, and it was wrong.
  # S8_TABULAR_STANDARD - "tabular_rows > 10000", terminal - used to sit third,
  # above both S8_TABULAR_WITH_TEXT and S8_TABULAR_DEEP_JUSTIFIED, whose
  # conditions it implies. Both were dead, and TRAIN__TABULAR_DEEP with them. The
  # gradient-boosted-tree answer is the default for tabular, and a default belongs
  # LAST: it is what you get when nothing more specific describes you, not a
  # filter everything else has to squeeze past. Order below is most specific
  # first, and the general nodes carry the negations that make the ordering
  # visible rather than implicit.
  - node: S8_TABULAR_DEEP_JUSTIFIED
    condition: "modality == tabular and tabular_rows > 1000000 and (has_high_cardinality_sequence or needs_multimodal_fusion)"
    propose: TABULAR_DEEP
    route: stage_9_method_selector
    note: "The only tabular case where a neural net is the right default. Most specific condition in the stage, so it is tested first."
    was: >
      This node emitted TRAIN__TABULAR_DEEP directly. Because S0_MODALITY_FORK sends
      tabular straight here, that verdict had passed exactly one gate of five - G0,
      and only because G0 sits in stage 0. It now proposes, and S9_GATE_SWEEP makes
      it answer for the other four: is there a measured GBDT and TabPFN baseline, was
      a hyperparameter search actually run, was the missing signal looked for in the
      features first, and did the cheaper model class genuinely lose.

  - node: S8_TABULAR_WITH_TEXT
    condition: "modality == tabular and has_free_text_columns"
    outcome: NO_DEEP__HYBRID_EMBED_PLUS_GBDT
    say: "This is a table with free-text columns in it, which is two problems wearing one name. Embed the text columns, hand the embeddings to a gradient-boosted tree with the numeric ones, and the table is modelled by something built for tables. A language model asked to do arithmetic across columns is the expensive way to lose."
    method: "Embed the text columns with a small sentence encoder, concatenate to the numeric features, fit a GBDT."
    note: >
      Above S8_TABULAR_SMALL as well as above S8_TABULAR_STANDARD: free-text columns
      are not something a tabular foundation model or a plain GBDT handles, whatever
      the row count, so the hybrid answer is right across the whole size range.

  - node: S8_TABULAR_SMALL
    condition: "modality == tabular and 1000 <= tabular_rows <= 10000 and tabular_features <= 500 and classes_n <= 10"
    outcome: NO_DEEP__TABPFN
    say: "A table this size - between a thousand and ten thousand rows, under five hundred features, ten classes or fewer - is what TabPFN was built for, and it needs no training at all. Fit it, score it on your eval set, and compare that number to whatever a fine-tune would have to beat."
    numbers: "A tabular foundation model outperforms all previous methods on datasets up to 10,000 samples, matching in seconds what tuned baseline ensembles reach in hours."
    evidence: [tabpfn2025]

  - node: S8_TABULAR_STANDARD
    condition: "modality == tabular and tabular_rows > 10000 and not has_free_text_columns"
    outcome: NO_DEEP__GRADIENT_BOOSTED_TREES
    method: {libs: [LightGBM, XGBoost, CatBoost], tuning: "50-trial random or optuna search", hardware: "CPU is sufficient"}
    evidence: [grinsztajn2022]
    say: "This is the default answer for tabular prediction and it is usually the final answer."
    # ORDERING IS LOAD-BEARING: last of the SIZE-BANDED tabular nodes, and its
    # bound is the top of S8_TABULAR_SMALL's band, not the bottom.
    threshold_note: >
      THE BOUND IS "> 10000" AND IT MUST STAY THERE. It was widened to ">= 1000"
      in the previous pass to close a genuine hole - a 1,000 to 10,000 row
      dataset with more than 500 features or more than 10 classes falls outside
      S8_TABULAR_SMALL - and the widening cost three outcomes. TINY, WITH_TEXT
      and a ">= 1000" STANDARD between them cover every tabular run with a known
      row count, so nothing below this node could fire and
      NO_LLM__SETFIT, NO_LLM__ENCODER_FINETUNE and the classification reroute
      were all dead. Confirmed over 120,000 fact sets.

      The note that justified the widening also said something false, and a
      false justification in a spec is worse than no note: it claimed such a
      dataset "matched no node in the stage". It matched
      S8_TEXT_CLASSIFICATION_FEW_LABELS. That sentence is deleted rather than
      softened.

      The hole is real and it is closed the right way, by S8_TABULAR_UNMATCHED
      at the bottom of this stage - a catch-all BELOW the nodes it was
      swallowing rather than a widened bound above them. Both halves at once:
      the gap closed and the shadowing undone.

      WHAT THE BOUND IS STILL LOAD-BEARING FOR, now that the three
      classification nodes below carry modality guards. It is no longer holding
      NO_LLM__SETFIT and NO_LLM__ENCODER_FINETUNE open - those are text answers
      and are reached through S1_CLOSED_SET_CLASSIFICATION, not from here. It is
      still holding open S8_CLASSIFICATION_NEEDS_REASONING, which is a tabular
      run's only route to the LLM spine and therefore the only route to
      NO_TRAIN__RULED_OUT_EARLIER: at ">= 1000" this node would fire first for a
      5,000-row open-label tabular classification run and that outcome would be
      dead again. The bound stays at "> 10000".

      THE WORKED EXAMPLE, CORRECTED. It was written as evidence for this note
      and it turned out to be evidence of a different defect. Modality tabular,
      task_family classification, 5,000 rows, 800 numeric features, 40
      closed-set classes. Under ">= 1000" it returned
      NO_DEEP__GRADIENT_BOOSTED_TREES here. Under "> 10000" and no modality
      guard it fell to S8_TEXT_CLASSIFICATION_FEW_LABELS and returned
      NO_LLM__SETFIT - a sentence-transformer classifier over eight hundred
      columns of numbers, which is not a defensible recommendation at all and
      was recorded here as the correct one. It now falls to
      S8_TABULAR_UNMATCHED and returns NO_DEEP__GRADIENT_BOOSTED_TREES, which is
      the same ANSWER the widening produced by the wrong ROUTE. Both passes were
      arguing about the path; neither checked whether the answer at the end of
      it could be given to that user with a straight face.

  - node: S8_TIMESERIES
    condition: "modality == timeseries"
    outcome: NO_DEEP__CLASSICAL_FORECAST
    say: "This is a forecasting problem, and classical forecasting is still the thing to beat on one. Fit the ordinary models first, on the same horizon and the same error measure you would judge anything else by. A deep model that cannot beat them is a deep model you did not need."
    method: "ETS/ARIMA/Prophet and a GBDT on lag features as the baselines, plus a zero-shot foundation forecaster as a third check. Beat all three before training anything."

  # ===========================================================================
  # THE THREE SMALL-ENCODER NODES. THE FIRST TWO ARE ABOUT TEXT AND NOW SAY SO.
  #
  # These three sat here with no modality guard at all, in a stage only tabular
  # and timeseries runs could enter, and S8_TIMESERIES above is terminal for
  # every timeseries run. So the only runs that could reach them were TABULAR -
  # and after S8_TABULAR_WITH_TEXT above, tabular runs with a free-text column
  # are already gone, so the runs that reached them had no text in them at all.
  # The product recommended SetFit, a contrastively fine-tuned SENTENCE
  # TRANSFORMER, to a user with five thousand rows of eight hundred NUMERIC
  # columns. It recommended DeBERTa-v3, a text encoder, to the same user one
  # node later. Neither model can read that data; there is nothing for a
  # sentence transformer to embed. This product's whole claim is that its advice
  # is honest, and that advice was not wrong at the margin, it was categorically
  # wrong - a text model proposed for a table of numbers.
  #
  # WHAT THEY ARE FOR. Both are text-classifier answers, and both of their
  # bodies say so and always did: "a contrastively fine-tuned sentence
  # transformer", "DeBERTa-v3 or ModernBERT with a classification head",
  # "before any LLM fine-tune for classification". Those sentences are addressed
  # to somebody who is contemplating fine-tuning a LANGUAGE model on TEXT. They
  # were never addressed to a tabular user; a tabular user is not contemplating
  # an LLM fine-tune, because S8_TABULAR_REJECT_NEURAL struck LORA_SFT and
  # FULL_FINETUNE for them on the way into this stage.
  #
  # SO THEY KEEP THEIR STAGE AND GAIN THEIR GUARD, and the door those users
  # arrive through is S1_CLOSED_SET_CLASSIFICATION. Moving them to another
  # stage was the alternative and it is the worse one: stage 8 is the non-LLM
  # stage, these are the non-LLM answers, and the third node below is the
  # fall-through shared by both branches. Splitting them across two stages would
  # duplicate that fall-through, and a duplicated escape hatch is how one of the
  # two goes stale.
  #
  # `code` is in the guard with `text` because code IS text to these models and
  # S0_MODALITY_FORK already routes the two identically. `multimodal` is NOT:
  # a sentence encoder cannot read the non-text half, and a guard that quietly
  # includes a modality the method cannot handle is the same defect this comment
  # is about, one enum member smaller.
  #
  # The tabular run that used to land here now falls to S8_TABULAR_UNMATCHED and
  # gets a gradient-boosted tree, which is the right answer for eight hundred
  # numeric columns and forty classes and was the right answer all along.
  - node: S8_TEXT_CLASSIFICATION_FEW_LABELS
    condition: "modality in {text, code} and task_family == classification and classes_n <= 50 and labels_are_closed_set"
    outcome: NO_LLM__SETFIT
    numbers: "A contrastively fine-tuned sentence transformer can build a usable classifier from about 8 labeled examples per class, runs on CPU, and answers in milliseconds."
    evidence: [setfit]
    say: "Before any LLM fine-tune for classification, try this. Minutes of training and no GPU."
    where_the_data_floor_lives: >
      The 8-examples-per-class floor in `numbers` is enforced at the door,
      S1_CLOSED_SET_CLASSIFICATION, not here - it is the condition on which this
      whole branch is entered rather than a property of this node against its
      siblings. Every run that reaches this line has labeled_examples_n >= 8 *
      classes_n with both numbers actually read. If a second door into this
      stage is ever added for text, it carries the floor too, or this node
      starts recommending a fit on two examples per class.

  - node: S8_TEXT_CLASSIFICATION_MANY_LABELS
    condition: "modality in {text, code} and task_family == classification and labeled_examples_n >= 1000 and labels_are_closed_set"
    outcome: NO_LLM__ENCODER_FINETUNE
    say: "A thousand labelled examples over a closed set of labels is a classifier, not a generator. Fine-tuning an encoder does this job on a fraction of the hardware, trains in minutes, and gives you a number per class you can read. Generating label text with an LLM is the same task with the answer key thrown away."
    method: "DeBERTa-v3 or ModernBERT with a classification head. 100-400M params, minutes on one consumer GPU."
    note: >
      Below S8_TEXT_CLASSIFICATION_FEW_LABELS deliberately: under 50 classes the
      cheaper SetFit answer wins even when the labelled data would also support
      an encoder. This node is for the label counts SetFit's band does not cover.

  # NO MODALITY GUARD ON THIS ONE, AND THAT IS THE DECISION, NOT AN OVERSIGHT.
  # The two nodes above are answers - specific methods that only work on text.
  # This is the fall-through: "this classification problem is not a closed-set
  # label assignment, so no small-encoder answer applies; go and be diagnosed on
  # the LLM spine." That sentence is true of a tabular run and of a text run
  # alike, and it is the ONLY way a tabular run reaches the LLM spine at all -
  # see the S3_TABULAR_KNOWLEDGE_GAP comment in stage 3 and
  # NO_TRAIN__RULED_OUT_EARLIER in stage 9, both of which exist only because
  # this reroute is live. Guarding it to text would kill both.
  #
  # It cannot fire for a run that came through S1_CLOSED_SET_CLASSIFICATION:
  # that door requires labels_are_closed_set and not requires_multistep_reasoning,
  # which is exactly the negation of this condition. That is what stops
  # stage 1 -> stage 8 -> stage 1 being an infinite loop.
  - node: S8_CLASSIFICATION_NEEDS_REASONING
    condition: "task_family == classification and (not labels_are_closed_set or requires_multistep_reasoning)"
    outcome: REROUTE
    route: stage_1_baseline

  # THE LAST NODE OF THE TABULAR BLOCK, and it cannot fail to fire for any
  # TABULAR run that reaches it - `modality == tabular` is the honest predicate
  # for "everything the nodes above did not answer", written as a real condition
  # rather than `always`. It is no longer the last node of the STAGE: this stage
  # now has a second door, S1_CLOSED_SET_CLASSIFICATION, and a text run that
  # comes through it is not covered by this predicate. The stage terminator is
  # S8_TEXT_CLASSIFICATION_NEEDS_LABELS below.
  #
  # THIS IS THE RIGHT PLACE FOR THE CATCH-ALL AND THE WIDENED S8_TABULAR_STANDARD
  # WAS THE WRONG ONE. Both close the same hole - a 1,000 to 10,000 row dataset
  # with more than 500 features or more than 10 classes, or a features or
  # classes count nobody could read - but a catch-all at the BOTTOM of the stage
  # cannot shadow anything, and a widened bound in the middle of it shadowed
  # three outcomes. A default belongs last. That is the same sentence the
  # tabular block already had written on it; this node is where it finally
  # applies.
  - node: S8_TABULAR_UNMATCHED
    condition: "modality == tabular"
    outcome: NO_DEEP__GRADIENT_BOOSTED_TREES
    method: {libs: [LightGBM, XGBoost, CatBoost], tuning: "50-trial random or optuna search", hardware: "CPU is sufficient"}
    evidence: [grinsztajn2022]
    say: >
      "Nothing more specific describes this dataset - it is past the size where
      statistics is the honest answer, outside the band a tabular foundation
      model covers, and it has no free-text column for the hybrid answer.
      A gradient-boosted tree is the default for tabular data and it is usually
      also the final answer."
    reachability_note: >
      Reached by a tabular run in the 1,000 to 10,000 row band that is too wide
      or too many-classed for S8_TABULAR_SMALL, and by any run whose
      tabular_features or classes_n could not be read. Before this node existed
      the stage ran off the end and the engine raised ERROR__NO_NODE_MATCHED -
      193 times in 40,000 randomized fact sets, the single largest crash shape in
      the file.

      IT ALSO NOW ANSWERS THE TABULAR CLASSIFICATION RUN, and that is the second
      half of the modality-guard fix above. The worked example the last pass
      argued over - 5,000 rows, 800 numeric columns, 40 closed-set classes -
      lands here and gets a gradient-boosted tree. It used to fall to
      S8_TEXT_CLASSIFICATION_FEW_LABELS and be told to fit a sentence
      transformer over eight hundred numbers. The `say` above previously ended
      "and it is not a classification task with a closed label set", which was
      true only while that node was swallowing this user; the clause is deleted
      rather than softened, in line with sources_policy.no_invented_numbers
      applied to our own prose.

  # THE LAST NODE OF STAGE 8, and the stage terminator the second door made
  # necessary. S8_TABULAR_UNMATCHED above is `modality == tabular` and covers
  # every tabular run; S8_TIMESERIES covers every timeseries run; both are
  # terminal. So the only thing that can still be walking when evaluation
  # reaches this line is a text or code run that came through
  # S1_CLOSED_SET_CLASSIFICATION, and that door's own condition requires
  # `task_family == classification`. The predicate below is therefore true for
  # every run that can reach it - written as a real condition rather than
  # `always`, per the catch-all rule in uninspectable_facts.
  #
  # WHO LANDS HERE: a closed-set text classifier with more than 50 labels - too
  # many for SetFit's band - and fewer than 1,000 labelled examples, which is
  # the floor an encoder fine-tune wants. It cleared the door's 8-per-class
  # floor, so there is real labelled data, just not enough of it for either
  # small-encoder answer. Sixty categories and five hundred examples is the
  # shape. The honest answer is that this is a data problem, not a method
  # problem, and it is the same sentence S5_NOT_ENOUGH_DEMONSTRATIONS and
  # S6_ABSENT_AND_NO_DATA give one stage over, which is why it reuses their
  # outcome rather than minting a new one.
  #
  # Without this node the stage ran off the end for that user and the engine
  # raised ERROR__NO_NODE_MATCHED - the same crash shape S8_TABULAR_UNMATCHED
  # was added to close, arriving through the new door. Opening a door into a
  # stage means re-checking that stage's terminator; that is the rule this node
  # is the instance of.
  - node: S8_TEXT_CLASSIFICATION_NEEDS_LABELS
    condition: "task_family == classification"
    outcome: BLOCKED__COLLECT_OR_SYNTHESIZE_DATA
    say: >
      "This is a classifier, not a language-model problem, and the two cheap
      classifier answers both need more labelled data than you have: SetFit's
      band stops at 50 classes and an encoder fine-tune wants about a thousand
      labelled examples. Get to a thousand - or fold the taxonomy down under 50
      classes - and this becomes minutes of training on one GPU."
    numbers: "SetFit builds a usable classifier from about 8 labeled examples per class."
    evidence: [setfit]
    where_the_other_number_comes_from: >
      The 1,000 in the `say` is not a second citation, it is this file's own
      existing bound: S8_TEXT_CLASSIFICATION_MANY_LABELS is
      `labeled_examples_n >= 1000` and carries no `evidence:` key, so it has no
      external source to quote and this node does not invent one for it. Only
      the 8-per-class figure is cited, and only to `setfit`, which is where it
      actually comes from. Per sources_policy.no_invented_numbers: a threshold
      traces to a source key or it is named as ours.
    exit_criterion: "labeled_examples_n >= 1000, or classes_n <= 50 with at least 8 examples in each"
    recipe: "Synthesize from the real input distribution with a teacher model, then have a human verify a 10% sample before training on any of it."

# ORDERING IS LOAD-BEARING, AND IT WAS WRONG HERE TOO. S8_VISION_AUDIO_OFFTHESHELF
# is `modality in {image, audio}` and terminal, and S8_VISION_AUDIO_GAP - which
# is the same set plus four more clauses - sat below it. Its condition implied
# the node above it exactly, so no run could ever reach it: an image or audio
# user who HAD measured the off-the-shelf model, found it short, and had 500
# labelled examples was told to go and measure the off-the-shelf model. The one
# proposing node on the vision and audio branch was dead, and RC5 did not list
# it, so nothing caught it.
#
# Fixed the way `shadowing_rule` prescribes and the way stages 1, 3, 5, 7 and 8
# already were: the specific case is tested FIRST, and the general case carries
# its negation so the ordering survives someone reordering the stage without
# reading this comment.
stage_8_offtheshelf_first:
  - node: S8_VISION_AUDIO_GAP
    condition: "modality in {image, audio} and offtheshelf_measured and baseline_score < target_score and labeled_examples_n >= 500"
    outcome: REROUTE
    propose: UNSET
    route: stage_9_method_selector
    note: >
      The off-the-shelf model was measured on the eval set and came up short, and
      there are 500 labelled examples to fine-tune it on. Stage 9 picks the
      method from the size table and, being a proposal rather than a verdict,
      pays for all five gates on the way.

  # THE LAST NODE OF STAGE 8_OFFTHESHELF_FIRST, and it cannot fail to fire: it is
  # the whole entry condition of the stage minus the specific case above.
  - node: S8_VISION_AUDIO_OFFTHESHELF
    condition: "modality in {image, audio} and not (offtheshelf_measured and baseline_score < target_score and labeled_examples_n >= 500)"
    outcome: NO_TRAIN__OFF_THE_SHELF_MODEL
    catalogue:
      asr: Whisper
      detection: "YOLO / DETR"
      segmentation: SAM
      embedding: "CLIP / SigLIP"
      ocr: "Surya / PaddleOCR"
    say: "Measure the off-the-shelf model on your eval set first. It passes more often than people expect."

# ---------------------------------------------------------------------------
# STAGE 9 - METHOD SELECTOR. The only stage that can mint a TRAIN verdict.
#
# Every route into this stage arrives with a proposal, not a verdict. The stage
# opens by finishing the gate ledger and closes by minting. Nothing in between
# emits a verdict of any kind.
#
# ONE INVARIANT HOLDS THIS STAGE TOGETHER AND IT IS EASY TO BREAK BY ACCIDENT:
# every proposal that any node BELOW S9_GATE_SWEEP sets or changes is class
# llm_weights, the same class UNSET uses, so the sweep at the top of the stage
# cannot be invalidated by anything after it. S9_SIZE_TO_METHOD names LORA_SFT
# and FULL_FINETUNE; S9_FULL_FT_JUSTIFIED names FULL_FINETUNE; S9_FROM_SCRATCH
# names FROM_SCRATCH. All llm_weights. If you add a node here that can propose a
# method of any other class, the sweep must be re-run after it, because the
# applicable gate rows will have changed underneath a ledger that already looks
# complete. Check this before adding a node to this stage.
stage_9_method_selector:

  - node: S9_GATE_SWEEP
    condition: always
    order: "G0_EVAL_SET, G1_BASELINE_MEASURED, G2_PROMPT_EXHAUSTED, G3_RETRIEVAL_CONSIDERED, G4_CHEAPER_MODEL_CONSIDERED"
    rule: >
      Let c = method_class(proposed_method). For each gate g in that order:
      compute r = row_key(g, c), the passes_when row that applies to c. If `path`
      already holds a gate entry for g whose `row` == r, skip it - that exact
      question has been asked and answered on the way here. Otherwise evaluate row
      r. If it is true, append a node entry {id: gates[g].node, kind: node} and
      then a gate entry {id: g, kind: gate, row: r, clause: <the row's requires
      string>}, and continue. If it is false, stop: the run terminates at the
      gate's `on_fail` route, the proposal is written into rejected[] with the gate
      id as the reason, and the user is told to do the cheaper thing.
    re_evaluation: >
      A gate already in `path` under a DIFFERENT row is evaluated again, not
      skipped. This is the whole of the fix for the latching bypass. A G3 passed
      under llm_weights during the pre-proposal walk has not answered the
      retriever_weights question, and it must not be allowed to look as though it
      did; the same holds for every G2 row against every other G2 row.
      Evaluating a gate here does not ENTER the stage that gate heads, so it does
      not count towards cycle_guard and it does not pick up that stage's `effect:`
      strikes. See contract.path_semantics.latching.
    say_on_fail: >
      "You are proposing to {method}. Before that is the right answer, {gate.asks}
      Here is the cheaper thing to try first, and what it would have to fail at
      before training becomes the honest recommendation."
    note: >
      This is where the tabular, format, retriever, distillation and vision branches
      pay for skipping the LLM spine. It is the single structural fix in this file.
      A gate that fails here is not an error - it is the product working.

  - node: S9_PRECONDITION
    condition: "not all(g in gates_passed_under(path, method_class(proposed_method)) for g in contract.required_gates)"
    outcome: ERROR__GATE_SKIPPED
    say: "A training recommendation was reached without exhausting the no-train gates. This is a bug, not a diagnosis."
    row_note: >
      The check is gates_passed_under, not bare membership. A gate present in
      `path` under a row that does not apply to this proposal's class has not been
      passed for this proposal, and this assertion has to say so or it re-opens the
      hole the sweep just closed.
    note: >
      Defensive assertion, not a user-facing branch. After S9_GATE_SWEEP this can
      only fire if the sweep itself is broken, so it raises rather than rendering.
      It used to be the only gate check in the engine, which is why six stages could
      route around it.

  - node: S9_METHOD_CLASS_KNOWN
    condition: "proposed_method not in methods"
    outcome: ERROR__UNCLASSIFIED_METHOD
    say: "A method was proposed that has no entry in `methods`, so no gate knows which row to apply. Add its rows to all five gates before shipping it."

  - node: S9_DATA_INSUFFICIENT
    condition: "the count named for proposed_method in `floors` below is under its floor"
    outcome: BLOCKED__COLLECT_OR_SYNTHESIZE_DATA
    say: "The method proposed here has a floor on how many examples it needs, and this dataset is under it. Training on fewer is not a smaller version of the same run - it is a run whose result cannot be told apart from noise. Collect more real rows, or synthesise and label them, before anything is trained."
    floors:
      CONTINUED_PRETRAINING: {count: unlabeled_domain_tokens,        floor: 100000000, from: S3_DOMAIN_DIALECT_GAP.thresholds.minimum_tokens}
      FROM_SCRATCH:          {count: tokens_available,               floor: "20 * target_params", from: S9_FROM_SCRATCH.condition}
      EMBEDDING_FINETUNE:    {count: labeled_query_positive_pairs,   floor: 1000,      from: S3_TRAIN_THE_RETRIEVER_NOT_THE_LLM.condition}
      TABULAR_DEEP:          {count: tabular_rows,                   floor: 1000,      from: S8_TABULAR_TINY.condition}
      DISTILLATION:          {count: "calls_per_day, or user_can_produce(10000, 'real inputs to run the teacher over')", floor: 10000, from: S7_DISTILL.method.data}
      default:               {count: labeled_examples_n,             floor: 50,        from: openai_sft,
                              applies_to: "UNSET, LORA_SFT, FULL_FINETUNE, DPO, RL_GRPO"}
    numbers: "The practical floor for demonstrations is 10 examples; the recommended starting point is 50 well-crafted ones. If 50 good examples move nothing, the task or the prompt is wrong, not the data volume."
    evidence: [openai_sft]
    recipe: "Synthesize from the real input distribution with a teacher model, then have a human verify a 10% sample before training on any of it."
    why_this_is_a_table: >
      It used to read `labeled_examples_n < 50` for every method, which is the
      wrong count for four of the nine. Continued pretraining trains on an
      unlabeled corpus. From-scratch trains on a token budget. An embedding
      fine-tune trains on query-positive pairs. A tabular net trains on rows. A
      distillation student trains on data that does not exist yet - it is
      generated by the teacher - so what has to exist is real inputs to run the
      teacher over. Under the old single check, four proposals that had every
      input they needed would have been blocked here for lacking a kind of data
      they were never going to use. Every floor above is a number already in this
      file, carried across with its source, not a new one.

  - node: S9_SIZE_TO_METHOD
    condition: always
    applies_to: "proposed_method == UNSET, or as a check on a proposal that named a size-sensitive method"
    effect: >
      Always sets `size_row` to the matching row and `required_rank` to
      size_row.rank_max. Sets `proposed_method` to size_row.method ONLY when
      proposed_method is UNSET. A named proposal is never overwritten here, which
      is what stops a DISTILLATION, EMBEDDING_FINETUNE, TABULAR_DEEP or
      CONTINUED_PRETRAINING proposal being turned into a LoRA on its way past a
      table that was written about LLM demonstration counts.
    table:
      # rank_min and rank_max are integers, and they are the SAME numbers that were
      # already in the `rank` strings - "8-16" is rank_min 8, rank_max 16. Nothing
      # new is asserted here; a string that only a human could read was made into
      # two fields a condition can read. See derived.required_rank for why.
      - {examples: "50-500",       method: LORA_SFT, rank: "8-16",   rank_min: 8,   rank_max: 16,  epochs: "3-4", full_ft_offered: false, realistic_gain: "format and tone only"}
      - {examples: "500-5000",     method: LORA_SFT, rank: "16-32",  rank_min: 16,  rank_max: 32,  epochs: "2-3", full_ft_offered: false, realistic_gain: "behaviour and format; the product's sweet spot"}
      - {examples: "5000-50000",   method: LORA_SFT, rank: "32-64",  rank_min: 32,  rank_max: 64,  epochs: "1-2", full_ft_offered: false, realistic_gain: "task specialization"}
      - {examples: "50000-500000", method: LORA_SFT, rank: "64-256", rank_min: 64,  rank_max: 256, epochs: "1",   full_ft_offered: true,
         note: "The table's own text was 'LORA_SFT rank 64-256, or FULL_FINETUNE if hardware allows'. The default stays LoRA; full_ft_offered is the 'or' clause, and S9_FULL_FT_JUSTIFIED is where it is taken."}
      - examples: ">500000"
        method: FULL_FINETUNE
        rank: null
        rank_min: null
        rank_max: null
        epochs: "1"
        full_ft_offered: true
        note: >
          The table stops offering LoRA here, so there is no rank cell to read and
          required_rank is null. That is the point of the row, not a gap in it.
          The old row named FULL_FT_OR_CPT, which is not a method in `methods` and
          would have tripped S9_METHOD_CLASS_KNOWN the moment it was assigned. An
          unlabeled corpus at this scale is CONTINUED_PRETRAINING, proposed at
          S3_DOMAIN_DIALECT_GAP, and such a run never reaches this table with
          proposed_method UNSET, so this row only ever has to name the labelled
          case.
    class_safety: "Every method this table can name is class llm_weights, the same class as UNSET, so resolving a proposal here cannot invalidate the gate sweep that already ran. If a future row names another class, re-run the sweep."
    anchor: "A rank-32 adapter on a 7B model matched full fine-tuning up to roughly 50,000 examples; past that, raising rank to 64 or 128 restored parity. LoRA falls behind only when dataset size exceeds adapter capacity."
    evidence: [tml_lora]

  - node: S9_LORA_CONFIG
    condition: "proposed_method in {LORA_SFT, DPO, RL_GRPO}"
    rules:
      target_modules: "ALL layers including MLP and MoE blocks. Attention-only LoRA underperforms - rank-256 attention-only lost to rank-128 MLP-only at roughly equal parameter count."
      learning_rate: "10x the full-fine-tune LR for the same job; about 15x for short runs of ~100 steps."
      batch_size: "<= 512. LoRA carries a batch-size penalty at large batches that no amount of rank fixes."
      epochs: "from the size table above"
    evidence: [tml_lora, trl_lora]

  - node: S9_HARDWARE_ROUTER
    condition: "method_class in {llm_weights, llm_efficiency}"
    scope_note: >
      Was `condition: always`, which ran an LLM VRAM table over tabular and
      retriever proposals it does not describe - and its cpu_only route would have
      sent a TABULAR_DEEP proposal back to stage_8_classical, the stage it came
      from. A retriever fine-tune carries its own figure at
      S3_TRAIN_THE_RETRIEVER_NOT_THE_LLM.method.vram_gb and a GBDT runs on CPU per
      S8_TABULAR_STANDARD.method.hardware. When this node does not run, `route` and
      `hardware_permits` are null and nothing downstream reads them; the one reader,
      S9_FULL_FT_JUSTIFIED, is guarded to llm_weights.
    training_vram_model:
      full_ft_adamw_bf16: "~16 bytes/param (2 weights + 2 grads + 12 optimizer) plus activations"
      lora_bf16_base:     "~2 bytes/param plus adapter states and activations"
      qlora_nf4_base:     "~0.5-0.65 bytes/param plus adapter states and activations"
    reference_points:
      - {model: 7B,  full_ft_gb: 112, lora_gb: 16, qlora_gb: 12}
      - {model: 13B, full_ft_gb: 208, lora_gb: 28, qlora_gb: 20}
      - {model: 14B, qlora_gb: 24, note: "the practical ceiling of a single RTX 4090"}
      - {model: 70B, qlora_gb: 48, note: "multi-GPU or rented"}
    evidence: [vram2026]
    routes:
      - "vram_gb >= full_ft_gb        -> FULL_FT permitted (still check S9_FULL_FT_JUSTIFIED)"
      - "vram_gb >= lora_gb           -> LORA"
      - "vram_gb >= qlora_gb          -> QLORA"
      - "accelerator == apple_silicon -> MLX-LM LoRA; usable memory is about 0.75 * ram_gb (unified)"
      - "accelerator == cpu_only      -> no LLM training; reroute to stage_8_classical"
      - "otherwise and can_rent_cloud -> RENT_GPU (see app/feasibility.py rent_advice)"
      - "otherwise                    -> shrink the base model one tier, then re-run this node"
    provenance_rule: >
      If accelerator, vram_gb or ram_gb came from a default rather than a
      measurement, this router still runs but its output is stamped
      cost_provenance: UNKNOWN, and every number it produces renders as an
      unverified estimate. A verdict computed from a defaulted hardware number is a
      different claim from one computed from a measured GPU and must not look the
      same on screen.

  - node: S9_QLORA_QUALITY_TAX
    condition: "route == QLORA and quality_loss_tolerance == none and can_rent_cloud and budget_usd >= 50"
    outcome: null
    effect: "set route = RENT_GPU; record the reason on the plan"
    say: "QLoRA halves the memory for a small quality cost. If you can tolerate none, an hour of rented 48GB is cheaper than the cost of not knowing."
    was: >
      This carried `outcome: RECOMMEND_RENT_FOR_LORA` - a value with no prefix in
      contract.outcome_prefixes and therefore no verdict at all. Written that way it
      terminated the run with something unrenderable, and it sat above every mint,
      so it killed any run the hardware router sent to QLORA. It is advice about how
      to run the training, not a decision about whether to, so it is an effect.

  - node: S9_FULL_FT_JUSTIFIED
    condition: "proposed_method in {UNSET, LORA_SFT, FULL_FINETUNE} and labeled_examples_n > 50000 and size_row.full_ft_offered and hardware_permits"
    propose: FULL_FINETUNE
    counter_rule: "If the model must stay generally capable outside the target domain, prefer LoRA even where full fine-tuning scores higher on the target - LoRA forgets less, and mitigates forgetting better than weight decay or dropout."
    evidence: [biderman2024]
    was: >
      The condition read `required_rank > 256`. required_rank derives from
      S9_SIZE_TO_METHOD, whose rank cells were strings - "8-16", "16-32", "32-64",
      and "64-256" buried inside a sentence. A string is never greater than 256, so
      the clause could not be true and TRAIN__FULL_FINETUNE was unreachable. It now
      reads the table's own "or FULL_FINETUNE if hardware allows" clause, which is
      what the sentence meant, as the boolean full_ft_offered. See
      derived.required_rank.
    proposal_guard: >
      The first clause stops this node hijacking a DISTILLATION,
      EMBEDDING_FINETUNE, TABULAR_DEEP, DPO, RL_GRPO or CONTINUED_PRETRAINING
      proposal that happens to arrive with a large labeled_examples_n. Without it,
      a proposal that passed the gates under one class would be minted as a method
      of another class - which is the Finding 3 bypass again, arriving from inside
      stage 9 instead of from outside it.

  - node: S9_FROM_SCRATCH
    condition: "proposed_method in {UNSET, LORA_SFT, FULL_FINETUNE} and ALL of: no_suitable_open_weight_base_exists AND tokens_available >= 20 * target_params AND budget_usd >= from_scratch_cost_estimate AND (target_params <= 1e9 or enterprise_cluster_available)"
    propose: FROM_SCRATCH
    proposal_guard: "Same guard and same reason as S9_FULL_FT_JUSTIFIED above."
    numbers:
      chinchilla: "about 20 tokens per parameter is the compute-optimal floor; modern open-weight practice has drifted to 100-300 tokens per parameter."
      cost_1b: "~1B params on ~50B tokens: on the order of $1.5k at spot pricing"
      cost_7b: "~7B params on ~140B tokens: on the order of $30k-$50k at spot pricing"
    evidence: [chinchilla, epoch_tpp, scratch_cost]
    say: "Almost always the wrong answer. Show the number before the user commits."

  - node: S9_FROM_SCRATCH_EDUCATIONAL
    condition: "goal_is_learning and target_params <= 150000000"
    outcome: TEACH__FROM_SCRATCH_NANOGPT
    say: "GPT-2-class quality is reachable for tens of dollars as a weekend run. This is a teaching outcome, explicitly labelled as such, not a production recommendation."
    evidence: [scratch_cost]
    note: "Gated by contract.teach_outcome_rules. Unreachable when the user's goal is a working system."

  - node: S9_FROM_SCRATCH_REJECTED
    condition: "user_requested_from_scratch and not S9_FROM_SCRATCH.condition"
    outcome: NO_TRAIN__USE_EXISTING_BASE
    say: "Fine-tuning an open-weight base with LoRA costs a low four figures at most, against the five-to-seven figures a from-scratch run needs, for the same result on your eval."

  # ORDERING IS LOAD-BEARING: immediately above the mint, and it is the negation
  # of the mint's own third clause.
  #
  # S9_MINT_TRAIN_VERDICT will not fire on a struck method, which is right - but
  # "will not fire" is not an answer, it is the last node of the stage declining
  # to run, and the walk then fell off the end of stage 9 and raised. The path
  # that gets here: a tabular classification run needing reasoning reroutes to
  # stage 1 with LORA_SFT and FULL_FINETUNE already struck by
  # S8_TABULAR_REJECT_NEURAL, walks the LLM spine, proposes LORA_SFT, passes all
  # five gates and arrives at a mint that cannot mint. Restoring
  # S8_CLASSIFICATION_NEEDS_REASONING to reachability makes that path live, so
  # this node has to exist alongside it.
  #
  # The verdict is NO_TRAIN and that is the honest one: the method the tree
  # landed on was ruled out earlier in this same run, with a reason and a
  # citation already sitting in rejected[].
  - node: S9_PROPOSAL_WAS_STRUCK
    condition: "proposed_method in struck_methods"
    outcome: NO_TRAIN__RULED_OUT_EARLIER
    say: >
      "Everything cheaper was tried and the gates all passed - and the method
      this leaves is one an earlier step in this same run ruled out for your
      data. The reason is in the rejected list. Do that instead; there is no
      training recommendation here."
    requires_in_diagnosis:
      - "rejected[] must name the struck method and the node that struck it, or this outcome is unreadable"

  # -------------------------------------------------------------------------
  # THE ONLY PLACE A TRAIN VERDICT IS CREATED IN THIS FILE.
  - node: S9_MINT_TRAIN_VERDICT
    condition: "all(g in gates_passed_under(path, method_class(proposed_method)) for g in contract.required_gates) and proposed_method != UNSET and proposed_method not in struck_methods"
    row_note: >
      gates_passed_under, not bare membership in `path`. A gate passed under a row
      that does not apply to this proposal's class did not ask this proposal's
      question and does not count towards the mint. This one word is the difference
      between the guarantee and the appearance of it.
    outcome: "TRAIN__{proposed_method}"
    verdict: TRAIN
    emits: [TRAIN__LORA_SFT, TRAIN__FULL_FINETUNE, TRAIN__DPO, TRAIN__RL_GRPO,
            TRAIN__CONTINUED_PRETRAINING, TRAIN__FROM_SCRATCH, TRAIN__DISTILLATION,
            TRAIN__EMBEDDING_FINETUNE, TRAIN__TABULAR_DEEP]
    requires_in_diagnosis:
      - "rejected[] non-empty - a training verdict without the list of what was ruled out is an opinion, not a diagnosis"
      - "exit_criterion set - how we will know it worked"
      - "estimated_cost set, stamped with cost_provenance"
      - "revisit_if set - what would change this answer"
    say: >
      "Everything cheaper has been tried and measured, and it did not get you there.
      Here is what is left, what it will cost, and how you will know if it worked."
    hand_off: "Execution goes to a pinned backend - Unsloth, HF peft+trl, or MLX-LM. We do not run it ourselves; see contract.execution_is_delegated."

# ---------------------------------------------------------------------------
# The spine. Cheapest first. The engine always reports which rung it stopped on.
escalation_ladder:
  0:  DEFINE_SUCCESS_AND_EVAL_SET
  1:  MEASURE_BASELINE
  2:  BETTER_SYSTEM_PROMPT
  3:  FEW_SHOT
  4:  CONSTRAINED_DECODING
  5:  SWAP_MODEL_OR_USE_EXISTING_FINETUNE
  6:  RETRIEVAL
  7:  AGENT_SCAFFOLD
  8:  AUTOMATED_PROMPT_OPTIMIZATION
  # WHERE THIS RUNG ACTUALLY SITS, per branch. The old comment said "for
  # tabular, timeseries and closed-set text this is rung 1, not rung 9" and only
  # two thirds of that was implemented: tabular and timeseries fork out at
  # S0_MODALITY_FORK before rung 1, and closed-set text had no fork at all and
  # walked every rung to 10. It forks now, at S1_CLOSED_SET_CLASSIFICATION,
  # which is rung 2 and not rung 1 - a text classifier has a real LLM baseline
  # and must measure it (rung 1) before we can honestly say a small encoder is
  # the better answer. A tabular run has no such baseline to measure, which is
  # why its fork can be earlier.
  9:  CLASSICAL_ML_OR_SMALL_ENCODER    # tabular and timeseries fork here before rung 1; closed-set text forks here at rung 2
  10: LORA_QLORA_SFT
  11: PREFERENCE_OPTIMIZATION_OR_RL
  12: DISTILLATION
  13: FULL_FINETUNE
  14: CONTINUED_PRETRAINING
  15: FROM_SCRATCH

# ---------------------------------------------------------------------------
# HOW THE INVARIANT IS CHECKED. Two greps over this file and four assertions over
# the fixtures. If any of these six fails, the product promise is broken and the
# build should not ship.
static_checks:
  - id: SC1_ONE_MINT
    rule: "No node may carry an `outcome:` whose value starts with TRAIN__, except S9_MINT_TRAIN_VERDICT."
    how: "grep -nE '^\\s+outcome: \"?TRAIN__' docs/diagnosis_engine.yaml  ->  exactly one hit, at S9_MINT_TRAIN_VERDICT"
    note: "NO_TRAIN__ contains the substring TRAIN__, so anchor the match at the start of the value."

  - id: SC2_EVERY_PROPOSAL_ROUTES_TO_STAGE_9
    rule: "Every node carrying `propose:` must also carry `route: stage_9_method_selector`, or already be inside stage_9_method_selector."
    how: "parse the YAML; for each node with a `propose` key assert the route"

  - id: SC3_EVERY_METHOD_HAS_FIVE_GATE_ROWS
    rule: "For each method in `methods`, each of the five gates has a matching `passes_when` row - either method_class: any, or a row for that method's class."
    how: "cross-product check over methods x gates"

  - id: SC4_RANKS_ARE_NUMBERS
    rule: >
      Every row of S9_SIZE_TO_METHOD carries integer rank_min and rank_max, or
      carries null for both with a stated reason. No condition anywhere in this
      file compares required_rank to a number.
    how: "parse the table and assert the types; then grep for 'required_rank' in any `condition:` value - expect zero hits"
    note: "The second half is the one that matters. The first half makes the field usable; the second stops the same defect returning through a different field."
  - id: SC5_EVERY_FACT_A_GATE_READS_HAS_A_SOURCE_THE_POLICY_COVERS
    rule: >
      Every fact declared in `facts` carries a `source:`, every `source:` value
      appears as a key of fact_origins.admissible_for_gates, and every origin
      named in that table appears in fact_origins.vocabulary. The
      unsubstantiated_outcome must carry a prefix `contract.outcome_prefixes`
      declares terminal.
    how: "parse the ledger and the fact_origins block and cross-check the three key sets"
    note: >
      This is what stops the origin rule being quietly holed by an omission
      rather than by an edit. A fact with no `source:` would have no admissible
      set, and the honest default for "the ledger does not say" is to refuse it -
      but a rule whose default is refusal is a rule that fails a build loudly,
      which is the point. There is no fact-name list anywhere in the mechanism;
      the check is over `source:` values, so a fact added tomorrow is covered the
      moment its source is written down.

  - id: SC6_NO_GATE_READS_AN_OPINION
    rule: >
      No `passes_when` row of any gate may read a fact declared `opinion_of:`,
      and no fact declared `opinion_of:` may ever carry the MEASURED origin.
    how: >
      Parse every gate row's `requires` with the engine's own condition compiler,
      intersect with the ledger, and assert the intersection contains no
      `opinion_of:` fact - the same derivation RC10 uses, never a written list.
      Then assert the other half at the table: `evidence.record` raises for a
      MEASURED row on such a fact, and `evidence.may_be_declared_measurable`
      refuses it, so no tool can declare one in `measures=` at registration.
    note: >
      This is the half of the fix that lives in the SHAPE of the file rather
      than in the origin of a value. The origin rule asks who supplied a fact;
      this asks whether the fact is the kind of thing anybody can supply as a
      reading at all. `judge_score` is the first, and the argument for it is in
      fact_origins.a_models_opinion_is_not_a_reading.
    and_it_must_be_mutation_checked: >
      Delete `opinion_of: model` from `judge_score` and this check must go RED,
      and so must the tests that stand on it. A wall whose test passes with the
      wall removed is testing nothing, and this file has been bitten by exactly
      that twice.

# The rule the four dead outcomes broke. It is a review rule, not a grep, and it
# is honest about that: whether one condition implies another is not decidable in
# general. RC5_FIXTURE_COVERAGE is the mechanical check that catches it.
shadowing_rule:
  rule: >
    Within a stage, a node with a terminal `outcome:` kills every later node whose
    condition implies its own. Four TRAIN__ outcomes were dead this way -
    DISTILLATION, EMBEDDING_FINETUNE, TABULAR_DEEP and FULL_FINETUNE - while this
    file claimed all nine were gated. They were: vacuously, because no run could
    reach them.
  how_to_avoid_it: >
    Test the specific case above the general one, and write the general node's
    condition as the negation of the specific one where that is short enough to
    read. Where it is not, put a comment saying ORDERING IS LOAD-BEARING on the
    general node. Both, where both fit - the ordering makes it right today, the
    negation keeps it right after someone reorders the stage.
  never: >
    Never fix a shadowed TRAIN__ outcome by deleting it or by moving it out of the
    TRAIN__ prefix. That removes the guarantee and keeps the claim, which is worse
    than having neither. Work out what the node was for and restore the path to it.
  it_applies_to_every_prefix: >
    The rule above was read as a rule about TRAIN__ outcomes and it is not. The
    pass that fixed four dead TRAIN__ outcomes killed three no-train ones -
    NO_LLM__SETFIT, NO_LLM__ENCODER_FINETUNE and the reroute at
    S8_CLASSIFICATION_NEEDS_REASONING - by widening a general node's condition
    until it swallowed the specific nodes below it, and nothing caught it,
    because the reachability check was scoped to TRAIN__ outcomes. A dead
    NO_LLM__ outcome is invisible to a test that only looks at TRAIN__ ones. The
    no-train answers ARE the product; they are the last thing that should be
    allowed to die quietly.
  a_widened_bound_is_never_the_way_to_close_a_gap: >
    Both times this file has lost outcomes, the mechanism was a general node
    whose condition grew until it covered the specific nodes under it. If a fact
    set matches nothing, add a catch-all BELOW everything, where it cannot
    shadow. A default belongs last. That is the same sentence as
    how_to_avoid_it, applied to conditions instead of to ordering.
  checked_by: [RC5_FIXTURE_COVERAGE, RC8_NO_STAGE_RUNS_OFF_THE_END]

runtime_checks:
  - id: RC1_GATES_BEFORE_TRAIN
    rule: >
      for every fixture: if diagnosis.verdict == TRAIN then
      set(contract.required_gates) <= gates_passed_under(diagnosis.path,
      method_class(diagnosis.proposed_method))
    note: >
      This is the assertion ARCHITECTURE calls the most important test in the
      repository. It used to read `<= set(path)`, and that version is FORGEABLE by
      a run that passed a gate early under one method class and then proposed a
      method of another - the bypass in Finding 3. gates_passed_under filters gate
      entries by the row that applies to the final proposal's class, so a gate
      answered for a different class does not count.

  - id: RC2_GATE_ENTRY_IMPLIES_ITS_NODE
    rule: >
      for every position i where path[i].kind == "gate": path[i-1].kind == "node"
      and path[i-1].id == gates[path[i].id].node
    note: >
      Stops a gate entry being appended by anything other than the gate itself.
      Without this, RC1 is forgeable. Iterate positions - a gate may legitimately
      appear twice now, so list.index() checks only the first occurrence and would
      miss a forged second one.

  - id: RC3_MINT_IS_TERMINAL
    rule: "if verdict == TRAIN then path[-1].id == 'S9_MINT_TRAIN_VERDICT' and path[-1].kind == 'node'"

  - id: RC4_LEDGER_AGREES_WITH_PATH
    rule: >
      for every g in required_gates: gate_ledger[g].status == PASSED  <->
      g in gates_passed_under(path, method_class(proposed_method))

  - id: RC6_PATH_ENTRIES_ARE_WELL_FORMED
    rule: >
      every entry has kind in {node, gate}. kind == node implies row is null,
      clause is null, and id matches ^S[0-9]+_. kind == gate implies id matches
      ^G[0-9]_, row is one of {any, llm_weights, llm_efficiency, retriever_weights,
      classical_deep}, row == row_key(id, <the class in force when it was written>),
      and clause is a non-empty string.

  - id: RC7_NO_GATE_ENTRY_UNDER_A_ROW_THAT_DOES_NOT_EXIST
    rule: "for every gate entry e: gates[e.id].passes_when contains a row whose method_class == e.row and whose requires == e.clause"
    note: "Ties the audit trail to the file. A ledger the UI renders from must not be able to name a question the engine never asks."

  - id: RC8_NO_STAGE_RUNS_OFF_THE_END
    rule: >
      Randomized fact sets drawn over the declared ledger - including omitting
      any subset of the facts that have no default - must never raise. Not
      ERROR__NO_NODE_MATCHED, not ERROR__CYCLE, not a SpecError from reading an
      attribute off a null. Every run returns a Diagnosis.
    how: >
      Draw values per fact from its `enum`, `multi`, or type, omit each fact with
      some probability so the uninspectable case is exercised, and call
      diagnose(). 40,000 draws at each of several omission rates. Assert zero
      raises. This is a property test, not a fixture, because the shapes it finds
      are ones nobody thought to write a fixture for.
    what_it_caught: >
      Before this pass, 481 of 40,000 draws raised - 1.2%. 193 ERROR__NO_NODE_MATCHED
      in stage_8_classical (tabular_rows uninspectable), 127 ERROR__CYCLE in
      stage_7_efficiency and 106 in stage_8_classical (the three gate routes with
      no remedy), 26 SpecError on `failure_histogram.values()` against a null, and
      the rest spread over stages 4, 5, 6 and 7. After it, 600,000 draws across
      omission rates from 5% to 95% raise nothing.

      It also caught a FOURTH looping route that no gate was involved in and
      nobody had reported: S4_FORMAT_FIXED_CONTENT_STILL_WRONG rerouted to
      stage 1, which routes on the largest failure bucket, which is the bucket
      that sent the run to stage 4 in the first place. One draw in 400,000, and
      an infinite loop by construction rather than by bad luck. That is the
      argument for the check: the three gate loops were found by an adversary
      reading the file, and this one was not found by anybody until a fuzzer ran.
    why_it_is_a_runtime_check_and_not_a_review_rule: >
      Whether the last node of a stage is true for every run that can reach it is
      the same undecidable question `shadowing_rule` is honest about, approached
      from the other side. A grep cannot answer it. A fuzzer can find the
      counterexample, and a counterexample is all this needs.
    note: >
      A product whose entire pitch is an honest answer must not answer with a
      stack trace. ERROR__ outcomes are for engine bugs and they should stay that
      way - the fix is never to catch them at the top, it is to give the user the
      node they should have landed on.

  - id: RC5_FIXTURE_COVERAGE
    rule: >
      TWO HALVES WITH TWO DIFFERENT COUNTS, and conflating them is what made the
      old wording wrong twice over.

      THE MINTING HALF IS COUNTED PER OUTCOME, NOT PER NODE: one fact set for
      each of the nine values of S9_MINT_TRAIN_VERDICT.emits. NINE. It is per
      outcome because two proposing nodes can mint the same outcome - both
      S4_IDIOSYNCRATIC_FORMAT and S5_DEMONSTRATIONS_AVAILABLE mint
      TRAIN__LORA_SFT - and because the two nodes that propose UNSET mint
      whatever S9_SIZE_TO_METHOD lands on. See coverage_map below.

      THE FAILING HALF IS COUNTED PER PROPOSING NODE: one fact set per node
      carrying `propose:`, each flipping one fact so a gate fails at the sweep
      and the run is sent to the cheaper remedy. TWELVE, not ten. The old list
      named ten and omitted S6_GENUINELY_ABSENT and S8_VISION_AUDIO_GAP, both of
      which propose UNSET. The full list is proposing_nodes below; it is
      derivable by grepping this file for `propose:`, and it should be derived
      rather than transcribed, because transcribing it is how two went missing.

      SO THE RULE ASKS FOR TWENTY-ONE FACT SETS, not twenty. The failing halves
      are the ones that matter; they are the product.
    proposing_nodes:
      - S3_TRAIN_THE_RETRIEVER_NOT_THE_LLM   # EMBEDDING_FINETUNE
      - S3_DOMAIN_DIALECT_GAP                # CONTINUED_PRETRAINING
      - S4_IDIOSYNCRATIC_FORMAT              # LORA_SFT
      - S5_DEMONSTRATIONS_AVAILABLE          # LORA_SFT
      - S5_PREFERENCES_NOT_DEMONSTRATIONS    # DPO
      - S5_VERIFIABLE_REWARD                 # RL_GRPO
      - S6_GENUINELY_ABSENT                  # UNSET - omitted from the old list
      - S7_DISTILL                           # DISTILLATION
      - S8_TABULAR_DEEP_JUSTIFIED            # TABULAR_DEEP
      - S8_VISION_AUDIO_GAP                  # UNSET - omitted from the old list, and dead until this pass
      - S9_FULL_FT_JUSTIFIED                 # FULL_FINETUNE
      - S9_FROM_SCRATCH                      # FROM_SCRATCH
    what_the_repository_actually_holds: >
      Counted, not estimated, in tests/diagnosis_fixtures.py at the time this was
      written: 9 MINTING + 13 SPREAD + 3 CYCLING = 25 fact sets. The old wording
      promised twenty fixtures of a shape three of which could not be written -
      the three CYCLING ones - so it promised coverage the repository could not
      have had.

      Of the twelve failing halves the rule asks for, six fact sets exist and
      they cover three proposing nodes: S7_DISTILL (fails G4, fails G2),
      S8_TABULAR_DEEP_JUSTIFIED (fails G4, G2, G3) and
      S3_TRAIN_THE_RETRIEVER_NOT_THE_LLM (fails G3). NINE PROPOSING NODES STILL
      OWE A FAILING HALF: S3_DOMAIN_DIALECT_GAP, S4_IDIOSYNCRATIC_FORMAT,
      S5_DEMONSTRATIONS_AVAILABLE, S5_PREFERENCES_NOT_DEMONSTRATIONS,
      S5_VERIFIABLE_REWARD, S6_GENUINELY_ABSENT, S8_VISION_AUDIO_GAP,
      S9_FULL_FT_JUSTIFIED and S9_FROM_SCRATCH. That is a gap in the suite, named
      here rather than hidden behind a number that made it look closed.
    the_three_cycling_fact_sets_now_answer: >
      CYCLING existed because three on_fail routes had no terminal remedy and the
      walk looped until the cycle guard raised. All three are fixed - see
      S7_QUANTIZATION_UNTRIED, S7_CACHING_UNTRIED,
      S8_TABULAR_DEEP_NEEDS_HPARAM_SEARCH and
      S8_TABULAR_DEEP_NEEDS_FEATURE_WORK - so the CYCLING group is empty and the
      three fact sets belong in SPREAD with the answers they now give:
        tabular_deep_fails_g2  -> NO_DEEP__TUNE_THE_TREES_FIRST     @ S8_TABULAR_DEEP_NEEDS_HPARAM_SEARCH
        tabular_deep_fails_g3  -> NO_DEEP__FIND_THE_MISSING_FEATURE @ S8_TABULAR_DEEP_NEEDS_FEATURE_WORK
        distillation_fails_g2  -> NO_TRAIN__QUANTIZE                @ S7_QUANTIZATION_UNTRIED
      Until they are moved, the assertion that pins them raises red - which is
      what its own docstring says should happen when the graph is fixed.
    reachability_clause: >
      RC5 IS ALSO THE REACHABILITY CHECK, and that is the half that was missing.
      A minting fixture is a proof that the outcome can be reached at all, so the
      set of minting fixtures must cover all nine values of
      S9_MINT_TRAIN_VERDICT.emits, not merely all ten proposing nodes. Four of the
      nine could not be written before this pass; each of those four had a passing
      gate property that meant nothing, because no facts reached the node. If a
      minting fixture cannot be written for an outcome, the outcome is dead and the
      guarantee over it is vacuous - fix the graph, do not weaken the fixture.
    coverage_map:
      TRAIN__LORA_SFT:              [S5_DEMONSTRATIONS_AVAILABLE, S4_IDIOSYNCRATIC_FORMAT]
      TRAIN__DPO:                   [S5_PREFERENCES_NOT_DEMONSTRATIONS]
      TRAIN__RL_GRPO:               [S5_VERIFIABLE_REWARD]
      TRAIN__CONTINUED_PRETRAINING: [S3_DOMAIN_DIALECT_GAP]
      TRAIN__EMBEDDING_FINETUNE:    [S3_TRAIN_THE_RETRIEVER_NOT_THE_LLM]
      TRAIN__DISTILLATION:          [S7_DISTILL]
      TRAIN__TABULAR_DEEP:          [S8_TABULAR_DEEP_JUSTIFIED]
      TRAIN__FULL_FINETUNE:         [S9_FULL_FT_JUSTIFIED]
      TRAIN__FROM_SCRATCH:          [S9_FROM_SCRATCH]
    one_fixture_that_is_not_optional: >
      A retriever fixture that reaches S3_TRAIN_THE_RETRIEVER_NOT_THE_LLM with
      G3 already passed under llm_weights, and asserts that path ends up holding
      TWO G3 entries - one row llm_weights, one row retriever_weights. That is the
      only test that shows the latching bypass is closed rather than merely
      described.
  - id: RC9_NO_DEFAULT_OPENS_A_GATE
    rule: >
      diagnose({}) - the empty fact set, where every fact resolves through the
      ledger's declared default - passes no gate at all. And for every gate and
      every `passes_when` row, the row evaluated over the all-defaults fact set is
      false.
    note: >
      The DEFAULTED origin is admissible nowhere, so this is belt and braces
      rather than the mechanism. It is worth keeping anyway: it is what makes the
      claim "every default in this file is the pessimistic reading of nobody has
      done this yet" checkable instead of a thing the author believed while
      typing. A default edited from false to true, or from 0 to 100, breaks this
      and nothing else.

  - id: RC10_AN_ASSERTION_NEVER_MINTS
    rule: >
      For every fact set in the suite that reaches a TRAIN__ outcome: take the
      facts that any `passes_when` row READS, re-attribute every one of them
      ASSERTED, leave every value untouched, and diagnose again. No run may reach
      any TRAIN__ outcome.
    how: >
      Derive the fact names by parsing every gate row's `requires` with the
      engine's own condition compiler and intersecting with the ledger. Never
      write the list down. The six the adversary named - eval_size_n,
      baseline_measured, baseline_score, prompt_iterations, retrieval_tried,
      model_swap_tried - fall out of that derivation, and so does the fact
      somebody adds to a gate row next year.
    note: >
      This is the most important test in the repository after RC1, and it is RC1
      from the other side. RC1 asks whether the gates were passed. RC10 asks
      whether passing them meant anything. A run that satisfies RC1 entirely on
      assertions satisfies the letter of the invariant and none of the promise.
    and_it_must_be_mutation_checked: >
      Relax the origin requirement - widen admissible_for_gates.inspect to admit
      ASSERTED - and this test must go RED and must name the gate that let the
      assertion through. A test of a wall that passes when the wall is removed is
      testing nothing, and this repository has been bitten twice by exactly that.

# ---------------------------------------------------------------------------
# SOURCES.
#
# `year` is the publication year where this file already carries evidence of it -
# a venue year, or the YYMM in an arXiv id, or the edition year in a URL slug.
# Eleven of nineteen have that evidence; the other eight are null rather than
# guessed. `verified_on` is the date a human last opened the URL and confirmed it
# says what we claim it says. All nineteen are null: the field exists now, but
# nothing here has been re-verified, and writing a date we did not earn would be
# the same defect this document exists to prevent.
sources_policy:
  verified_on_null_means: "cite it, show it, and mark the number 'source not re-checked' in the UI"
