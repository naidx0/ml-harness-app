[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "four-asserts"
version = "0.1.0"
description = "Four things to assert about a run before its record counts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["testing", "evaluation", "provenance", "harness", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Source = "https://github.com/naidx0/four-asserts"

[tool.setuptools.packages.find]
include = ["four_asserts*"]
