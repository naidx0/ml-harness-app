# The pinned environment for the hf-peft-dpo recipe.
#
# Materialise it with, from the repository root:
#
#   uv venv --python 3.11 recipes/hf-peft-dpo/.venv
#   uv pip install --python recipes/hf-peft-dpo/.venv/Scripts/python.exe #       --index-url https://download.pytorch.org/whl/cu124 torch==2.6.0
#   uv pip sync --python recipes/hf-peft-dpo/.venv/Scripts/python.exe #       recipes/hf-peft-dpo/requirements.lock
#
# DELIBERATELY IDENTICAL TO `hf-peft-lora/requirements.lock`, AND THAT IS NOT A
# COPY-PASTE OVERSIGHT. trl 0.24 ships `SFTTrainer` and `DPOTrainer` in the same
# distribution, so the two recipes need the same forty-five pins. They are
# separate files because `recipe.toml` frames a recipe as a named backend a plan
# says out loud, and `app/jobspec.py` resolves the lock per directory - a shared
# lock would be one file two recipes could drift apart on, and the first time
# one of them needed a pin the other could not take, there would be nowhere to
# put it.
#
# torch is installed first and from a different index for `hf-peft-lora`'s
# reason, unchanged: PyPI's Windows torch wheel is CPU-only at 122 MB, the CUDA
# build is 2.75 GB and only exists on download.pytorch.org, and a run on the
# wrong one completes every setup step and is then silently twenty times slower.
# `entrypoint.py`'s preflight refuses to start on it.
#
# Disk cost: 4.8 GB, the same as the other recipe and NOT shared with it. That
# is per recipe and it is the number to show somebody before offering to build
# one.
#
# NOT YET MATERIALISED ON THIS MACHINE. The figures in `hf-peft-lora`'s header -
# peak VRAM, seconds, adapter size - come from a run that happened there. There
# is no such run here yet, so there are no figures here, and inventing them from
# the sibling would be inventing a measurement of something that never ran.

#
# ## WHY bitsandbytes IS PINNED HERE AND NOT YET USED HERE
#
# `hf-peft-lora` gained a 4-bit base on 2026-09-10, because a 1.7B LoRA in fp16
# peaked at 7.05 GiB on an 8 GiB card at sequence 512 and 4-bit took the same
# configuration to 1.79. The pins of the two recipes are asserted IDENTICAL by
# tests/test_a_preference_run_continues_an_sft_pass.py, and that assertion is
# worth keeping - two recipes on one trl distribution drifting apart is the
# thing it exists to catch - so the pin lands here too.
#
# IT IS NOT WIRED INTO THIS ENTRYPOINT, AND THE REASON IS A REAL ONE RATHER
# THAN A TODO. This recipe's `policy` is either the base model or the result of
# `PeftModel.merge_and_unload()` when continuing from an SFT adapter, and
# merging LoRA deltas into a 4-bit base is not a clean operation: the merge
# needs dequantised weights to add into. So QLoRA-DPO here needs a decision
# about WHERE the merge happens relative to the quantisation, which is a design
# question and not a line of config. Whoever takes it: that is the whole
# problem, and the fp16 path below is untouched and still correct.
