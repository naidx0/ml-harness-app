# The pinned environment for the hf-peft-lora recipe.
#
# Materialise it with, from the repository root:
#
#   uv venv --python 3.11 recipes/hf-peft-lora/.venv
#   uv pip install --python recipes/hf-peft-lora/.venv/Scripts/python.exe \
#       --index-url https://download.pytorch.org/whl/cu124 torch==2.6.0
#   uv pip sync --python recipes/hf-peft-lora/.venv/Scripts/python.exe \
#       recipes/hf-peft-lora/requirements.lock
#
# torch is installed first and from a different index on purpose. PyPI's
# torch wheel for Windows is CPU-only at 122 MB; the CUDA build is a 2.75 GB
# wheel that only exists on download.pytorch.org. A user who installs the
# wrong one completes every setup step, clicks train, and gets a silently
# CPU-bound run with no error - which is why entrypoint.py's preflight
# refuses to start on it rather than running twenty times slower in silence.
#
# Resolved and run on: Windows 11, Python 3.11.15, NVIDIA RTX 2060 SUPER
# (compute capability 7.5, 8 GB), driver 591.86, torch 2.6.0+cu124.
# torch.cuda.is_available() reports True there, and a LoRA fine-tune of
# HuggingFaceTB/SmolLM2-135M on 48 rows ran to completion through the harness:
# 20 steps, 921,600 trainable parameters of 135,436,608, 0.73 GB peak VRAM,
# 45.9 s of training inside 57.8 s wall clock, exit code 0, and a
# 3,702,168-byte adapter_model.safetensors on disk. Every figure in that
# sentence is from that run's own log, not from a vendor table.
#
# Disk cost of the materialised environment, measured with du immediately
# after this lock was resolved: 4.8 GB. That is per recipe, not shared, and it
# is the number to show a user before offering to build one.

