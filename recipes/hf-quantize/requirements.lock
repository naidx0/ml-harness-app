# The pinned environment for `recipes/hf-quantize`, resolved on the machine
# described below. Each recipe owns its own `.venv` beside this file:
# `hf-peft-lora` pins trl and peft, this one pins bitsandbytes, and a single
# shared environment would make one recipe's resolution the other's problem.
#
# BUILD IT IN TWO STEPS, AND THE ORDER MATTERS:
#
#       python -m venv recipes/hf-quantize/.venv
#       recipes/hf-quantize/.venv/Scripts/python.exe -m pip install \
#           --index-url https://download.pytorch.org/whl/cu124 torch==2.6.0
#       recipes/hf-quantize/.venv/Scripts/python.exe -m pip install \
#           -r recipes/hf-quantize/requirements.lock
#
# torch is installed first and from a different index on purpose. PyPI's torch
# wheel for Windows is CPU-only; the CUDA build only exists on
# download.pytorch.org. bitsandbytes' 4-bit kernels are CUDA-only, so a person
# who gets the wrong torch here does not get a slow run, they get a red
# preflight - which is the outcome this file exists to guarantee.
#
# RESOLVED AND MEASURED ON: Windows 11, NVIDIA GeForce RTX 2060 SUPER
# (compute capability 7.5, 8 GB), CUDA 12.4, Python 3.11.15 - MEASURED off
# the built interpreter on 2026-09-09. This line said 3.12 when it was
# written from memory, and that is exactly why the build steps moved into
# recipe.toml's [environment] table, where a test can reach them.
# bitsandbytes 0.50.2 ships a win_amd64 wheel, 39 MB, checked before this
# recipe was written rather than assumed.
